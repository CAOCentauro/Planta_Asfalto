<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7931E">
<title>Pagos de clientes</title>
<style>
:root{--bg:#f3f3f0;--card:#fff;--bd:#d9d9d3;--text:#1a1a1a;--muted:#66665f;--amb:#d97706;--amb-bg:#fff6e5;
  --ok:#15803d;--ok-bg:#eaf8ef;--warn:#9a4a06;--warn-bg:#fff1dc;--err:#b91c1c;--err-bg:#fdeaea;--in:#fbfbf9}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#151515;--bd:#2c2c2c;--text:#e8e8e8;--muted:#8d8d86;--amb:#f59e0b;--amb-bg:#2a1f08;
  --ok:#4ade80;--ok-bg:#0f2417;--warn:#fbbf24;--warn-bg:#2a2108;--err:#f87171;--err-bg:#2a1010;--in:#0f0f0f}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;padding-bottom:110px}
header{background:var(--card);border-bottom:3px solid var(--amb);padding:12px 16px;position:sticky;top:0;z-index:10}
header .in{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px}
header small{display:block;color:var(--muted);font-size:12px}
main{max-width:600px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px}
.card h2 .u{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--text);min-width:0}
textarea{min-height:60px;resize:vertical;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amb);outline-offset:0;border-color:var(--amb)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.saldo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:8px;background:var(--bg);margin-bottom:10px}
.saldo b{font-size:20px;font-variant-numeric:tabular-nums}
.pend{font-size:14px}
.pend div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--bd)}
.pend div:first-child{border-top:none}
.pend small{color:var(--muted)}
.pend .r{text-align:right;font-variant-numeric:tabular-nums}
.res{margin-top:10px;padding:9px 11px;border-radius:8px;font-size:14px}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--err-bg);color:var(--err)}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none}
.btn.p{background:var(--amb);border-color:var(--amb);color:#000;flex:1}
.btn.sm{font-size:14px;padding:8px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:8px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.hist div:first-child{border-top:none}
.hist b{color:var(--amb)}
.msg{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:576px;margin:0 auto;padding:12px 14px;border-radius:10px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;display:none}
.msg.on{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
</style>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header><div class="in">
  <div><h1>Pagos de clientes</h1><small id="h-op">—</small></div>
  <div style="display:flex;gap:6px">
    <button class="btn sm" onclick="limpiar(true)">Nuevo</button>
    <a class="btn sm" href="index.html">Inicio</a>
    <button class="btn sm" onclick="Sesion.salir()">Salir</button>
  </div>
</div></header>

<main>
  <!-- CLIENTE -->
  <div class="card">
    <h2>¿Quién pagó?</h2>
    <div class="f"><label>Cliente</label><input id="cliente" list="dl-clientes" autocapitalize="characters" placeholder="Escribe o elige" autocomplete="off"></div>
    <div id="cuenta"></div>
  </div>

  <!-- PAGO -->
  <div class="card">
    <h2>Datos del pago</h2>
    <div class="g2 f">
      <div><label>Fecha del pago</label><input type="date" id="fecha"></div>
      <div><label>Monto ($)</label><input id="monto" inputmode="decimal" placeholder="Ej. 150000"></div>
    </div>
    <div class="g2 f">
      <div><label>Forma de pago</label><select id="forma"></select></div>
      <div><label>Referencia / folio</label><input id="referencia" placeholder="opcional"></div>
    </div>
    <div class="f"><label>¿A qué producción se aplica?</label><select id="aplicado"></select>
      <div class="hint">Si no se sabe, déjalo en automático: se paga primero lo más antiguo.</div></div>
    <div class="f"><label>Notas</label><textarea id="notas" placeholder="opcional"></textarea></div>
  </div>

  <!-- RESULTADO -->
  <div class="card">
    <h2>Así queda la cuenta</h2>
    <div id="preview" class="hint">Elige el cliente y escribe el monto.</div>
  </div>

  <!-- GUARDADOS -->
  <div class="card" id="hist-card" style="display:none">
    <h2>Guardados en este equipo</h2>
    <div class="hist" id="hist"></div>
  </div>
</main>

<div class="msg" id="msg"></div>

<div class="bar"><div class="in">
  <button class="btn p" id="btn-send" onclick="enviar()">Guardar pago</button>
</div></div>

<datalist id="dl-clientes"></datalist>

<script src="sesion.js"></script>
<script src="cobranza.js"></script>
<script>
// Lo que deben sale de las producciones; aquí solo se registra el pago (hoja Pagos)
const LS = {
  get(k, d) { try { const v = localStorage.getItem('pag_'+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('pag_'+k, JSON.stringify(v)); } catch(e) {} },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(s) {
  s = String(s ?? '').trim().replace(/[\s$]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
const money = v => '$' + new Intl.NumberFormat('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 }).format(v || 0);
const fmt   = v => new Intl.NumberFormat('es-MX', { maximumFractionDigits:2 }).format(v || 0);
const hoy   = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fCorta = f => f ? new Date(f+'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' }) : '';
const nuevoId = () => 'P-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

let DATOS = { producciones:[], pagos:[], formas:[] }, ID = null;

async function cargarDatos() {
  const j = await Sesion.api({ action:'cobranza_datos' });
  DATOS = j;
  $('#forma').innerHTML = j.formas.map(f => `<option>${esc(f)}</option>`).join('');
  const nombres = [...new Set(j.producciones.filter(p => p.cliente && !Cobranza.EXCLUIDOS.includes(String(p.cliente).trim().toUpperCase()))
                    .map(p => String(p.cliente).trim().toUpperCase()))].sort();
  $('#dl-clientes').innerHTML = nombres.map(n => `<option value="${esc(n)}">`).join('');
}
const cuentaDe = (nombre, pagos) => Cobranza.calcular(DATOS.producciones, pagos, hoy())
  .find(c => c.cliente === String(nombre).trim().toUpperCase());

function recolectar() {
  return {
    id: ID,
    cliente: $('#cliente').value.trim().toUpperCase(),
    fecha: $('#fecha').value,
    monto: num($('#monto').value),
    forma: $('#forma').value,
    referencia: $('#referencia').value.trim(),
    aplicado_a: $('#aplicado').value,
    notas: $('#notas').value.trim(),
  };
}

// Cuenta actual del cliente y lista de producciones pendientes para elegir
function pintarCuenta() {
  const nombre = $('#cliente').value.trim().toUpperCase();
  const c = nombre ? cuentaDe(nombre, DATOS.pagos) : null;
  const sel = $('#aplicado'), prev = sel.value;
  sel.innerHTML = '<option value="">Automático (lo más antiguo primero)</option>' +
    (c ? c.pendientes.map(g => `<option value="${esc(g.id_prod)}">${fCorta(g.fecha)} · ${esc(g.id_prod)} · faltan ${money(g.pendiente)}</option>`).join('') : '');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;

  if (!nombre) { $('#cuenta').innerHTML = ''; return; }
  if (!c) { $('#cuenta').innerHTML = `<div class="res warn">Este cliente no tiene producciones. Si es un anticipo, quedará como saldo a favor. Revisa que el nombre esté bien escrito.</div>`; return; }
  $('#cuenta').innerHTML = `
    <div class="saldo"><span>${c.saldo < -Cobranza.TOL ? 'Saldo a favor' : 'Debe'}</span><b>${money(Math.abs(c.saldo))}</b></div>
    ${c.pendientes.length ? `<div class="pend">${c.pendientes.map(g => `<div>
        <span>${fCorta(g.fecha)} · ${esc(g.id_prod)}<br><small>${fmt(g.tons)} t · ${money(g.importe)}${g.pagado > Cobranza.TOL ? ` · pagado ${money(g.pagado)}` : ''} · hace ${g.dias} días</small></span>
        <span class="r">faltan<br><b>${money(g.pendiente)}</b></span></div>`).join('')}</div>`
      : '<div class="hint">No tiene producciones pendientes.</div>'}`;
}

// Cómo queda la cuenta si se guarda este pago
function previsualizar() {
  const p = recolectar(), el = $('#preview');
  if (!p.cliente || !p.monto) { el.className = 'hint'; el.innerHTML = 'Elige el cliente y escribe el monto.'; return; }
  const c = cuentaDe(p.cliente, [...DATOS.pagos, { ...p, id_pago:'~NUEVO', estado:'VIGENTE', fecha:p.fecha || hoy() }]);
  const nuevo = c.pagos.find(x => x.id_pago === '~NUEVO');
  const lineas = nuevo.aplicaciones.map(a => {
    const g = c.cargos.find(x => x.id_prod === a.id_prod);
    return `• ${esc(a.id_prod)} (${fCorta(g.fecha)}): ${money(a.monto)} → ${g.pendiente <= Cobranza.TOL ? '<b>queda pagada</b>' : `quedan ${money(g.pendiente)}`}`;
  });
  if (nuevo.resto > 0.005) lineas.push(`• ${money(nuevo.resto)} quedan como saldo a favor`);
  el.className = 'res ' + (c.saldo <= Cobranza.TOL ? 'ok' : 'warn');
  el.innerHTML = `Con este pago, <b>${esc(c.cliente)}</b> ${c.saldo < -Cobranza.TOL ? `queda con <b>${money(-c.saldo)}</b> a favor`
    : c.saldo <= Cobranza.TOL ? 'queda <b>al corriente</b>' : `queda debiendo <b>${money(c.saldo)}</b>`}.<br>${lineas.join('<br>')}`;
}

function alCambiar(e) {
  if (!e || e.target.id === 'cliente') pintarCuenta();
  previsualizar();
}

function limpiar(preguntar) {
  if (preguntar && !confirm('¿Borrar lo capturado y empezar un pago nuevo?')) return;
  ID = nuevoId();
  ['cliente','monto','referencia','notas'].forEach(k => $('#'+k).value = '');
  $('#fecha').value = hoy();
  alCambiar();
  window.scrollTo(0, 0);
}

async function enviar() {
  const p = recolectar(), err = [];
  if (!p.cliente) err.push('Falta el cliente');
  if (!p.monto || p.monto <= 0) err.push('Falta el monto');
  if (!p.fecha) err.push('Falta la fecha');
  else if (p.fecha > hoy()) err.push('La fecha es de un día que todavía no pasa');
  if (err.length) return aviso('Falta completar:<br>• ' + err.join('<br>• '), 'err', 6000);
  if (!confirm(`¿Guardar este pago?\n\n${p.cliente}\n${money(p.monto)} · ${p.forma}${p.referencia ? ' · ' + p.referencia : ''}\n${fCorta(p.fecha)}`)) return;

  const b = $('#btn-send'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    const j = await Sesion.api({ action:'pago', pago:p });
    const h = LS.get('hist', []);
    h.unshift({ id:j.id_pago, cliente:p.cliente, monto:p.monto, fecha:p.fecha });
    LS.set('hist', h.slice(0, 15)); pintarHist();
    aviso(`✓ Guardado como <b>${esc(j.id_pago)}</b>`, 'ok', 5000);
    await cargarDatos();
    limpiar(false);
  } catch(e) {
    aviso('No se pudo guardar: ' + esc(e.message) + '<br>No se borró nada; vuelve a intentar.', 'err', 8000);
  } finally { b.disabled = false; b.textContent = 'Guardar pago'; }
}

function pintarHist() {
  const h = LS.get('hist', []);
  $('#hist-card').style.display = h.length ? '' : 'none';
  $('#hist').innerHTML = h.map(x => `<div><span><b>${esc(x.id)}</b> · ${esc(x.cliente)}<br><small style="color:var(--muted)">${fCorta(x.fecha)}</small></span><span>${money(x.monto)}</span></div>`).join('');
}

let msgTimer;
function aviso(html, tipo = 'ok', ms = 4000) {
  const el = $('#msg');
  el.className = `msg on ${tipo}`; el.innerHTML = html;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => el.className = 'msg', ms);
  el.onclick = () => el.className = 'msg';
}

Sesion.requerir('pagos').then(async s => {
  $('#h-op').textContent = s.nombre;
  document.querySelector('main').addEventListener('input', alCambiar);
  document.querySelector('main').addEventListener('change', alCambiar);
  try { await cargarDatos(); } catch(e) { aviso('No se pudieron cargar las cuentas: ' + esc(e.message), 'err', 10000); }
  limpiar(false);
  pintarHist();
}).catch(e => aviso('No se pudo revisar la sesión: ' + esc(e.message), 'err', 10000));
</script>
</body>
</html>
