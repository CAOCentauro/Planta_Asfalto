<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7931E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>CAO Centauro</title>
<style>
:root{--bg:#f3f3f0;--card:#fff;--bd:#d9d9d3;--text:#1a1a1a;--muted:#66665f;--amb:#d97706;--amb-bg:#fff6e5;
  --ok:#15803d;--ok-bg:#eaf8ef;--err:#b91c1c;--err-bg:#fdeaea;--in:#fbfbf9}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#151515;--bd:#2c2c2c;--text:#e8e8e8;--muted:#8d8d86;--amb:#f59e0b;--amb-bg:#2a1f08;
  --ok:#4ade80;--ok-bg:#0f2417;--err:#f87171;--err-bg:#2a1010;--in:#0f0f0f}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;padding:16px}
.wrap{max-width:440px;margin:6vh auto 0}
.marca{margin-bottom:18px;display:flex;align-items:center;gap:12px}
.marca .logo{width:58px;height:58px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:2px}
.marca span{display:block;font-size:11px;color:var(--amb);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.marca strong{display:block;font-size:22px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--amb);border-radius:10px;padding:20px}
.card h1{font-size:17px;margin-bottom:4px}
.card p{color:var(--muted);font-size:13px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f{margin-bottom:12px;position:relative}
input{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--text)}
input:focus{outline:2px solid var(--amb);outline-offset:0;border-color:var(--amb)}
.ver{position:absolute;right:8px;bottom:8px;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px 6px}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer;width:100%}
.btn.p{background:var(--amb);border-color:var(--amb);color:#000}
.btn:disabled{opacity:.6;cursor:default}
.lnk{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:4px 0}
.res{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:14px}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.err{background:var(--err-bg);color:var(--err)}
.req{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.req .si{color:var(--ok)}
.hola{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.hola b{font-size:18px}
.hola small{color:var(--muted);font-size:13px}
.menu{display:flex;flex-direction:column;gap:10px}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--amb);border-radius:10px;padding:16px}
.tile:hover,.tile:focus{border-color:var(--amb);outline:none}
.tile b{display:block;font-size:16px}
.tile span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tile{display:flex;align-items:center;gap:14px}
.tile .ico{flex:none;width:46px;height:46px;border-radius:3px;background:var(--amb-bg);color:var(--amb);display:flex;align-items:center;justify-content:center}
.tile .ico svg{width:26px;height:26px}
.tile .tx{min-width:0}
.pie{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:16px}
.tile .cdo{margin-left:auto;flex:none;color:var(--muted);display:flex}
.tile .cdo svg{width:20px;height:20px}
.sep{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 -2px}
.oculto{display:none}
/* Cada negocio con su color (el mismo de la franja de arriba, sesion.js) */
#menu .tile,#menu .tile:hover,#menu .tile:focus{border-left-color:var(--neg,var(--amb))}
#menu .tile .ico{color:var(--neg,var(--amb));background:color-mix(in srgb,var(--neg,var(--amb)) 13%,transparent)}
</style>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wrap">
  <div class="marca"><img class="logo" src="logo.png" alt="CAO Construcción" width="58" height="58">
    <div><span>CAO Centauro</span><strong id="m-tit">Sistema</strong></div></div>

  <!-- ENTRAR -->
  <form class="card oculto" id="v-login" onsubmit="entrar(event)">
    <h1>Entrar</h1>
    <p>Acceso restringido — personal autorizado</p>
    <div class="f"><label for="usuario">Usuario</label>
      <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="f"><label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" autocomplete="current-password">
      <button type="button" class="ver" onclick="verClave('contrasena', this)">Ver</button></div>
    <button class="btn p" id="b-entrar">Entrar</button>
    <div class="res" id="r-login"></div>
  </form>

  <!-- CAMBIAR CONTRASEÑA -->
  <form class="card oculto" id="v-cambio" onsubmit="cambiar(event)">
    <h1>Cambiar contraseña</h1>
    <p>Escribe la actual y la nueva dos veces para confirmar.</p>
    <div class="f" id="f-actual"><label for="actual">Contraseña actual</label>
      <input id="actual" type="password" autocomplete="current-password"></div>
    <div class="f"><label for="nueva">Contraseña nueva</label>
      <input id="nueva" type="password" autocomplete="new-password" oninput="revisarNueva()">
      <button type="button" class="ver" onclick="verClave('nueva', this)">Ver</button></div>
    <div class="f"><label for="nueva2">Repite la contraseña nueva</label>
      <input id="nueva2" type="password" autocomplete="new-password" oninput="revisarNueva()"></div>
    <div class="req" id="req"></div>
    <button class="btn p" id="b-cambiar">Guardar contraseña</button>
    <div class="pie" id="c-pie"><button type="button" class="lnk" onclick="mostrarMenu()">← Volver</button></div>
    <div class="res" id="r-cambio"></div>
  </form>

  <!-- MENÚ -->
  <div class="oculto" id="v-menu">
    <div class="hola"><b id="m-nombre">—</b><small id="m-perfil"></small></div>
    <div class="menu" id="menu"></div>
    <div class="pie">
      <button class="lnk" onclick="abrirCambio()">Cambiar mi contraseña</button>
      <button class="lnk oculto" id="b-pin" onclick="cambiarPin()">Cambiar mi PIN</button>
    </div>
    <div class="res" id="r-menu"></div>
  </div>
</div>

<script src="sesion.js"></script>
<script>
// Pantallas del sitio; cada perfil ve solo las que el servidor le permite
const PANTALLAS = {
  dashboard: { t:'Panel de control',   d:'Producción, finanzas, reportes del operador',    href:'dashboard.html' },
  registro:  { t:'Registro de planta', d:'Captura diaria de producción y tanques',          href:'registro.html'  },
  // Misma pantalla que Registro, abierta en su pestaña Corregir (solo con ese permiso)
  registro_corregir: { t:'Corregir registros', d:'Lo que se registró hace menos de 4 días, con motivo', href:'registro.html?tab=corregir', de:'registro', perm:'corregir_planta' },
  pagos:     { t:'Pagos de clientes',  d:'Registrar lo que pagan los clientes y ver cuánto deben', href:'pagos.html' },
  viajes:    { t:'Fletes de la semana', d:'Viajes por día, cliente y camión, con las notas de viaje', href:'viajes.html' },
  // Misma pantalla que Fletes, abierta en su pestaña de subir notas
  viajes_subir: { t:'Subir notas de viaje', d:'Fotos de las notas por lote o a mano, la IA las lee y tú revisas', href:'viajes.html#subir', de:'viajes' },
  viajes_diesel: { t:'Diésel de la semana', d:'Litros y gasto por camión y chofer · facturado y recibido', href:'viajes.html#diesel', de:'viajes' },
  viajes_tickets: { t:'Subir tickets de diésel', d:'Fotos de los tickets por lote o a mano, la IA los lee y tú revisas', href:'viajes.html#tickets', de:'viajes' },
  nomina:    { t:'Nómina',            d:'Préstamos, faltas y pago de los sábados al personal', href:'nomina.html' },
  usuarios:  { t:'Usuarios',          d:'Quién tiene acceso, perfiles, permisos y contraseñas', href:'usuarios.html' },
};
// Primero se elige el negocio y luego sus pantallas. "General" es de todos los negocios (la nómina se ve junta).
const NEGOCIOS = [
  { clave:'planta',  t:'Planta de asfalto', d:'Producción, reportes del operador y pagos de clientes', pantallas:['dashboard','registro','registro_corregir','pagos'] },
  { clave:'viajes',  t:'Viajes locales',    d:'Acarreos de material: fletes, notas de viaje y diésel', pantallas:['viajes','viajes_subir','viajes_diesel','viajes_tickets'] },
  { clave:'general', t:'General',           d:'Nómina y usuarios',                                     pantallas:['nomina','usuarios'] },
];
const MIN = 8;

// Íconos del menú (Tabler Icons, licencia MIT: tabler.io/icons), dibujados aquí para que carguen sin internet
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONOS = {
  dashboard: svg('<path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/>'),                                  // chart-line
  registro:  svg('<path d="M3 21h18"/><path d="M5 21v-12l5 4v-4l5 4h4"/><path d="M19 21v-8l-1.436 -9.574a.5 .5 0 0 0 -.495 -.426h-1.145a.5 .5 0 0 0 -.494 .418l-1.43 8.582"/><path d="M9 17h1"/><path d="M14 17h1"/>'),   // building-factory-2
  compras:   svg('<path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17h-11v-14h-2"/><path d="M6 5l14 1l-1 7h-13"/>'),   // shopping-cart
  pagos:     svg('<path d="M15 11v.01"/><path d="M5.173 8.378a3 3 0 1 1 4.656 -1.377"/><path d="M16 4v3.803a6.019 6.019 0 0 1 2.658 3.197h1.341a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-1.342c-.336 .95 -.907 1.8 -1.658 2.473v2.027a1.5 1.5 0 0 1 -3 0v-.583a6.04 6.04 0 0 1 -1 .083h-4a6.04 6.04 0 0 1 -1 -.083v.583a1.5 1.5 0 0 1 -3 0v-2l0 -.027a6 6 0 0 1 4 -10.473h2.5l4.5 -3h0z"/>'),   // pig-money
  // users-group un poco más chico, con un billete encima en la esquina
  nomina:    svg('<g transform="translate(-.6 -.8) scale(.86)"><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1"/><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M17 10h2a2 2 0 0 1 2 2v1"/><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M3 13v-1a2 2 0 0 1 2 -2h2"/></g>'
             + '<rect x="13.2" y="15.2" width="9.6" height="6.6" rx="1.2" style="fill:var(--amb-bg)" stroke-width="1.7"/><circle cx="18" cy="18.5" r="1.3" stroke-width="1.5"/>'),
  registro_corregir: svg('<path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/>'),   // pencil
  candado:   svg('<path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/>'),   // lock
  viajes:    svg('<path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"/>'),   // truck
  viajes_subir: svg('<path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/>'),   // photo
  viajes_diesel: svg('<path d="M14 11h1a2 2 0 0 1 2 2v3a1.5 1.5 0 0 0 3 0v-7l-3 -3"/><path d="M4 20v-14a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v14"/><path d="M3 20l12 0"/><path d="M18 7v1a1 1 0 0 0 1 1h1"/><path d="M4 11l10 0"/>'),   // gas-station
  viajes_tickets: svg('<path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2"/><path d="M14 8h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5m2 0v1.5m0 -9v1.5"/>'),   // receipt
  planta:    svg('<path d="M3 21h18"/><path d="M5 21v-12l5 4v-4l5 4h4"/><path d="M19 21v-8l-1.436 -9.574a.5 .5 0 0 0 -.495 -.426h-1.145a.5 .5 0 0 0 -.494 .418l-1.43 8.582"/><path d="M9 17h1"/><path d="M14 17h1"/>'),   // building-factory-2
  general:   svg('<path d="M3 7m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/><path d="M8 7v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2"/><path d="M12 12l0 .01"/><path d="M3 13a20 20 0 0 0 18 0"/>'),   // briefcase
  usuarios:  svg('<path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0z"/><path d="M15 9h.01"/>'),   // key
};

// Registro incluye Compras: el título cambia según lo que el perfil pueda hacer ahí
function tile(p, s) {
  let { t, d, href } = PANTALLAS[p], ico = ICONOS[p] || '';
  if (p === 'registro') {
    const per = s.permisos || ['registro'], r = per.includes('registro'), c = per.includes('compras');
    if (r && c) d = 'Captura diaria de producción y tanques · Compras';
    else if (c) { t = 'Compras'; d = 'Facturas de asfalto, alterno, diésel y gasolina'; ico = ICONOS.compras; }
  }
  const candado = Sesion.conCandado(p) ? `<span class="cdo" title="Pide tu PIN">${ICONOS.candado}</span>` : '';
  return `<a class="tile" href="${href}"><div class="ico">${ico}</div><div class="tx"><b>${t}</b><span>${d}</span></div>${candado}</a>`;
}

const $ = s => document.querySelector(s);

function vista(id) {
  ['v-login','v-cambio','v-menu'].forEach(v => $('#'+v).classList.toggle('oculto', v !== id));
  if (id === 'v-login') Sesion.franja(null);
}
const colorNeg = clave => (Sesion.NEGOCIOS[clave] || Sesion.NEGOCIOS.inicio).c;
// Del servidor o de la red: su mensaje tal cual. Otro error es de la página (p. ej. archivos viejos guardados)
const errorTxt = e => e.servidor || e.red ? e.message
  : `Error en la página: ${e.message}. Recarga con Ctrl+F5 (en el celular, cierra y vuelve a abrir).`;
function res(id, txt, tipo = 'err') { const el = $('#'+id); el.className = 'res ' + (txt ? tipo : ''); el.textContent = txt || ''; }
function verClave(id, b) { const i = $('#'+id); i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'Ver' : 'Ocultar'; }

// ── Entrar ─────────────────────────────────
async function entrar(ev) {
  ev.preventDefault();
  const usuario = $('#usuario').value.trim(), contrasena = $('#contrasena').value;
  if (!usuario || !contrasena) return res('r-login', 'Escribe tu usuario y contraseña');
  const b = $('#b-entrar'); b.disabled = true; b.textContent = 'Entrando…'; res('r-login', '');
  try {
    const j = await Sesion.api({ action:'login', usuario, contrasena });
    Sesion.guardar(j);
    $('#contrasena').value = '';
    if (j.pantallas.length === 1 && PANTALLAS[j.pantallas[0]]) location.href = PANTALLAS[j.pantallas[0]].href;   // operador: directo a su pantalla
    else mostrarMenu();
  } catch(e) {
    res('r-login', errorTxt(e));
  } finally { b.disabled = false; b.textContent = 'Entrar'; }
}

// ── Menú: primero los negocios, luego las pantallas del elegido ──
let NEG = new URLSearchParams(location.search).get('n');     // ?n=viajes al volver de una pantalla

function abrirNegocio(clave) {
  NEG = clave;
  history.replaceState(null, '', clave ? 'index.html?n=' + clave : 'index.html');
  mostrarMenu();
}

function mostrarMenu() {
  const s = Sesion.leer();
  if (!s?.token) return vista('v-login');
  $('#m-nombre').textContent = s.nombre;
  $('#m-perfil').textContent = s.perfil_nombre || s.perfil;
  // Una tarjeta con "de" se ve si el perfil tiene esa pantalla (p. ej. Subir notas va dentro de viajes)
  const ps = Object.keys(PANTALLAS).filter(p => (s.pantallas || []).includes(PANTALLAS[p].de || p)
                                             && (!PANTALLAS[p].perm || (s.permisos || []).includes(PANTALLAS[p].perm)));
  const negs = NEGOCIOS.filter(n => n.pantallas.some(p => ps.includes(p)));
  const neg = negs.length === 1 ? negs[0] : negs.find(n => n.clave === NEG);   // con un solo negocio se entra directo
  $('#m-tit').textContent = neg ? neg.t : 'Sistema';
  Sesion.franja(neg ? neg.clave : 'inicio');
  if (neg) $('#menu').style.setProperty('--neg', colorNeg(neg.clave)); else $('#menu').style.removeProperty('--neg');

  if (!ps.length) {
    $('#menu').innerHTML = '<div class="res err">Tu perfil todavía no tiene pantallas asignadas. Pide que te den permisos.</div>';
  } else if (!neg) {
    $('#menu').innerHTML = negs.map(n => `<a class="tile" style="--neg:${colorNeg(n.clave)}" href="index.html?n=${n.clave}" onclick="event.preventDefault();abrirNegocio('${n.clave}')">
      <div class="ico">${ICONOS[n.clave]}</div><div class="tx"><b>${n.t}</b><span>${n.d}</span></div></a>`).join('');
  } else {
    // Las que tienen candado van al final, aparte
    const del = neg.pantallas.filter(p => ps.includes(p));
    const libres = del.filter(p => !Sesion.conCandado(p)), conCdo = del.filter(p => Sesion.conCandado(p));
    $('#menu').innerHTML = (negs.length > 1 ? `<button class="lnk" style="align-self:flex-start" onclick="abrirNegocio(null)">← Menú principal</button>` : '')
      + libres.map(p => tile(p, s)).join('')
      + (conCdo.length ? `<div class="sep">Con candado · piden tu PIN</div>` + conCdo.map(p => tile(p, s)).join('') : '');
  }
  $('#b-pin').classList.toggle('oculto', !(s.candados?.zonas || []).length);
  $('#b-pin').textContent = s.tiene_pin ? 'Cambiar mi PIN' : 'Crear mi PIN';
  vista('v-menu');
}

// ── PIN del candado (se crea o cambia con la contraseña) ──
async function cambiarPin() {
  if (await Sesion.cambiarPin()) { mostrarMenu(); res('r-menu', '✓ PIN guardado', 'ok'); }
}

// ── Cambiar contraseña (opcional, desde el menú) ──
function abrirCambio() {
  ['actual','nueva','nueva2'].forEach(k => $('#'+k).value = '');
  res('r-cambio', ''); revisarNueva();
  vista('v-cambio');
  $('#actual').focus();
}
function revisarNueva() {
  const n = $('#nueva').value, n2 = $('#nueva2').value;
  const largo = n.length >= MIN, iguales = n && n === n2;
  $('#req').innerHTML = `<span class="${largo ? 'si' : ''}">${largo ? '✓' : '•'} Al menos ${MIN} caracteres</span> &nbsp;
    <span class="${iguales ? 'si' : ''}">${iguales ? '✓' : '•'} Las dos coinciden</span>`;
  return largo && iguales;
}
async function cambiar(ev) {
  ev.preventDefault();
  const actual = $('#actual').value;
  if (!actual) return res('r-cambio', 'Escribe tu contraseña actual');
  if (!revisarNueva()) return res('r-cambio', $('#nueva').value.length < MIN
    ? `La contraseña nueva debe tener al menos ${MIN} caracteres` : 'Las dos contraseñas nuevas no coinciden');
  const b = $('#b-cambiar'); b.disabled = true; b.textContent = 'Guardando…'; res('r-cambio', '');
  try {
    const j = await Sesion.api({ action:'cambiar_contrasena', actual, nueva:$('#nueva').value });
    Sesion.guardar(j);
    mostrarMenu();
    res('r-menu', '✓ Contraseña guardada', 'ok');
  } catch(e) {
    res('r-cambio', errorTxt(e));
  } finally { b.disabled = false; b.textContent = 'Guardar contraseña'; }
}

// ── Inicio ─────────────────────────────────
(async () => {
  const m = new URLSearchParams(location.search).get('m');
  const s = Sesion.leer();
  if (!s?.token) {
    vista('v-login');
    if (m === 'vencida') res('r-login', 'Tu sesión terminó. Vuelve a entrar.');
    return $('#usuario').focus();
  }
  mostrarMenu();
  try {                                                                // refresca perfil y pantallas
    const j = await Sesion.api({ action:'yo' });
    Sesion.guardar({ ...s, ...j, token:s.token });
    mostrarMenu();
  } catch(e) {}
})();
</script>
