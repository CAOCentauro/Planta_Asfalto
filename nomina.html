<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7931E">
<title>Nómina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Estilo de caocentauro.com: Outfit en títulos, Inter en texto, casi negro + azul pizarra + naranja del logo,
   esquinas poco redondeadas y puntitos de color en lugar de íconos */
:root{--bg:#F3F7FA;--card:#fff;--bd:#dce3e9;--text:#0d141a;--muted:#5d6d78;--in:#fff;
  --brand:#F7931E;--brand-bg:#fff4e6;--btn:#3D5A6C;--btn-ink:#fff;--sel:#e9eff3;--panel:#0d141a;--panel-ink:#fff;--stripe:#0d141a;
  --ok:#1b7a43;--ok-bg:#e5f4eb;--warn:#a65300;--warn-bg:#fff1df;--err:#b42318;--err-bg:#fdeceb;--loan:#6a41b8;--loan-bg:#f1ebfb;
  --t-pago:#3D5A6C;--t-prestamo:#6a41b8;--t-falta:#d93025;--t-deduccion:#c25400;--t-premio:#1e8e3e;--t-dias:#80868b;
  --r:4px;--r-sm:3px;
  --f-tit:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-txt:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b1116;--card:#141d24;--bd:#26333d;--text:#e8eef2;--muted:#93a3ae;--in:#0f171d;
  --brand:#F7931E;--brand-bg:#2a1c0b;--btn:#4b6d82;--btn-ink:#fff;--sel:#1d2a33;--panel:#1c2832;--panel-ink:#fff;--stripe:#33424d;
  --ok:#5fd18e;--ok-bg:#10281a;--warn:#f2b45c;--warn-bg:#2b1f0c;--err:#f28b82;--err-bg:#2c1210;--loan:#c3a6f5;--loan-bg:#231a35;
  --t-pago:#8fb3c9;--t-prestamo:#b794f6;--t-falta:#f28b82;--t-deduccion:#f6a35b;--t-premio:#6fd39a;--t-dias:#9aa0a6}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--f-txt);font-size:16px;line-height:1.45;padding-bottom:110px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-tit);font-weight:600;letter-spacing:-.01em}
header{background:var(--card);padding:12px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--bd)}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand) 0 96px,var(--stripe) 96px)}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:21px;line-height:1.15}
header small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .in>div:first-child{min-width:0}
header .in>div:last-child{flex:none}
header .btn.sm{padding:6px 9px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.card h2{font-size:17px;margin-bottom:10px}
.card h2 .u{display:block;font-family:var(--f-txt);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:1px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:10px 11px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--in);color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--btn);outline-offset:0;border-color:var(--btn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.num{font-variant-numeric:tabular-nums}
.res{padding:9px 11px;border-radius:var(--r-sm);font-size:14px;background:var(--bg)}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--err-bg);color:var(--err)}
.res.loan{background:var(--loan-bg);color:var(--loan)}
.btn{font:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.p{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);flex:1}
.btn.sm{font-size:13.5px;padding:7px 11px}
.btn.okb{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.banner{padding:10px 12px;border-radius:var(--r-sm);font-size:14px;background:var(--brand-bg);color:var(--text);border-left:3px solid var(--brand);display:flex;align-items:center;gap:8px}
.msg{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;padding:12px 14px;border-radius:var(--r);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.22);z-index:30;display:none;align-items:center;gap:10px}
.msg.on{display:flex}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg span{flex:1}
.msg button{font:inherit;font-weight:700;background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer}
.oculto{display:none !important}

/* Puntitos de color (en lugar de íconos) */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.t-pago{--c:var(--t-pago)} .t-prestamo{--c:var(--t-prestamo)} .t-falta{--c:var(--t-falta)}
.t-deduccion{--c:var(--t-deduccion)} .t-premio{--c:var(--t-premio)} .t-dias{--c:var(--t-dias)}
.dot[class*="t-"]{background:var(--c)}
.dot.d-brand{background:var(--brand)} .dot.d-ok{background:var(--ok)} .dot.d-warn{background:var(--warn)} .dot.d-loan{background:var(--loan)}

/* Pestañas: subrayado como el menú de caocentauro.com */
.tabs{max-width:560px;margin:4px auto 0;padding:0 12px;display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;font-family:var(--f-tit);font-size:15.5px;font-weight:500;padding:12px 4px 10px;border:none;background:none;color:var(--muted);cursor:pointer;box-shadow:inset 0 -3px 0 transparent}
.tabs button.on{color:var(--text);font-weight:600;box-shadow:inset 0 -3px 0 var(--brand)}

/* Botones de opción */
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{font:inherit;font-size:15px;font-weight:600;padding:11px 10px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--in);color:var(--text);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.op .l{display:flex;align-items:center;gap:8px}
.op small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);padding-left:17px}
.op.on{border-color:var(--btn);background:var(--sel);box-shadow:inset 0 0 0 1px var(--btn)}
.ops3 .op,.ops .op.c{text-align:center;align-items:center}
.ops3{grid-template-columns:1fr 1fr 1fr}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13.5px;font-weight:500;padding:7px 11px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--in);color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.chip.on{border-color:var(--text);background:var(--text);color:var(--card)}
.chip small{font-weight:400;opacity:.8}

/* Trabajadores */
.grp{font-family:var(--f-tit);font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 2px -4px;display:flex;justify-content:space-between}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wt{font:inherit;text-align:left;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--brand);border-radius:var(--r-sm);padding:10px 11px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:3px;min-height:86px}
.wt b{font-family:var(--f-tit);font-size:15.5px;font-weight:600;line-height:1.2}
.wt small{font-size:12px;color:var(--muted)}
.wt .st{margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 7px 2px 6px;border-radius:var(--r-sm);white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.p-debe{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-loan{background:var(--loan-bg);color:var(--loan)}
.saldo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg);margin-top:10px}
.saldo b{font-family:var(--f-tit);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wtop b{font-family:var(--f-tit);font-size:20px;font-weight:600;display:block;line-height:1.2}
.wtop small{color:var(--muted);font-size:13px}

/* Monto */
.money{display:flex;align-items:center;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--in);padding:0 12px}
.money:focus-within{outline:2px solid var(--btn);border-color:var(--btn)}
.money span{font-family:var(--f-tit);font-size:22px;font-weight:600;color:var(--muted)}
.money.mas span{color:var(--t-premio)} .money.menos span{color:var(--t-deduccion)}
.money input{border:none;background:none;font-family:var(--f-tit);font-size:28px;font-weight:600;padding:8px 6px;outline:none}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--in);padding:6px}
.stepper button{font:inherit;width:48px;height:44px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:22px;font-weight:600;cursor:pointer}
.stepper .v{text-align:center;font-family:var(--f-tit);font-size:26px;font-weight:600}
.stepper .v small{display:block;font-family:var(--f-txt);font-size:12px;font-weight:400;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:3px;border:1px solid var(--bd)}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:500;padding:8px 4px;border-radius:2px;border:none;background:none;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* Desgloses y listas */
.calc{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:15px}
.calc span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.calc .big{font-family:var(--f-tit);font-size:19px;font-weight:600;padding-top:6px;border-top:1px solid var(--bd);margin-top:4px}
.calc .mu{color:var(--muted)}
.lst>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);font-size:14px}
.lst>div:first-child{border-top:none}
.lst .dot{margin:0 3px}
.lst .g{flex:1;min-width:0}
.lst .g b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .g small,.lst .r small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.lst .r b{font-size:15px}
.lst .x{font:inherit;font-size:12.5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);border-radius:var(--r-sm);padding:4px 8px;cursor:pointer;flex:none}
.lst .anul{opacity:.5}
.lst .anul b{text-decoration:line-through}
.lst button.rowb{all:unset;display:flex;align-items:center;gap:10px;width:100%;cursor:pointer}
.c-ok{color:var(--t-premio)} .c-err{color:var(--t-deduccion)} .c-loan{color:var(--loan)} .c-warn{color:var(--warn)}
.c-falta{color:var(--t-falta)}

/* Resumen */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .w{text-align:center}
.weeknav .w b{display:block;font-family:var(--f-tit);font-size:17px;font-weight:600}
.weeknav .w small{font-size:12px;color:var(--muted)}
.kpi-main{background:var(--panel);border-color:var(--panel);border-left:4px solid var(--brand);color:var(--panel-ink)}
.kpi-main small{font-size:13px;opacity:.75}
.kpi-main .v{font-family:var(--f-tit);font-size:36px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis .card{padding:10px 12px}
.kpis small{font-size:12px;color:var(--muted);display:block}
.kpis b{font-family:var(--f-tit);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.filt{display:flex;flex-direction:column;gap:8px}

/* Hoja inferior */
.ov{position:fixed;inset:0;background:rgba(13,20,26,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90dvh;overflow:auto;border-radius:6px 6px 0 0;border-top:3px solid var(--brand);padding:14px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:19px}
.sheet h3 small{display:block;font-family:var(--f-txt);font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
</style>
</head>

  <div><h1>Nómina</h1><small id="h-op">—</small></div>
  <div style="display:flex;gap:6px">
    <button class="btn sm" data-act="recargar" title="Traer lo último que registraron los demás">Actualizar</button>
    <a class="btn sm" href="index.html" title="Menú de inicio">Inicio</a>

</div></header>

<main id="main"><div class="card hint">Cargando…</div></main>

<div class="bar oculto" id="bar"><div class="in" id="bar-in"></div></div>

<script src="sesion.js"></script>
<script>
/**
 * Nómina semanal (lunes a domingo, se paga el sábado). Los datos vienen de Nomina.gs;
 * los saldos se calculan aquí:
 *   por semana: días trabajados × (sueldo ÷ días) + premios − deducciones − préstamos − pagos
 *   saldo: la suma de todas las semanas desde que entró a la nómina (lo que sobra o falta se arrastra)
 * Préstamo = dinero que se le da antes del sábado; se descuenta de esa semana y, si es más de lo que
 * ganó, de las siguientes. Pago = el pago del sábado (botón "Pagar nómina").
 */
const DIA_PAGO = 6;   // sábado
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const soloDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const lunes = d => { const x = soloDia(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const mismoDia = (a, b) => a.toDateString() === b.toDateString();
const enSemana = (f, lun) => f >= lun && f < addDays(lun, 7);
const money = n => { const r = Math.round(n); return (r < 0 ? '−' : '') + '$' + Math.abs(r).toLocaleString('es-MX'); };
const fdias = n => String(Math.round(n * 100) / 100);
const fCorta = d => d.getDate() + ' ' + MESES[d.getMonth()];
const fHora = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const isoDia = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const deIso = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d, 12, 0); };
const wkLabel = lun => fCorta(lun) + ' – ' + fCorta(addDays(lun, 6));
const cap = s => s[0].toUpperCase() + s.slice(1);
const nuevaClave = () => 'N-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
function num(s) {                                        // mismo criterio que pagos.html
  s = String(s ?? '').trim().replace(/[\s$]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}

// ── Datos (se llenan con cargar()) ───────────────────────────────────
let HOY = new Date(), INICIO = lunes(HOY);
let W = [], MOV = [], LUGARES = [], FORMAS = ['Efectivo', 'Transferencia'], PUEDE_EQUIPO = false, SESION = null;
let cargadoEn = 0;

const wById = id => W.find(w => w.id === id);
const activos = () => W.filter(w => w.activo);
const tarifa = (w, lun) => { let t = w.hist[0] || { salario:0, dias:6 }; for (const h of w.hist) if (h.desde <= lun) t = h; return t; };

const TIPOS = {
  prestamo:  { t: 'Préstamo',        dinero: true  },
  pago:      { t: 'Pago de nómina',  dinero: true  },
  falta:     { t: 'Falta',           dinero: false },
  dias:      { t: 'Días exactos',    dinero: false },
  premio:    { t: 'Premio',          dinero: true  },
  deduccion: { t: 'Deducción',       dinero: true  },
};
const punto = tipo => `<span class="dot t-${tipo}"></span>`;      // cada tipo tiene su color (ver .t-*)
const colorTipo = { falta: 'c-falta', deduccion: 'c-err', prestamo: 'c-loan', premio: 'c-ok' };
const vigentes = () => MOV.filter(m => !m.anulado);
const ordenMov = (a, b) => (b.fecha - a.fecha) || (b.registrado - a.registrado);

function movDeServidor(m) {
  return { id: m.id_mov, fecha: deIso(m.fecha), wid: Number(m.id_trabajador), tipo: m.tipo, valor: Number(m.valor),
           nota: m.nota || '', por: m.capturo || '', forma: m.forma || '',
           registrado: m.registrado ? new Date(m.registrado) : deIso(m.fecha),
           anulado: m.estado === 'ANULADO' ? { por: m.anulado_por || '', motivo: m.motivo_anulacion || '' } : null };
}

async function cargar() {
  const j = await Sesion.api({ action: 'nomina_datos' });
  HOY = new Date();
  W = j.trabajadores.map(t => ({
    id: Number(t.id), nombre: String(t.nombre || ''), puesto: String(t.puesto || '') || 'Sin puesto', lugar: String(t.lugar || '') || 'Sin lugar',
    forma: t.forma || 'Efectivo', cuenta: String(t.cuenta || ''), activo: t.activo !== false,
    alta: t.alta ? lunes(deIso(t.alta)) : null,
    hist: j.sueldos.filter(s => Number(s.id_trabajador) === Number(t.id))
      .map(s => ({ desde: lunes(deIso(s.desde)), salario: Number(s.salario), dias: Number(s.dias) }))
      .sort((a, b) => a.desde - b.desde),
  })).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  MOV = j.movimientos.map(movDeServidor);
  LUGARES = j.lugares;
  FORMAS = j.formas || FORMAS;
  PUEDE_EQUIPO = !!j.puede_equipo;
  const altas = W.map(w => w.alta).filter(Boolean);
  INICIO = altas.length ? new Date(Math.min(...altas)) : lunes(HOY);
  if (S.sem < INICIO) S.sem = lunes(HOY);
  cargadoEn = Date.now();
}

// ── Cálculos ─────────────────────────────────────────────────────────
function semana(w, lun) {
  const ms = vigentes().filter(m => m.wid === w.id && enSemana(m.fecha, lun));
  const sum = t => ms.filter(m => m.tipo === t).reduce((a, m) => a + m.valor, 0);
  const tf = tarifa(w, lun), pd = tf.dias ? tf.salario / tf.dias : 0;
  const exacto = ms.filter(m => m.tipo === 'dias').sort((a, b) => (a.fecha - b.fecha) || (a.registrado - b.registrado)).pop();
  const faltas = sum('falta');
  const trabajados = exacto ? exacto.valor : Math.max(0, tf.dias - faltas);
  const premios = sum('premio'), deducc = sum('deduccion');
  const sueldo = trabajados * pd, ganado = sueldo + premios - deducc;
  const prestado = sum('prestamo'), pagadoNom = sum('pago');
  return { ms, tf, pd, exacto, faltas, trabajados, premios, deducc, sueldo, ganado, prestado, pagadoNom, entregado: prestado + pagadoNom };
}
function saldoHasta(w, lun) {
  let s = 0;
  for (let l = new Date(w.alta || INICIO); l <= lun; l = addDays(l, 7)) { const c = semana(w, l); s += c.ganado - c.entregado; }
  return s;
}
const saldoHoy = w => saldoHasta(w, lunes(HOY));
const estado = s => s > 0.5 ? 'debe' : s < -0.5 ? 'prestamo' : 'ok';
function pill(s) {
  const e = estado(s);
  return e === 'debe' ? `<span class="pill p-debe">Por pagar ${money(s)}</span>`
       : e === 'prestamo' ? `<span class="pill p-loan">Préstamo ${money(-s)}</span>`
       : `<span class="pill p-ok">Al corriente</span>`;
}
// Calcula algo como si el movimiento ya estuviera guardado (para "Así queda")
function conTemporal(m, fn) { MOV.push(m); try { return fn(); } finally { MOV.pop(); } }

}

// Fecha elegida en el formulario (null si falta elegirla)
function fechaForm() {
  if (R.fecha === 'hoy') return deIso(isoDia(HOY));
  if (R.fecha === 'ayer') return deIso(isoDia(addDays(HOY, -1)));
  return R.fechaOtra ? deIso(R.fechaOtra) : null;
}

// Movimiento que se guardaría con lo capturado, o { error }
function armarMov() {
  const w = wById(R.wid);
  const base = { id: '~nuevo', wid: w.id, por: SESION.nombre, registrado: new Date(), anulado: null, forma: '' };
  if (R.tipo === 'falta' && R.modo === 'dias') {
    const lun = R.semanaDias === 'esta' ? lunes(HOY) : addDays(lunes(HOY), -7);
    const fecha = R.semanaDias === 'esta' ? deIso(isoDia(HOY)) : addDays(lun, 5);
    return { m: { ...base, fecha, tipo: 'dias', valor: R.diasExactos, nota: R.nota.trim() }, lun };
  }
  const fecha = fechaForm();
  if (!fecha) return { error: 'Elige la fecha' };
  if (soloDia(fecha) > soloDia(HOY)) return { error: 'La fecha es de un día que todavía no pasa' };
  if (fecha < (w.alta || INICIO)) return { error: 'Esa fecha es anterior a que entrara a la nómina' };
  const lun = lunes(fecha);
  if (R.tipo === 'falta') {
    const d = R.falta === 'otro' ? R.faltaNum : parseFloat(R.falta);
    const c = semana(w, lun);
    if (c.exacto) return { error: `Esa semana ya tiene días exactos (${fdias(c.exacto.valor)}). Cámbialos en "Días trabajados exactos".` };
    if (c.faltas + d > c.tf.dias) return { error: `Ya tiene ${fdias(c.faltas)} de falta esa semana; como máximo puedes marcar ${fdias(c.tf.dias - c.faltas)}.` };
    return { m: { ...base, fecha, tipo: 'falta', valor: d, nota: R.nota.trim() }, lun };
  }
  const v = num(R.monto);
  if (!v || v <= 0) return { error: 'Escribe el monto' };
  return { m: { ...base, fecha, tipo: R.tipo, valor: v, nota: [R.motivo, R.nota.trim()].filter(Boolean).join(' · '),
                forma: R.tipo === 'prestamo' ? R.forma : '' }, lun };
}

function pintarLive() {
  const el = $('#live'); if (!el) return;
  const w = wById(R.wid), antes = saldoHoy(w);
  const a = armarMov();
  const pintar = (cls, html) => { el.className = 'res ' + cls; el.innerHTML = html; };
  if (a.error) return pintar(a.error === 'Escribe el monto' ? '' : 'err', esc(a.error));
  const { m, lun } = a;
  const despues = conTemporal(m, () => saldoHoy(w));
  if (m.tipo === 'falta' || m.tipo === 'dias') {
    const cAntes = semana(w, lun), cDesp = conTemporal(m, () => semana(w, lun));
    return pintar('', `<div class="calc">
      <span class="mu">Semana</span><span>${wkLabel(lun)}</span>
      <span class="mu">Días a pagar</span><span>${fdias(cAntes.trabajados)} → <b>${fdias(cDesp.trabajados)}</b> de ${fdias(cAntes.tf.dias)}</span>
      <span class="mu">Sueldo de esa semana</span><span>${money(cAntes.sueldo)} → <b>${money(cDesp.sueldo)}</b></span>
      <span class="big">Queda</span><span class="big">${money(despues)}</span></div>`);
  }
  let html = `<div class="calc">
    <span class="mu">${antes < -0.5 ? 'Préstamo pendiente' : 'Por pagar el sábado'}</span><span>${money(Math.abs(antes))}</span>
    <span class="mu">${TIPOS[m.tipo].t}${m.tipo === 'premio' ? ' (+)' : ' (−)'}</span><span class="${colorTipo[m.tipo]}">${m.tipo === 'premio' ? '+' : '−'}${money(m.valor)}</span>
    <span class="big">Queda</span><span class="big">${despues < -0.5 ? `<span class="c-loan">−${money(-despues)}</span>` : money(despues)}</span></div>`;
  if (m.tipo === 'prestamo' && despues < -0.5)
    html += `<div style="margin-top:8px">Le das más de lo que ha ganado. Queda con <b>préstamo de ${money(-despues)}</b>, que se descuenta solo de sus siguientes semanas.</div>`;
  pintar(m.tipo === 'prestamo' && despues < -0.5 ? 'loan' : '', html);
}

function etiquetaGuardar() {
  if (R.tipo === 'falta') {
    if (R.modo === 'dias') return `Guardar ${fdias(R.diasExactos ?? 0)} días trabajados`;
    const d = R.falta === 'otro' ? R.faltaNum : parseFloat(R.falta);
    return d === 0.5 ? 'Guardar falta de medio día' : `Guardar falta de ${fdias(d)} día${d === 1 ? '' : 's'}`;
  }
  const v = num(R.monto);
  return `Guardar ${TIPOS[R.tipo].t.toLowerCase()}${v ? ' de ' + money(v) : ''}`;
}
const descMov = m => TIPOS[m.tipo].dinero ? `${TIPOS[m.tipo].t} de ${money(m.valor)}`
  : m.tipo === 'dias' ? `${fdias(m.valor)} días trabajados` : m.valor === 0.5 ? 'Falta de medio día' : `Falta de ${fdias(m.valor)} día${m.valor === 1 ? '' : 's'}`;
const errTxt = e => e.servidor ? e.message : 'Sin conexión. Revisa el internet e intenta de nuevo.';

// Manda un movimiento al servidor y lo agrega a la lista local
async function enviarMov(m, clave) {
  const j = await Sesion.api({ action: 'nomina_mov', mov: {
    id: clave, fecha: isoDia(m.fecha), id_trabajador: m.wid, tipo: m.tipo, valor: m.valor, forma: m.forma, nota: m.nota } });
  const nuevo = { ...m, id: j.id_mov, por: j.capturo, registrado: new Date(j.registrado) };
  if (!MOV.some(x => x.id === nuevo.id)) MOV.push(nuevo);
  return nuevo;
}
async function deshacerMov(m) {
  try {
    const j = await Sesion.api({ action: 'nomina_anular', id: m.id, motivo: 'Se deshizo al registrar' });
    m.anulado = { por: j.anulado_por, motivo: j.motivo_anulacion };
    render(); aviso('Se deshizo');
  } catch (e) { aviso('No se pudo deshacer: ' + esc(errTxt(e)) + '<br>Anúlalo desde el Historial.', 'err', 8000); }
}

async function guardar() {
  if (guardando) return;                                  // evita doble toque
  const a = armarMov();
  if (a.error) { if (a.error === 'Escribe el monto') $('#monto')?.focus(); return aviso(esc(a.error), 'err'); }
  guardando = true;
  const btn = $('#b-guardar'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const w = wById(a.m.wid);
  try {
    const nuevo = await enviarMov(a.m, R.clave);
    R = { wid: R.wid, ...formVacio(R.tipo), modo: R.modo };   // se queda con el mismo trabajador y tipo
    guardando = false;
    render();
    aviso(`✓ ${descMov(nuevo)} · ${esc(w.nombre)}`, 'ok', 6000, () => deshacerMov(nuevo));
  } catch (e) {
    guardando = false;
    render();
    aviso('No se pudo guardar: ' + esc(errTxt(e)) + '<br>No se borró nada; vuelve a intentar.', 'err', 8000);
  }
}

function desglose(w, lun) {
  const c = semana(w, lun);
  const ant = w.alta && lun <= w.alta ? 0 : lun > INICIO ? saldoHasta(w, addDays(lun, -7)) : 0;
  const s = saldoHasta(w, lun);
  return `<div class="calc">
    <span class="mu">Días trabajados</span><span>${fdias(c.trabajados)} de ${fdias(c.tf.dias)}${c.exacto ? ' (exactos)' : ''}</span>
    <span class="mu">Sueldo (${money(c.pd)} por día)</span><span>${money(c.sueldo)}</span>
    ${c.premios ? `<span class="mu">+ Premios</span><span class="c-ok">+${money(c.premios)}</span>` : ''}
    ${c.deducc ? `<span class="mu">− Deducciones</span><span class="c-err">−${money(c.deducc)}</span>` : ''}
    ${ant > 0.5 ? `<span class="mu">+ Quedó pendiente de antes</span><span class="c-warn">+${money(ant)}</span>` : ''}
    ${ant < -0.5 ? `<span class="mu">− Préstamo de semanas anteriores</span><span class="c-loan">−${money(-ant)}</span>` : ''}
    ${c.prestado ? `<span class="mu">− Préstamos de esta semana</span><span class="c-loan">−${money(c.prestado)}</span>` : ''}
    ${c.pagadoNom ? `<span class="mu">− Ya pagado</span><span>−${money(c.pagadoNom)}</span>` : ''}
    <span class="big">${s < -0.5 ? 'Préstamo por recuperar' : 'Por pagar'}</span><span class="big ${s < -0.5 ? 'c-loan' : ''}">${money(Math.abs(s))}</span>
  </div>`;
}

  const w = wById(id), s = saldoHoy(w);

                : `<div class="hint">Su préstamo cubre esta semana, no se le debe nada. Si le das algo, se suma a su préstamo.</div>`}
      <div class="f"><label>Forma de pago</label>
        <div class="ops">${FORMAS.map(f => `<button class="op ${P.forma === f ? 'on' : ''}" data-act="pForma" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>
        ${w.cuenta ? `<div class="hint">Cuenta: ${esc(w.cuenta)}</div>` : ''}
      </div>
      <div class="res f" id="p-live"></div>
    </div>
    <div class="row2">
      <button class="btn" data-act="cerrar">Cancelar</button>
      <button class="btn p" id="p-guardar" data-act="pGuardar">Guardar pago</button>
    </div>`);
  pintarPago();
}
function pintarPago() {
  const el = $('#p-live'); if (!el || !P) return;
  const w = wById(P.wid), s = saldoHoy(w), v = num(P.monto) || 0;
  const d = s - v;
  el.className = 'res f ' + (!v ? '' : d > 0.5 ? 'warn' : d < -0.5 ? 'loan' : 'ok');
  el.innerHTML = !v ? 'Escribe el monto.'
    : d > 0.5 ? `Quedan <b>${money(d)}</b> pendientes para la próxima semana.`
    : d < -0.5 ? `Le das <b>${money(-d)}</b> de más: quedan como préstamo y se descuentan de sus siguientes semanas.`
    : `Queda <b>al corriente</b>.`;
}
async function guardarPago() {
  if (guardando) return;
  const w = wById(P.wid), v = num(P.monto);
  if (!v || v <= 0) return aviso('Escribe el monto', 'err');
  guardando = true;
  const b = $('#p-guardar'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    const m = { id: '~nuevo', wid: w.id, fecha: deIso(isoDia(HOY)), tipo: 'pago', valor: v, nota: '', forma: P.forma, anulado: null };
    const nuevo = await enviarMov(m, P.clave);
    cerrarHoja(); render();
    aviso(`✓ Pago de nómina de ${money(v)} · ${esc(w.nombre)}`, 'ok', 6000, () => deshacerMov(nuevo));
  } catch (e) {
    b.disabled = false; b.textContent = 'Guardar pago';
    aviso('No se pudo guardar: ' + esc(errTxt(e)) + '<br>No se borró nada; vuelve a intentar.', 'err', 8000);
  } finally { guardando = false; }
}

// ════════════════════════════════════════════════════════════════════
// RESUMEN
// ════════════════════════════════════════════════════════════════════
function vResumen() {
  const lun = S.sem, actual = mismoDia(lun, lunes(HOY));
  // Activos, y los dados de baja que todavía tienen saldo
  const todas = W.filter(w => !w.alta || w.alta <= lun)
    .map(w => { const c = semana(w, lun), s = saldoHasta(w, lun); return { w, c, s, e: estado(s) }; })
    .filter(f => f.w.activo || Math.abs(f.s) > 0.5);
  const delLugar = todas.filter(f => S.lugar === 'Todos' || f.w.lugar === S.lugar);
  const vis = delLugar.filter(f => S.estado === 'todos' || f.e === S.estado);
  const sum = (arr, fn) => arr.reduce((a, f) => a + fn(f), 0);
  const porPagar = sum(delLugar, f => Math.max(0, f.s));
  const efectivo = sum(delLugar.filter(f => f.w.forma === 'Efectivo'), f => Math.max(0, f.s));
  const sab = addDays(lun, DIA_PAGO - 1);
  const faltan = Math.round((sab - soloDia(HOY)) / 864e5);
  const cnt = k => delLugar.filter(f => k === 'todos' || f.e === k).length;
  return `
    <div class="card weeknav">
      <button class="btn sm" data-act="sem" data-v="-1" ${lun <= INICIO ? 'disabled' : ''}>‹</button>
      <div class="w"><b>${wkLabel(lun)}</b><small>${actual ? 'Semana en curso' : 'Semana cerrada'}</small></div>
      <button class="btn sm" data-act="sem" data-v="1" ${actual ? 'disabled' : ''}>›</button>
    </div>
    ${actual ? `<div class="banner"><span class="dot d-brand"></span><span><b>Sábado ${fCorta(sab)}</b> es día de pago${faltan === 1 ? ' · <b>mañana</b>' : faltan === 0 ? ' · <b>hoy</b>' : faltan < 0 ? ' · ya pasó' : ''}</span></div>` : ''}
    <div class="card filt">${filtroLugar()}</div>
    <div class="card kpi-main">
      <small>${actual ? 'Por pagar el sábado' : 'Quedó pendiente'}${S.lugar !== 'Todos' ? ' · ' + esc(S.lugar) : ''}</small>
      <div class="v">${money(porPagar)}</div>
      <small>${cnt('debe')} persona${cnt('debe') === 1 ? '' : 's'} · ya incluye préstamos y pendientes de otras semanas</small>
    </div>
    <div class="kpis">
      <div class="card"><small>${actual ? 'Efectivo a preparar' : 'Pendiente en efectivo'}</small><b>${money(efectivo)}</b></div>
      <div class="card"><small>${actual ? 'Por transferencia' : 'Pendiente por transferencia'}</small><b>${money(porPagar - efectivo)}</b></div>
      <div class="card"><small>Nómina de la semana</small><b>${money(sum(delLugar, f => f.c.ganado))}</b></div>
      <div class="card"><small>Préstamos dados en la semana</small><b class="c-loan">${money(sum(delLugar, f => f.c.prestado))}</b></div>
    </div>
    <div class="chips">${[['todos','Todos'], ['debe','Por pagar'], ['ok','Al corriente'], ['prestamo','Con préstamo']].map(([k, l]) =>
      `<button class="chip ${S.estado === k ? 'on' : ''}" data-act="estado" data-v="${k}">${l} <small>${cnt(k)}</small></button>`).join('')}</div>
    ${porLugar(vis.map(f => f.w)).map(g => {
      const fs = vis.filter(f => f.w.lugar === g.l).sort((a, b) => b.s - a.s);
      return `<div class="card">
        <h2 style="display:flex;justify-content:space-between">${esc(g.l)}<span class="num" style="font-size:14px;color:var(--muted)">${money(sum(fs, f => Math.max(0, f.s)))}</span></h2>
        <div class="lst">${fs.map(({ w, c, s }) => `<div><button class="rowb" data-act="detalle" data-id="${w.id}">
          <span class="g"><b>${esc(w.nombre)}${w.activo ? '' : ' (baja)'}</b><small>${fdias(c.trabajados)}/${fdias(c.tf.dias)} días · ganó ${money(c.ganado)}${c.prestado ? ' · préstamos ' + money(c.prestado) : ''}</small></span>
          <span class="r">${pill(s)}</span></button></div>`).join('')}</div>
      </div>`;
    }).join('') || '<div class="card hint">Nadie en este filtro.</div>'}
    <div class="hint" style="padding:0 4px">El saldo junta todas las semanas: lo ganado menos lo que se le ha dado (préstamos y pagos).</div>`;
}

function hojaDetalle(id) {
  const w = wById(id), lun = S.sem, actual = mismoDia(lun, lunes(HOY));
  const ms = semana(w, lun).ms.slice().sort(ordenMov);
  abrirHoja(`
    <h3>${esc(w.nombre)}<small>${esc(w.puesto)} · ${esc(w.lugar)} · ${esc(w.forma)}${w.cuenta ? ' · ' + esc(w.cuenta) : ''}</small></h3>

// HISTORIAL
// ════════════════════════════════════════════════════════════════════
function movRow(m, conNombre = true) {
  const w = wById(m.wid) || { nombre: '#' + m.wid }, T = TIPOS[m.tipo] || { t: m.tipo, dinero: true };
  const val = T.dinero ? (m.tipo === 'premio' ? '+' : m.tipo === 'deduccion' ? '−' : '') + money(m.valor)
    : m.tipo === 'falta' ? `−${fdias(m.valor)} día${m.valor === 1 ? '' : 's'}` : `${fdias(m.valor)} días`;
  const color = colorTipo[m.tipo] || '';
  const sub = m.anulado ? `Anulado por ${esc(m.anulado.por)}${m.anulado.motivo ? ': ' + esc(m.anulado.motivo) : ''}`
    : [conNombre ? T.t : '', m.forma === 'Transferencia' ? 'Transferencia' : '', m.nota].filter(Boolean).map(esc).join(' · ') || (conNombre ? '' : '—');
  return `<div class="${m.anulado ? 'anul' : ''}">
    ${punto(m.tipo)}
    <span class="g"><b>${conNombre ? esc(w.nombre) : esc(T.t)}</b><small>${sub}</small></span>
    <span class="r"><b class="${color}">${val}</b><small>${esc(m.por)} · ${conNombre ? fHora(m.registrado) : fCorta(m.fecha)}</small></span>
    ${m.anulado ? '' : `<button class="x" data-act="anular" data-id="${esc(m.id)}">Anular</button>`}
  </div>`;
}

function vHistorial() {
  const tipos = [['todos','Todos'], ['prestamo','Préstamos'], ['pago','Pagos'], ['falta','Faltas'], ['premio','Premios'], ['deduccion','Deducciones']];
  const quienes = [...new Set(MOV.map(m => m.por).filter(Boolean))].sort();
  const ms = MOV.filter(m => (S.hAnul || !m.anulado)
      && (S.hTipo === 'todos' || m.tipo === S.hTipo || (S.hTipo === 'falta' && m.tipo === 'dias'))
      && (S.hPor === 'Todos' || m.por === S.hPor)
      && (S.lugar === 'Todos' || wById(m.wid)?.lugar === S.lugar))
    .sort(ordenMov);
  const LIM = 200, mostrar = ms.slice(0, LIM);
  const grupos = [];
  mostrar.forEach(m => { const k = m.fecha.toDateString(); let g = grupos.find(x => x.k === k); if (!g) grupos.push(g = { k, d: m.fecha, items: [] }); g.items.push(m); });
  const titulo = d => mismoDia(d, HOY) ? 'Hoy' : mismoDia(d, addDays(HOY, -1)) ? 'Ayer' : cap(DIAS[d.getDay()]) + ' ' + fCorta(d);
  return `
    <div class="card filt">
      <div class="chips">${tipos.map(([k, l]) => `<button class="chip ${S.hTipo === k ? 'on' : ''}" data-act="hTipo" data-v="${k}">${l}</button>`).join('')}</div>
      ${filtroLugar()}
      <div class="g2">
        <div><label>Registró</label><select data-model="hPor">${['Todos', ...quienes].map(u => `<option ${S.hPor === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        <label style="display:flex;gap:8px;align-items:center;margin:18px 0 0;color:var(--text);font-size:14px"><input type="checkbox" data-act="hAnul" ${S.hAnul ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--amb)"> Ver anulados</label>
      </div>
    </div>
    ${grupos.map(g => `<div class="card"><h2>${titulo(g.d)}</h2><div class="lst">${g.items.map(m => movRow(m)).join('')}</div></div>`).join('')
      || '<div class="card hint">Sin movimientos con estos filtros.</div>'}
    ${ms.length > LIM ? `<div class="hint" style="padding:0 4px">Se muestran los ${LIM} más recientes; usa los filtros para ver otros.</div>` : ''}`;
}

function hojaAnular(id) {
  const m = MOV.find(x => x.id === id), w = wById(m.wid);
  abrirHoja(`
    <h3>¿Anular este movimiento?<small>${esc(w.nombre)} · ${cap(DIAS[m.fecha.getDay()])} ${fCorta(m.fecha)}</small></h3>
    <div class="card"><div class="lst">${movRow(m, false).replace(/<button class="x"[\s\S]*?<\/button>/, '')}</div></div>
    <div class="card"><label>¿Por qué? (opcional)</label><input id="a-motivo" maxlength="300" placeholder="Ej. se registró dos veces"></div>
    <div class="hint" style="padding:0 4px">No se borra: queda tachado en el Historial con tu nombre, y el saldo se recalcula.</div>
    <div class="row2"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn danger" id="a-ok" data-act="anularOk" data-id="${esc(id)}">Anular</button></div>`);
}
async function anular(id) {
  if (guardando) return;
  const m = MOV.find(x => x.id === id);
  guardando = true;
  const b = $('#a-ok'); b.disabled = true; b.textContent = 'Anulando…';
  try {
    const j = await Sesion.api({ action: 'nomina_anular', id, motivo: $('#a-motivo').value.trim() });
    m.anulado = { por: j.anulado_por, motivo: j.motivo_anulacion };

  } catch (e) {
    b.disabled = false; b.textContent = 'Anular';
    aviso('No se pudo anular: ' + esc(errTxt(e)), 'err', 8000);
  } finally { guardando = false; }
}

    ${inact.length ? `<div class="card" style="opacity:.7"><h2>Dados de baja <span class="u">no aparecen en la nómina</span></h2><div class="lst">${inact.map(fila).join('')}</div></div>` : ''}`;

function hojaTrabajador(id) {
  const w = id ? wById(id) : { nombre: '', puesto: '', lugar: S.lugar !== 'Todos' ? S.lugar : (LUGARES[0] || ''), forma: 'Efectivo', cuenta: '', activo: true, hist: [] };

        <select id="e-lugar">${lugares.map(l => `<option ${w.lugar === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}<option value="__nuevo">+ Otro lugar…</option></select>
        <input id="e-lugar-nuevo" class="oculto" maxlength="40" style="margin-top:8px" placeholder="Nombre del lugar nuevo"></div>

      <div class="hint" style="margin-top:10px">${id ? `Si cambias el sueldo, cuenta desde esta semana (${wkLabel(lunes(HOY))}); las anteriores no cambian.`
        : `Entra a la nómina desde esta semana (${wkLabel(lunes(HOY))}).`}</div>
      <div class="res err f" id="e-err"></div>

    <div class="row2"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn p" id="e-ok" data-act="guardarW" data-id="${id || 0}">Guardar</button></div>`);
}

async function guardarW(id, confirmado) {
  if (guardando) return;
  const g = k => $('#e-' + k);
  const nombre = g('nombre').value.trim(), sal = num(g('sal').value), dias = num(g('dias').value);
  let lugar = g('lugar').value;
  if (lugar === '__nuevo') lugar = g('lugar-nuevo').value.trim();
  const err = !nombre ? 'Falta el nombre' : !lugar ? 'Escribe el lugar nuevo' : !(sal > 0) ? 'Falta el sueldo semanal'
    : !(dias > 0 && dias <= 7 && Math.round(dias * 2) === dias * 2) ? 'Días por semana: de 0.5 a 7 (de medio en medio)' : '';
  if (err) { g('err').textContent = err; return; }
  const w0 = id ? wById(id) : null;
  if (w0 && w0.activo && !g('activo').checked && !confirmado) {
    const s = saldoHoy(w0);
    if (Math.abs(s) > 0.5) { g('err').innerHTML = `${esc(w0.nombre)} tiene ${s > 0 ? 'pendiente por pagar' : 'un préstamo de'} <b>${money(Math.abs(s))}</b>. <button class="btn sm" data-act="guardarWForzar" data-id="${id}" style="margin-top:6px">Dar de baja de todos modos</button>`; return; }
  }
  guardando = true;
  const b = g('ok'); b.disabled = true; b.textContent = 'Guardando…'; g('err').textContent = '';
  try {
    await Sesion.api({ action: 'nomina_trabajador', datos: { id: id || null, nombre, puesto: g('puesto').value.trim(), lugar,
      forma: g('forma').value, cuenta: g('cuenta').value.trim(), activo: g('activo').checked, salario: sal, dias } });
    await cargar();
    cerrarHoja(); render(); aviso('✓ Trabajador guardado');
  } catch (e) {
    b.disabled = false; b.textContent = 'Guardar';
    g('err').textContent = 'No se pudo guardar: ' + errTxt(e);
  } finally { guardando = false; }
}

// ════════════════════════════════════════════════════════════════════
// Infraestructura
// ════════════════════════════════════════════════════════════════════
function render() {
  $('#main').innerHTML = { registrar: vRegistrar, resumen: vResumen, historial: vHistorial, equipo: vEquipo }[S.tab]();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.tab));
  $('#h-op').textContent = `${SESION.nombre} · ${wkLabel(lunes(HOY))}`;
  const enForm = S.tab === 'registrar' && R.wid;
  $('#bar').classList.toggle('oculto', !enForm);
  if (enForm) {
    $('#bar-in').innerHTML = `<button class="btn" data-act="changeW">Otro</button><button class="btn p" id="b-guardar" data-act="guardar" ${guardando ? 'disabled' : ''}>${guardando ? 'Guardando…' : etiquetaGuardar()}</button>`;
    pintarLive();
  }
}
function refrescar() { pintarLive(); const b = $('#b-guardar'); if (b && !guardando) b.textContent = etiquetaGuardar(); }

function abrirHoja(html) { $('#layer').innerHTML = `<div class="ov" data-act="fondo"><div class="sheet">${html}</div></div>`; }
function cerrarHoja() { $('#layer').innerHTML = ''; P = null; }
const hojaAbierta = () => !!$('#layer').innerHTML;

let msgTimer, deshacerFn = null;
function aviso(html, tipo = 'ok', ms = 4000, deshacer) {
  const el = $('#msg');
  deshacerFn = deshacer || null;
  el.className = `msg on ${tipo}`;
  el.innerHTML = `<span>${html}</span>${deshacer ? '<button data-act="deshacer">Deshacer</button>' : ''}`;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => el.className = 'msg', ms);
}

async function recargar(avisar) {
  try { await cargar(); if (R.wid && !wById(R.wid)?.activo) R = { wid: null, ...formVacio('prestamo') }; render(); if (avisar) aviso('✓ Actualizado'); }
  catch (e) { aviso('No se pudo actualizar: ' + esc(errTxt(e)), 'err', 8000); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !SESION) return;
  const a = b.dataset.act, v = b.dataset.v, id = +b.dataset.id;
  if (a === 'fondo') { if (e.target === b && !guardando) cerrarHoja(); return; }
  if (a === 'hAnul') { S.hAnul = b.checked; return render(); }
  switch (a) {
    case 'recargar': recargar(true); break;
    case 'tab': S.tab = v; if (v === 'resumen') S.sem = lunes(HOY); cerrarHoja(); render(); scrollTo(0, 0); break;
    case 'lugar': S.lugar = v; render(); break;
    case 'pickW': R = { wid: id, ...formVacio('prestamo') }; render(); scrollTo(0, 0); break;
    case 'changeW': if (!guardando) { R = { wid: null, ...formVacio('prestamo') }; render(); scrollTo(0, 0); } break;
    case 'tipo': if (R.tipo !== v) { R = { wid: R.wid, ...formVacio(v) }; render(); } break;   // al cambiar de tipo se limpia el monto
    case 'modo': R.modo = v; R.diasExactos = null; render(); break;
    case 'semDias': R.semanaDias = v; R.diasExactos = null; render(); break;
    case 'falta': R.falta = v; render(); break;
    case 'fecha': R.fecha = v; render(); break;
    case 'rForma': R.forma = v; render(); break;
    case 'motivo': R.motivo = R.motivo === v ? '' : v; render(); break;
    case 'quick': R.monto = v; $('#monto').value = v; refrescar(); break;
    case 'step': {
      const f = b.dataset.f;
      R[f] = Math.min(7, Math.max(f === 'faltaNum' ? 0.5 : 0, (R[f] || 0) + parseFloat(b.dataset.d)));
      $('#stepVal').textContent = fdias(R[f]); refrescar(); break;
    }
    case 'guardar': guardar(); break;
    case 'pagar': hojaPagar(id); break;
    case 'pForma': P.forma = v; document.querySelectorAll('[data-act="pForma"]').forEach(x => x.classList.toggle('on', x.dataset.v === v)); break;
    case 'pGuardar': guardarPago(); break;
    case 'sem': S.sem = addDays(S.sem, 7 * +v); render(); break;
    case 'estado': S.estado = v; render(); break;
    case 'detalle': hojaDetalle(id); break;
    case 'regDesde': cerrarHoja(); S.tab = 'registrar'; R = { wid: id, ...formVacio('prestamo') }; render(); scrollTo(0, 0); break;
    case 'hTipo': S.hTipo = v; render(); break;
    case 'anular': hojaAnular(b.dataset.id); break;
    case 'anularOk': anular(b.dataset.id); break;
    case 'editW': if (PUEDE_EQUIPO) hojaTrabajador(id || null); break;
    case 'guardarW': guardarW(id || null); break;
    case 'guardarWForzar': guardarW(id, true); break;
    case 'cerrar': if (!guardando) cerrarHoja(); break;
    case 'deshacer': { const f = deshacerFn; deshacerFn = null; $('#msg').className = 'msg'; if (f) f(); break; }
  }
});

document.addEventListener('input', e => {
  const k = e.target.dataset.model, pk = e.target.dataset.pmodel;
  if (pk) { P[pk] = e.target.value; return pintarPago(); }
  if (!k) return;
  if (k === 'buscar') {
    S.buscar = e.target.value;
    const pos = e.target.selectionStart; render();
    const i = $('#buscar'); i.focus(); i.setSelectionRange(pos, pos);
  } else if (k === 'hPor') { S.hPor = e.target.value; render(); }
  else { R[k] = e.target.value; refrescar(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'e-lugar') $('#e-lugar-nuevo').classList.toggle('oculto', e.target.value !== '__nuevo');
});

// Al volver a la app después de un rato, trae lo que registraron los demás
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && SESION && Date.now() - cargadoEn > 60000 && !guardando && !hojaAbierta()) recargar(false);
});

Sesion.requerir('nomina').then(async s => {
  SESION = s;
  $('#h-op').textContent = s.nombre;
  try { await cargar(); render(); }
  catch (e) { $('#main').innerHTML = `<div class="card"><div class="res err">No se pudo cargar la nómina: ${esc(errTxt(e))}</div><button class="btn" style="width:100%;margin-top:10px" onclick="location.reload()">Reintentar</button></div>`; }
}).catch(e => { $('#main').innerHTML = `<div class="card"><div class="res err">No se pudo revisar la sesión: ${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
