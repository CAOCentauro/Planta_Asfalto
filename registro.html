<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d97706">
<title>Registro de planta</title>
<style>
:root{--bg:#f3f3f0;--card:#fff;--bd:#d9d9d3;--text:#1a1a1a;--muted:#66665f;--amb:#d97706;--amb-bg:#fff6e5;
  --ok:#15803d;--ok-bg:#eaf8ef;--warn:#9a4a06;--warn-bg:#fff1dc;--err:#b91c1c;--err-bg:#fdeaea;--in:#fbfbf9}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#151515;--bd:#2c2c2c;--text:#e8e8e8;--muted:#8d8d86;--amb:#f59e0b;--amb-bg:#2a1f08;
  --ok:#4ade80;--ok-bg:#0f2417;--warn:#fbbf24;--warn-bg:#2a2108;--err:#f87171;--err-bg:#2a1010;--in:#0f0f0f}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;padding-bottom:130px}
header{background:var(--card);border-bottom:3px solid var(--amb);padding:12px 16px;position:sticky;top:0;z-index:10}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px}
header small{display:block;color:var(--muted);font-size:12px}
main{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px}
.card h2 .u{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--text);min-width:0}
textarea{min-height:90px;resize:vertical;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amb);outline-offset:0;border-color:var(--amb)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);margin:-2px 0 10px}
.res{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:14px;background:var(--bg)}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--err-bg);color:var(--err)}
.res b{font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--text);margin-top:8px;cursor:pointer}
.chk input{width:22px;height:22px;flex-shrink:0;accent-color:var(--amb)}
.item{border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px}
.item:first-child{border-top:none;padding-top:0;margin-top:0}
.irow{display:grid;grid-template-columns:1fr 96px 44px;gap:8px;align-items:end}
.irow2{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-top:8px}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--amb);border-color:var(--amb);color:#000;flex:1}
.btn.sm{font-size:14px;padding:8px 12px}
.btn.x{padding:10px 0;width:44px;color:var(--err);font-size:18px;line-height:1}
.btn.add{width:100%;margin-top:10px;border-style:dashed;color:var(--amb)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.banner{padding:10px 12px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner:empty{display:none}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.err{background:var(--err-bg);color:var(--err)}
details.card summary{font-size:15px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:'▾';color:var(--muted)}
details[open].card summary{margin-bottom:10px}
.tot{font-size:14px;color:var(--muted);margin-top:10px}
.tot b{color:var(--text)}
.dis{opacity:.45;pointer-events:none}
.msg{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;padding:12px 14px;border-radius:10px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;display:none}
.msg.on{display:block}
@media (max-width:360px){.g3{grid-template-columns:1fr 1fr}.g3>div:last-child{grid-column:1/-1}}
</style>
</head>
<body>

<header><div class="in">
  <div><h1>Registro de planta</h1><small id="h-op">—</small></div>
  <div style="display:flex;gap:6px">
    <button class="btn sm" onclick="nuevoReporte(true)" title="Borrar todo y empezar de nuevo">Nuevo</button>
    <a class="btn sm" href="index.html" title="Menú de inicio" style="text-decoration:none">Inicio</a>
    <button class="btn sm" onclick="Sesion.salir()">Salir</button>
  </div>
</div></header>

<main>
  <div class="banner" id="pend"></div>

  <!-- FECHA -->
  <div class="card">
    <h2>Fecha <span class="u">un registro por día; al enviar pasa al día siguiente</span></h2>
    <input type="date" id="fecha">
  </div>

  <!-- PRODUCCIÓN -->
  <div class="card">
    <h2>Producción <span class="u">toneladas reales</span></h2>
    <div id="clientes"></div>
    <button class="btn add" id="add-cli" onclick="addCliente()">+ Agregar otro cliente</button>
    <label class="chk"><input type="checkbox" id="sinprod"> Este día no hubo producción</label>
    <div class="tot" id="tot-tons"></div>
  </div>

  <!-- COMPRAS -->
  <div class="card">
    <h2>Combustible comprado <span class="u">lo que se cargó / compró ese día</span></h2>
    <div id="compras"></div>
  </div>

  <!-- TANQUES -->
  <div id="tanques"></div>

  <!-- OTROS USOS -->
  <div class="card">
    <h2>Otros usos de combustible <span class="u">camión, generador para pintar, lavar cadena, mecheros…</span></h2>
    <div id="otros"></div>
    <button class="btn add" onclick="addOtro()">+ Agregar otro uso</button>
  </div>

  <!-- CUADRE -->
  <div class="card" id="cuadre-card">
    <h2>Cuadre de combustible</h2>
    <div id="cuadre"></div>
  </div>

  <!-- OBSERVACIONES -->
  <div class="card">
    <h2>Observaciones</h2>
    <textarea id="obs" placeholder="Fallas, pedido que no se completó, el payloader estuvo acomodando material, etc."></textarea>
  </div>
</main>

<div class="msg" id="msg"></div>

<div class="bar"><div class="in">
  <button class="btn" onclick="copiarTexto()">Copiar texto</button>
  <button class="btn p" id="btn-send" onclick="enviar()">Enviar registro</button>
</div></div>

<datalist id="dl-clientes">
  <option value="JONATHAN SOTO"><option value="CARLOS MENDOZA"><option value="CALPULALPAN"><option value="INTERNO">
</datalist>
<datalist id="dl-usos">
  <option value="Camión International blanco"><option value="Generador para pintar"><option value="Lavar cadena"><option value="Destapar tubería"><option value="Mecheros"><option value="Limpieza"><option value="Calentar asfalto">
</datalist>
<datalist id="dl-mezclas">
  <option value="Concreto Asfáltico">
</datalist>

<script src="sesion.js"></script>
<script>
// ══════════════════════════════════════════
//  CONFIGURACIÓN
// ══════════════════════════════════════════
// El operador captura a ciegas: esta página no puede leer nada del Sheets (ni cierres anteriores
// ni rendimientos esperados). El seguimiento contra la producción pasada se revisa en el dashboard.
const MEZCLA_DEF = 'Concreto Asfáltico';   // se puede borrar y escribir otra

// Mismo catálogo que Cat_Recipientes. cmMax: tabla Cat_Tabla_cm_L (250 L en 43 cm)
const TANQUES = [
  { key:'asfalto',    nombre:'Asfalto',                       insumo:'CEMENTO ASFALTICO',   uso:'GENERAL',          unidad:'L',   cap:124000 },
  { key:'alterno',    nombre:'Combustible alterno',           insumo:'COMBUSTIBLE ALTERNO', uso:'GENERAL',          unidad:'L',   cap:40000 },
  { key:'gen_grande', nombre:'Generador diésel',              insumo:'DIESEL',              uso:'GENERADOR GRANDE', unidad:'pct', cap:500 },
  { key:'quemador',   nombre:'Quemador',                      insumo:'DIESEL',              uso:'QUEMADOR',         unidad:'L',   cap:480 },
  { key:'gen_chico',  nombre:'Generador amarillo (gasolina)', insumo:'GASOLINA',            uso:'GENERADOR CHICO',  unidad:'pct', cap:45 },
  { key:'payloader',  nombre:'Payloader',                     insumo:'DIESEL',              uso:'PAYLOADER',        unidad:'cm',  cap:250, cmMax:43 },
];
const COMPRAS = [
  { key:'diesel',   nombre:'Diésel',   insumo:'DIESEL' },
  { key:'gasolina', nombre:'Gasolina', insumo:'GASOLINA' },
];
const INSUMOS_OTROS = ['DIESEL', 'GASOLINA', 'COMBUSTIBLE ALTERNO'];
const UNI_TXT = { L:'litros', pct:'% del tanque', cm:'cm en varilla' };
const UNI_CORTA = { L:' L', pct:'%', cm:' cm' };

// ── Almacenamiento local (con try/catch: puede fallar en modo privado) ──
const LS = {
  get(k, d) { try { const v = localStorage.getItem('reg_'+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('reg_'+k, JSON.stringify(v)); } catch(e) {} },
  del(k)    { try { localStorage.removeItem('reg_'+k); } catch(e) {} },
};

let ID = null;                       // id del registro en curso (evita duplicados al reintentar)

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
// Acepta "32 070", "32,070", "55%", "0,5"
function num(s) {
  s = String(s ?? '').trim().replace(/\s+/g, '').replace(/%$/, '');
  if (!s) return null;
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
const fmt  = (v, d=1) => v==null ? '—' : new Intl.NumberFormat('es-MX', { maximumFractionDigits:d }).format(v);
const iso  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy  = () => iso(new Date());
const diaSig = f => { const d = new Date(f+'T12:00:00'); d.setDate(d.getDate()+1); return iso(d); };
const fCorta = f => { if (!f) return ''; const d = new Date(f+'T12:00:00'); return d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' }); };
const nuevoId = () => 'R-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

function toL(t, v) {
  if (v == null) return null;
  if (t.unidad === 'pct') return v * t.cap / 100;
  if (t.unidad === 'cm')  return v * t.cap / t.cmMax;
  return v;
}

// ══════════════════════════════════════════
//  CONSTRUCCIÓN DE LA PANTALLA
// ══════════════════════════════════════════
function construir() {
  $('#compras').innerHTML = COMPRAS.map(c => `
    <div class="g2 f">
      <div><label>${c.nombre} (L)</label><input id="compra-${c.key}" inputmode="decimal"></div>
      <div><label>Precio por litro (si lo sabes)</label><input id="precio-${c.key}" inputmode="decimal" placeholder="$"></div>
    </div>`).join('');

  $('#tanques').innerHTML = TANQUES.map(t => `
    <div class="card" data-t="${t.key}">
      <h2>${t.nombre} <span class="u">${UNI_TXT[t.unidad]}${t.unidad!=='L' ? ` · tanque de ${fmt(t.cap,0)} L` : ''}</span></h2>
      <div class="g3">
        <div><label>Inicio</label><input data-k="inicio" inputmode="decimal"></div>
        <div><label>Término</label><input data-k="termino" inputmode="decimal"></div>
        <div><label>Le cargó (L)</label><input data-k="sumi" inputmode="decimal"></div>
      </div>
      <label class="chk" data-k="antes-wrap" style="display:none"><input type="checkbox" data-k="antes"> La carga fue <b>antes</b> de medir el inicio</label>
      <div class="res" data-k="res"></div>
    </div>`).join('');

  document.querySelector('main').addEventListener('input', alCambiar);
  document.querySelector('main').addEventListener('change', alCambiar);
}

function addCliente(p = {}) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <div class="irow">
      <div><label>Cliente</label><input data-k="cliente" list="dl-clientes" autocapitalize="characters" placeholder="Escribe o elige"></div>
      <div><label>Toneladas</label><input data-k="tons" inputmode="decimal"></div>
      <button class="btn x" type="button" title="Quitar">✕</button>
    </div>
    <div class="irow2">
      <div><label>Mezcla</label><input data-k="mezcla" list="dl-mezclas" placeholder="Escribe o elige"></div>
      <div><label>Pedido (ton)</label><input data-k="pedido" inputmode="decimal" placeholder="opcional"></div>
    </div>`;
  el.querySelector('[data-k=cliente]').value = p.cliente || '';
  el.querySelector('[data-k=tons]').value    = p.tons_real ?? '';
  el.querySelector('[data-k=pedido]').value  = p.tons_pedido ?? '';
  el.querySelector('[data-k=mezcla]').value  = p.mezcla || MEZCLA_DEF;
  el.querySelector('.btn.x').onclick = () => { el.remove(); if (!$$('#clientes .item').length) addCliente(); alCambiar(); };
  $('#clientes').appendChild(el);
}

function addOtro(o = {}) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <div class="f"><label>¿Para qué se usó?</label><input data-k="desc" list="dl-usos"></div>
    <div class="irow">
      <div><label>Combustible</label><select data-k="insumo">${INSUMOS_OTROS.map(i => `<option value="${i}">${i[0]+i.slice(1).toLowerCase()}</option>`).join('')}</select></div>
      <div><label>Litros</label><input data-k="litros" inputmode="decimal"></div>
      <button class="btn x" type="button" title="Quitar">✕</button>
    </div>`;
  el.querySelector('[data-k=desc]').value   = o.descripcion || '';
  el.querySelector('[data-k=litros]').value = o.litros ?? '';
  if (o.insumo) el.querySelector('[data-k=insumo]').value = o.insumo;
  el.querySelector('.btn.x').onclick = () => { el.remove(); alCambiar(); };
  $('#otros').appendChild(el);
}

// ══════════════════════════════════════════
//  LEER / LLENAR EL FORMULARIO
// ══════════════════════════════════════════
function recolectar() {
  const producciones = $('#sinprod').checked ? [] : $$('#clientes .item').map(el => ({
    cliente:     el.querySelector('[data-k=cliente]').value.trim().toUpperCase(),
    tons_real:   num(el.querySelector('[data-k=tons]').value),
    tons_pedido: num(el.querySelector('[data-k=pedido]').value),
    mezcla:      el.querySelector('[data-k=mezcla]').value.trim(),
  })).filter(p => p.cliente || p.tons_real != null);
  const tonsTotal = producciones.reduce((s,p) => s + (p.tons_real || 0), 0);

  const tanques = TANQUES.map(t => {
    const card = $(`[data-t=${t.key}]`);
    const inicio  = num(card.querySelector('[data-k=inicio]').value);
    const termino = num(card.querySelector('[data-k=termino]').value);
    const sumi    = num(card.querySelector('[data-k=sumi]').value);
    const antes   = card.querySelector('[data-k=antes]').checked && !!sumi;
    const inicio_L = toL(t, inicio), termino_L = toL(t, termino);
    const consumo_L = inicio_L != null && termino_L != null ? inicio_L + (antes ? 0 : (sumi || 0)) - termino_L : null;
    return { insumo:t.insumo, uso:t.uso, unidad:t.unidad, inicio, termino, suministro_L:sumi, suministro_antes:antes,
             inicio_L, termino_L, consumo_L };
  }).filter(t => t.inicio != null || t.termino != null || t.suministro_L != null);

  return {
    id: ID,
    fecha: $('#fecha').value,
    operador: SES?.nombre || '',
    sin_produccion: $('#sinprod').checked,
    producciones, tons_total: tonsTotal,
    compras: COMPRAS.map(c => ({ insumo:c.insumo, litros:num($('#compra-'+c.key).value), precio_L:num($('#precio-'+c.key).value) }))
                    .filter(c => c.litros),
    tanques,
    otros_usos: $$('#otros .item').map(el => ({
      insumo:      el.querySelector('[data-k=insumo]').value,
      descripcion: el.querySelector('[data-k=desc]').value.trim(),
      litros:      num(el.querySelector('[data-k=litros]').value),
    })).filter(o => o.descripcion || o.litros),
    observaciones: $('#obs').value.trim(),
    creado: new Date().toISOString(),
    version: 2,
  };
}

function llenar(r) {
  ID = r.id || nuevoId();
  $('#fecha').value = r.fecha || hoy();
  $('#sinprod').checked = !!r.sin_produccion;
  $('#clientes').innerHTML = '';
  (r.producciones?.length ? r.producciones : [{}]).forEach(addCliente);
  COMPRAS.forEach(c => {
    const x = (r.compras || []).find(k => k.insumo === c.insumo) || {};
    $('#compra-'+c.key).value = x.litros ?? '';
    $('#precio-'+c.key).value = x.precio_L ?? '';
  });
  TANQUES.forEach(t => {
    const card = $(`[data-t=${t.key}]`);
    const x = (r.tanques || []).find(k => k.insumo === t.insumo && k.uso === t.uso) || {};
    card.querySelector('[data-k=inicio]').value  = x.inicio ?? '';
    card.querySelector('[data-k=termino]').value = x.termino ?? '';
    card.querySelector('[data-k=sumi]').value    = x.suministro_L ?? '';
    card.querySelector('[data-k=antes]').checked = !!x.suministro_antes;
  });
  $('#otros').innerHTML = '';
  (r.otros_usos || []).forEach(addOtro);
  $('#obs').value = r.observaciones || '';
  alCambiar();
}

// ══════════════════════════════════════════
//  REVISIÓN (solo con lo que él mismo anotó)
// ══════════════════════════════════════════
function revisar(r) {
  const errores = [], avisos = [], porTanque = {};

  if (!r.fecha) errores.push('Falta la fecha');
  else if (r.fecha > hoy()) errores.push('La fecha es de un día que todavía no pasa');
  if (!r.sin_produccion) {
    if (!r.producciones.length) errores.push('Anota la producción o marca "Este día no hubo producción"');
    r.producciones.forEach(p => {
      if (!p.cliente)          errores.push('Falta el nombre de un cliente');
      if (p.tons_real == null) errores.push(`Faltan las toneladas de ${p.cliente || 'un cliente'}`);
    });
  }

  TANQUES.forEach(t => {
    const x = r.tanques.find(k => k.insumo === t.insumo && k.uso === t.uso);
    const msg = []; let nivel = 'ok';
    const sube = n => { if (n === 'err' || (n === 'warn' && nivel === 'ok')) nivel = n; };
    if (!x) { porTanque[t.key] = null; return; }

    const lim = t.unidad === 'pct' ? 100 : t.unidad === 'cm' ? t.cmMax : t.cap;
    [['inicio', x.inicio], ['término', x.termino]].forEach(([n, v]) => {
      if (v != null && (v < 0 || v > lim)) { msg.push(`El ${n} (${fmt(v)}) está fuera del tanque (máx. ${fmt(lim,0)}${UNI_CORTA[t.unidad]})`); sube('err'); }
    });
    if ((x.inicio == null) !== (x.termino == null)) {
      msg.push(x.inicio == null ? 'Falta el inicio' : 'Falta el término'); sube('err');
    }
    if (x.consumo_L != null && x.consumo_L < -0.5) {
      msg.push('El término es mayor que el inicio + lo que se cargó. Revisa las lecturas.'); sube('warn');
    }
    porTanque[t.key] = { x, msg, nivel };
    errores.push(...(nivel === 'err' ? msg.map(m => `${t.nombre}: ${m}`) : []));
    avisos.push(...(nivel === 'warn' ? msg.map(m => `${t.nombre}: ${m}`) : []));
  });

  r.otros_usos.forEach(o => { if (!o.litros) errores.push(`Faltan los litros de "${o.descripcion || 'otro uso'}"`); });

  // Cuadre: lo comprado contra lo repartido en tanques y otros usos
  const cuadre = COMPRAS.map(c => {
    const comprado = r.compras.find(k => k.insumo === c.insumo)?.litros || 0;
    const tanques  = r.tanques.filter(k => k.insumo === c.insumo).reduce((s,k) => s + (k.suministro_L || 0), 0);
    const otros    = r.otros_usos.filter(o => o.insumo === c.insumo).reduce((s,o) => s + (o.litros || 0), 0);
    return { ...c, comprado, repartido: tanques + otros, dif: comprado - tanques - otros };
  }).filter(c => c.comprado || c.repartido);
  cuadre.filter(c => Math.abs(c.dif) > 0.5).forEach(c => avisos.push(
    c.dif > 0 ? `${c.nombre}: se compraron ${fmt(c.dif)} L que no están repartidos`
              : `${c.nombre}: se repartieron ${fmt(-c.dif)} L más de lo comprado`));

  return { errores, avisos, porTanque, cuadre };
}

function alCambiar() {
  const r = recolectar();
  const rv = revisar(r);

  $('#clientes').classList.toggle('dis', r.sin_produccion);
  $('#add-cli').classList.toggle('dis', r.sin_produccion);
  $('#tot-tons').innerHTML = r.sin_produccion ? 'Sin producción' :
    r.producciones.length > 1 ? `Total: <b>${fmt(r.tons_total, 2)} ton</b>` : '';

  TANQUES.forEach(t => {
    const card = $(`[data-t=${t.key}]`);
    const sumi = num(card.querySelector('[data-k=sumi]').value);
    card.querySelector('[data-k=antes-wrap]').style.display = sumi ? '' : 'none';

    const res = card.querySelector('[data-k=res]');
    const p = rv.porTanque[t.key];
    if (!p) { res.className = 'res'; res.innerHTML = ''; return; }
    const x = p.x;
    let linea = '';
    if (x.consumo_L != null) {
      linea = `Consumo: <b>${fmt(x.consumo_L)} L</b>`;
      if (t.unidad !== 'L') linea += `<br><span style="opacity:.8">${fmt(x.inicio_L)} L → ${fmt(x.termino_L)} L</span>`;
    }
    res.className = 'res ' + (p.nivel === 'ok' ? (linea ? 'ok' : '') : p.nivel);
    res.innerHTML = [linea, ...p.msg].filter(Boolean).join('<br>');
  });

  $('#cuadre-card').style.display = rv.cuadre.length ? '' : 'none';
  $('#cuadre').innerHTML = rv.cuadre.map(c => {
    const ok = Math.abs(c.dif) <= 0.5;
    return `<div class="res ${ok ? 'ok' : 'warn'}">${c.nombre}: comprado <b>${fmt(c.comprado)} L</b> · repartido <b>${fmt(c.repartido)} L</b>
      ${ok ? ' ✓' : `<br>${c.dif > 0 ? `Faltan ${fmt(c.dif)} L por anotar (¿en qué se usaron o se guardaron?)` : `Se anotaron ${fmt(-c.dif)} L más de lo comprado (¿había guardado?)`}`}</div>`;
  }).join('');

  LS.set('borrador', r);
}

// ══════════════════════════════════════════
//  TEXTO PARA WHATSAPP (respaldo)
// ══════════════════════════════════════════
function textoReporte(r) {
  const L = [];
  L.push(`Registro ${fCorta(r.fecha)}${r.operador ? ' · ' + r.operador : ''}`);
  if (r.sin_produccion) L.push('Sin producción');
  r.producciones.forEach(p => L.push(`Producción ${fmt(p.tons_real, 2)} ton ${p.cliente}${p.tons_pedido ? ` (pedido ${fmt(p.tons_pedido, 2)})` : ''} · ${p.mezcla}`));
  r.compras.forEach(c => L.push(`Compra ${c.insumo.toLowerCase()} ${fmt(c.litros)} L${c.precio_L ? ` a $${fmt(c.precio_L, 2)}` : ''}`));
  r.tanques.forEach(x => {
    const t = TANQUES.find(k => k.insumo === x.insumo && k.uso === x.uso);
    L.push('', t.nombre);
    if (x.inicio != null)  L.push(`Inicio ${fmt(x.inicio)}${UNI_CORTA[t.unidad]}${t.unidad!=='L' ? ` (${fmt(x.inicio_L)} L)` : ''}`);
    if (x.termino != null) L.push(`Término ${fmt(x.termino)}${UNI_CORTA[t.unidad]}${t.unidad!=='L' ? ` (${fmt(x.termino_L)} L)` : ''}`);
    if (x.suministro_L)    L.push(`Cargó ${fmt(x.suministro_L)} L${x.suministro_antes ? ' (antes del inicio)' : ''}`);
    if (x.consumo_L != null) L.push(`Consumo ${fmt(x.consumo_L)} L`);
  });
  if (r.otros_usos.length) { L.push('', 'Otros usos'); r.otros_usos.forEach(o => L.push(`${fmt(o.litros)} L ${o.insumo.toLowerCase()} — ${o.descripcion}`)); }
  if (r.observaciones) L.push('', 'Observaciones', r.observaciones);
  return L.join('\n');
}

async function copiarTexto() {
  const t = textoReporte(recolectar());
  try { await navigator.clipboard.writeText(t); aviso('Texto copiado. Pégalo en WhatsApp.', 'ok'); }
  catch(e) { prompt('Copia este texto:', t); }
}

// ══════════════════════════════════════════
//  ENVÍO
// ══════════════════════════════════════════
// La sesión (sesion.js) lleva el token; quién envía lo decide el servidor
const api = payload => Sesion.api(payload);
let SES = null;

async function enviar() {
  const r  = recolectar();
  const rv = revisar(r);
  if (rv.errores.length) return aviso('Corrige antes de enviar:<br>• ' + rv.errores.join('<br>• '), 'err', 8000);
  if (rv.avisos.length && !confirm('Revisa estos avisos:\n\n• ' + rv.avisos.join('\n• ') + '\n\n¿Enviar de todos modos?')) return;
  if (!confirm(`¿Enviar el registro del ${fCorta(r.fecha)}?\nYa no se puede cambiar después de enviarlo.`)) return;

  const btn = $('#btn-send');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    await api({ action:'reporte', reporte:r, resumen:textoReporte(r) });
    aviso(`✓ Registro del ${fCorta(r.fecha)} enviado`, 'ok');
    siguienteDia(r.fecha);
  } catch(e) {
    if (e.servidor) { aviso('No se pudo guardar: ' + e.message, 'err', 8000); }
    else {
      // Sin señal: se guarda en el teléfono y se reintenta solo
      const pend = LS.get('pendientes', []).filter(p => p.reporte.id !== r.id);
      pend.push({ reporte:r, resumen:textoReporte(r) });
      LS.set('pendientes', pend);
      aviso((navigator.onLine ? 'No se pudo conectar con el servidor.' : 'Sin señal.') +
            ' El registro quedó guardado en el teléfono y se volverá a enviar solo.', 'warn', 7000);
      siguienteDia(r.fecha);
    }
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar registro';
    pintarPendientes();
  }
}

async function reintentarPendientes() {
  const pend = LS.get('pendientes', []);
  if (!pend.length) return;
  const quedan = [];
  for (const p of pend) {
    try { await api({ action:'reporte', reporte:p.reporte, resumen:p.resumen }); }
    catch(e) { quedan.push(p); }
  }
  LS.set('pendientes', quedan);
  pintarPendientes();
  if (quedan.length < pend.length) aviso(`✓ ${pend.length - quedan.length} registro(s) pendiente(s) enviado(s)`, 'ok');
}

function pintarPendientes() {
  const n = LS.get('pendientes', []).length;
  const el = $('#pend');
  el.className = n ? 'banner warn' : 'banner';
  el.innerHTML = n ? `<span>${n} registro${n>1?'s':''} sin enviar</span><button class="btn sm" onclick="reintentarPendientes()">Reintentar</button>` : '';
}

// ══════════════════════════════════════════
//  UI GENERAL
// ══════════════════════════════════════════
let msgTimer;
function aviso(html, tipo = 'ok', ms = 4000) {
  const el = $('#msg');
  el.className = `msg on banner ${tipo}`;
  el.innerHTML = html;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => el.className = 'msg', ms);
  el.onclick = () => el.className = 'msg';
}

function nuevoReporte(preguntar) {
  if (preguntar && !confirm('¿Borrar lo capturado y empezar de nuevo?')) return;
  LS.del('borrador');
  llenar({ fecha: hoy() });
  window.scrollTo(0, 0);
}
// Después de enviar: formulario limpio con el día siguiente (sin pasar de hoy)
function siguienteDia(fecha) {
  LS.del('borrador');
  const sig = diaSig(fecha);
  llenar({ fecha: sig > hoy() ? hoy() : sig });
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════
//  INICIO
// ══════════════════════════════════════════
Sesion.requerir('registro').then(s => {
  SES = s;
  $('#h-op').textContent = s.nombre;
  construir();
  llenar(LS.get('borrador', null) || { fecha: hoy() });
  pintarPendientes();
  reintentarPendientes();
  window.addEventListener('online', reintentarPendientes);
}).catch(e => aviso('No se pudo revisar la sesión: ' + e.message, 'err', 10000));
</script>
