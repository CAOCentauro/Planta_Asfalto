// ══════════════════════════════════════════
//  SUBIR FOTOS POR LOTE (notas de viaje y tickets de diésel)
//  Como los admin de Notas de Viaje y de Diesel: la IA lee cada foto, se revisa y se registra.
//  Con foto lo guarda el programa de cada uno (Viajes.gs / Diesel.gs se lo pasan); sin foto, el servidor.
// ══════════════════════════════════════════
const IMG_ANCHO_MAX = 1280, IMG_CALIDAD = 0.78;      // igual que esos admin
const LECTORES = 2;                                  // fotos que se leen a la vez
const ESTADO_SUB = {
  leyendo:   '<span class="tag tm">Leyendo…</span>',
  guardando: '<span class="tag tm">Guardando…</span>',
  ok:        '<span class="tag tb">Registrada</span>',
  dup:       '<span class="tag tm">Ya estaba</span>',
  error:     '<span class="tag ta">Error</span>',
};
const SUB = {};

// Reduce la foto (1280 px de ancho, JPEG) antes de mandarla
function reducirFoto(file) {
  return new Promise((ok, err) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > IMG_ANCHO_MAX) { h = Math.round(h * IMG_ANCHO_MAX / w); w = IMG_ANCHO_MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', IMG_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); err(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function verFoto(src) { const m = document.getElementById('modal-foto'); m.querySelector('img').src = src; m.classList.add('on'); }
const diasDesde = fecha => Math.round((Date.now() - fechaLocal(fecha)) / 864e5);

function Subidor(cfg) {
  const k = cfg.k, sec = document.getElementById(cfg.sec);
  let items = [], sig = 0, leyendo = 0, cat = null;
  const cola = [];
  const el = s => document.getElementById(k + '-' + s);
  const porGuardar = () => items.filter(n => n.estado === 'pendiente' || n.estado === 'error');
  // Mientras la IA lee alguna foto no se edita nada (si no, "Aplicar" no alcanzaría a las que faltan)
  const ocupado = () => leyendo > 0 || cola.length > 0 || items.some(n => n.estado === 'leyendo');
  const campos = () => cfg.campos(cat);
  // Opciones de un desplegable: lista de textos o de {v, t}, o grupos [{t, ops}] (p. ej. "Usados en esta obra")
  const normOp = o => typeof o === 'object' ? o : { v:o, t:o };
  const gruposDe = (c, d) => {
    const g = typeof c.ops === 'function' ? c.ops(d, cat) : c.ops;
    return g.length && g[0].ops ? g.map(x => ({ t:x.t, ops:x.ops.map(normOp) })) : [{ t:null, ops:g.map(normOp) }];
  };
  const opcionesHtml = (c, d, actual) => {
    const gr = gruposDe(c, d);
    if (actual && !gr.some(g => g.ops.some(o => claveVj(o.v) === claveVj(actual)))) gr.unshift({ t:null, ops:[{ v:actual, t:actual }] });
    const op = o => `<option value="${esc(o.v)}" ${actual && claveVj(o.v) === claveVj(actual) ? 'selected' : ''}>${esc(o.t)}</option>`;
    return `<option value="">${c.vacio}</option>` + gr.map(g => g.t ? `<optgroup label="${esc(g.t)}">${g.ops.map(op).join('')}</optgroup>` : g.ops.map(op).join('')).join('');
  };
  // Lo que se cambia solo cuando cambia otro dato (p. ej. el chofer pone la placa)
  const ajustar = (n, cambios) => cfg.ajustar?.(n.d, cambios, cat);

  sec.innerHTML = `<div class="ph"><h2>${cfg.titulo}</h2><div class="flt">
      <label class="ftb" style="display:inline-block">Elegir fotos<input type="file" id="${k}-fotos" accept="image/*" multiple hidden></label>
      <button class="ftb" onclick="SUB.${k}.sinFoto()">Agregar sin foto</button>
      <button class="ftb" id="${k}-limpiar" onclick="SUB.${k}.limpiar()" style="display:none">Quitar las registradas</button>
      <button class="ftb p" id="${k}-guardar" onclick="SUB.${k}.guardar()">Registrar ${cfg.que}</button>
    </div></div>
    <div class="sb">
      <div id="${k}-arriba" style="display:contents"></div>
      <div class="pn" id="${k}-bulk" style="display:none"><div class="pnh">Aplicar a todas las que falta registrar</div>
        <div class="bulk"><span id="${k}-bulkc" style="display:contents"></span><button class="ftb" id="${k}-aplicar" onclick="SUB.${k}.aplicar()">Aplicar</button>
          <span id="${k}-cont" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div></div>
      <div class="pn"><div id="${k}-lista"></div></div>
    </div>`;
  el('fotos').addEventListener('change', e => { agregarFotos(e.target.files); e.target.value = ''; });

  async function abrir() {
    if (!cat) {
      el('lista').innerHTML = '<div class="empty">Cargando catálogos…</div>';
      try { cat = await api({ action:cfg.acciones.cat }); }
      catch(e) { el('lista').innerHTML = `<div class="empty">No se pudieron cargar los catálogos: ${esc(e.message)}</div>`; return; }
      el('bulkc').innerHTML = campos().filter(c => cfg.bulk.includes(c.f) && c.tipo !== 'chk').map(c => c.tipo === 'sel'
        ? `<select class="ci" data-b="${c.f}">${opcionesHtml(c, cfg.vacia(), '')}</select>`
        : `<input class="ci" type="${c.tipo}" data-b="${c.f}" placeholder="${c.t}" title="${c.t}" ${c.attr || ''} style="${c.tipo === 'number' ? 'min-width:70px;width:90px' : ''}">`).join('');
      cfg.alCargar?.(cat, el('arriba'));
    }
    render();
  }
  // Volver a calcular lo automático de las que falta registrar (p. ej. después de guardar los camiones del día)
  function reajustar(cambio) {
    if (!cat) return;
    porGuardar().forEach(n => ajustar(n, [cambio]));
    render();
  }

  // Los avisos también ven las demás de la lista (p. ej. el mismo folio dos veces)
  const avisos = n => cfg.avisos(n.d, cat, porGuardar().filter(x => x !== n).map(x => x.d));
  function fila(n, i) {
    const d = n.d, dis = ['pendiente','error'].includes(n.estado) && !ocupado() ? '' : 'disabled';
    const celda = c => {
      if (c.tipo === 'calc') return `<td data-calc="${c.f}" style="color:var(--muted)">${esc(c.calc(d, cat)) || '—'}</td>`;
      if (c.tipo === 'chk') return c.soloSinFoto && n.foto ? '<td style="color:var(--muted);text-align:center">—</td>'
        : `<td style="text-align:center"><input type="checkbox" data-f="${c.f}" ${d[c.f] ? 'checked' : ''} ${dis} title="${esc(c.titulo || c.t)}"></td>`;
      if (c.tipo === 'sel')
        return `<td style="min-width:${c.w}px"><select class="ci" data-f="${c.f}" ${dis}>${opcionesHtml(c, d, d[c.f])}</select></td>`;
      return `<td style="min-width:${c.w}px"><input class="ci" type="${c.tipo}" data-f="${c.f}" value="${esc(d[c.f])}" placeholder="${c.ph || ''}" ${c.attr || ''} ${dis}></td>`;
    };
    const av = n.estado === 'leyendo' ? [] : avisos(n);
    const conf = d.confianza == null ? '' : `<span class="tag ${d.confianza >= 80 ? 'tb' : d.confianza >= 60 ? 'tm' : 'ta'}">${d.confianza}%</span>`;
    return `<tr data-id="${n.id}"${n.estado === 'ok' || n.estado === 'dup' ? ' style="opacity:.6"' : ''}>
      <td>${n.foto ? `<img class="thumb" src="${n.foto}" alt="foto" onclick="verFoto(this.src)">` : '<div class="sinfoto">sin foto</div>'}</td>
      <td style="min-width:72px">${ESTADO_SUB[n.estado] || `<span style="color:var(--muted)">${i+1}</span>`} ${conf}
        ${n.msg ? `<div class="av" style="color:${n.estado === 'error' ? 'var(--neg)' : 'var(--muted)'};min-width:0">${esc(n.msg)}</div>` : ''}</td>
      ${campos().map(celda).join('')}
      <td class="av" data-av>${av.map(esc).join('<br>')}</td>
      <td>${dis ? '' : `<button class="ftb" title="Quitar" onclick="SUB.${k}.quitar(${n.id})">✕</button>`}</td>
    </tr>`;
  }
  function cabecera() {
    const faltan = porGuardar().length, hechas = items.filter(n => n.estado === 'ok' || n.estado === 'dup').length;
    const oc = ocupado();
    el('guardar').disabled = !faltan || oc;
    el('aplicar').disabled = oc;
    el('aplicar').textContent = oc ? 'Espera, leyendo fotos…' : 'Aplicar';
    el('limpiar').style.display = hechas ? '' : 'none';
    el('bulk').style.display = items.length ? '' : 'none';
    document.getElementById(k + '-badge').textContent = faltan ? ` (${faltan})` : '';
    el('cont').textContent = items.length ? `${items.length} ${items.length !== 1 ? cfg.que : cfg.una} · ${faltan} por registrar${leyendo ? ` · leyendo ${leyendo + cola.length}` : ''}` : '';
  }
  function render() {
    if (!cat) return;
    const drop = `<div class="drop" id="${k}-drop" onclick="document.getElementById('${k}-fotos').click()">
        <b>${items.length ? 'Agregar más fotos' : `Elige o arrastra aquí las fotos de ${cfg.de}`}</b><br>
        Puedes escoger varias a la vez. La IA lee cada una y tú revisas antes de registrar.</div>`;
    el('lista').innerHTML = items.length ? `<div class="tw"><table id="${k}-tbl" data-sub="${k}"><thead><tr><th>Foto</th><th></th>
        ${campos().map(c => `<th>${c.t}</th>`).join('')}<th>Avisos</th><th></th></tr></thead>
        <tbody>${items.map(fila).join('')}</tbody></table></div><div style="padding:12px 16px">${drop}</div>` : `<div style="padding:16px">${drop}</div>`;
    const dz = el('drop');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); agregarFotos(e.dataTransfer.files); });
    cabecera();
  }
  // Cambia solo la fila de esa foto (para no perder lo que se está escribiendo en otra)
  function renderFila(n) {
    const tr = document.querySelector(`#${k}-tbl tr[data-id="${n.id}"]`);
    if (!tr) return render();
    tr.outerHTML = fila(n, items.indexOf(n));
    cabecera();
  }
  // Lo que se escribe en la tabla va directo a su fila
  function escribir(tr, f, valor) {
    const n = items.find(x => x.id == tr.dataset.id);
    if (!n) return;
    const antes = { ...n.d };
    n.d[f] = valor;
    ajustar(n, [f]);
    // Un desplegable que cambia las opciones o los datos de otros (chofer, obra): se vuelve a dibujar la fila
    if (cfg.rehacer?.includes(f)) return renderFila(n);
    // Si no, solo se ponen los datos que cambiaron solos, sin tocar lo que se está escribiendo
    for (const c of campos().filter(c => c.f !== f && c.tipo !== 'calc' && n.d[c.f] !== antes[c.f])) {
      const x = tr.querySelector(`[data-f="${c.f}"]`);
      if (x && x.type === 'checkbox') { x.checked = !!n.d[c.f]; continue; }
      if (x) x.value = n.d[c.f] ?? '';
      if (x && x.value !== String(n.d[c.f] ?? '')) return renderFila(n);     // ese valor no estaba en el desplegable
    }
    campos().filter(c => c.tipo === 'calc').forEach(c => tr.querySelector(`[data-calc="${c.f}"]`).textContent = c.calc(n.d, cat) || '—');
    tr.querySelector('[data-av]').innerHTML = avisos(n).map(esc).join('<br>');
    // El folio u otro dato puede cambiar los avisos de las demás (repetidos en la lista)
    if (cfg.avisosLista?.includes(f)) document.querySelectorAll(`#${k}-tbl tr[data-id]`).forEach(o => {
      const m = o !== tr && items.find(x => x.id == o.dataset.id);
      if (m && m.estado !== 'leyendo') o.querySelector('[data-av]').innerHTML = avisos(m).map(esc).join('<br>');
    });
  }

  // Renglones sin foto (capturados del papel); con datos = varios iguales, que luego se pueden cambiar uno por uno
  function sinFoto(cant, datos) {
    if (!cat) return;
    for (let i = 0; i < (cant || 1); i++) {
      const n = { id:++sig, foto:null, estado:'pendiente', msg:'', d:{ ...cfg.vacia(), ...(cfg.sinFoto || {}), ...(datos || {}) } };
      if (datos) ajustar(n, Object.keys(datos));
      items.push(n);
    }
    render();
  }
  function quitar(id) { items = items.filter(n => n.id !== id); render(); }
  function limpiar() { items = items.filter(n => n.estado !== 'ok' && n.estado !== 'dup'); render(); }

  async function agregarFotos(files) {
    if (!cat) return;
    for (const f of [...files].filter(f => f.type.startsWith('image/'))) {
      const n = { id:++sig, foto:null, estado:'leyendo', msg:'', d:cfg.vacia() };
      items.push(n);
      try { n.foto = await reducirFoto(f); cola.push(n); }
      catch(e) { n.estado = 'pendiente'; n.msg = `${f.name}: ${e.message}. Captúrala a mano o vuelve a elegirla.`; }
    }
    render();
    while (leyendo < LECTORES && cola.length) leerSiguiente();
  }
  async function leerSiguiente() {
    const n = cola.shift();
    if (!n) return;
    leyendo++;
    try {
      const { datos } = await Sesion.api({ action:cfg.acciones.extraer, foto:n.foto }, 90000);
      if (datos) { Object.assign(n.d, cfg.deIA(datos)); ajustar(n, ['ia']); }
      else n.msg = 'La IA no pudo leerla: captura los datos a mano';
    } catch(e) { n.msg = 'No se pudo leer: ' + e.message + '. Captura los datos a mano.'; }
    n.estado = 'pendiente';
    leyendo--;
    renderFila(n);
    if (cola.length) leerSiguiente(); else if (!leyendo) render();
  }

  function aplicar() {
    if (ocupado()) return alert('Espera a que la IA termine de leer todas las fotos');
    const vals = {};
    el('bulkc').querySelectorAll('[data-b]').forEach(x => { if (x.value) vals[x.dataset.b] = x.value; });
    if (!Object.keys(vals).length) return alert('Escoge al menos un dato para aplicar');
    porGuardar().forEach(n => { Object.assign(n.d, vals); ajustar(n, Object.keys(vals)); });
    render();
  }

  async function guardar() {
    const lista = porGuardar();
    // [campo, texto, (opcional) solo en las que cumplan esto]
    const faltan = cfg.requeridos.map(([f, txt, si]) => [lista.filter(n => !n.d[f] && (!si || si(n))).length, txt]).filter(([c]) => c).map(([c, txt]) => `${c} ${txt}`);
    if (faltan.length) return alert(faltan.join(', ') + '. Complétalas antes de registrar.');
    const conAviso = lista.filter(n => avisos(n).length).length;
    if (!(await preguntar(`Se van a registrar ${lista.length} ${lista.length !== 1 ? cfg.que : cfg.una} en ${cfg.donde}` +
      (conAviso ? ` (${conAviso} con avisos)` : '') + '.\n\n¿Continuar?', 'Sí, registrar'))) return;
    el('guardar').disabled = true; bar(true);
    let ok = 0, dup = 0, mal = 0;
    for (const n of lista) {
      n.estado = 'guardando'; n.msg = ''; renderFila(n);
      try {
        const j = await Sesion.api({ action:cfg.acciones.guardar, [cfg.acciones.campo]:{ ...n.d, foto:n.foto || '' } }, 90000);
        n.estado = 'ok'; n.msg = j.url ? 'Foto guardada en Drive' : ''; ok++;
      } catch(e) {
        if (e.code === 'DUPLICADA') { n.estado = 'dup'; n.msg = e.message; dup++; }
        else { n.estado = 'error'; n.msg = e.message; mal++; }
      }
      renderFila(n);
    }
    bar(false);
    cfg.alGuardar?.();
    render();
    alert(`Registradas: ${ok}` + (dup ? `\nYa estaban registradas (no se repitieron): ${dup}` : '') + (mal ? `\nCon error: ${mal} (quedan marcadas en rojo para reintentar)` : ''));
  }

  return { abrir, sinFoto, quitar, limpiar, aplicar, guardar, escribir, reajustar, catalogo: () => cat,
           pendientes: () => porGuardar().length + leyendo };
}

document.addEventListener('input', e => {
  const tbl = e.target.closest?.('table[data-sub]'), tr = e.target.closest?.('tr[data-id]');
  if (tbl && tr && e.target.dataset.f) SUB[tbl.dataset.sub].escribir(tr, e.target.dataset.f, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
});
window.addEventListener('beforeunload', e => { if (Object.values(SUB).some(s => s.pendientes())) { e.preventDefault(); e.returnValue = ''; } });

// ── Notas de viaje (Viajes.gs) ──
const clienteDeObra = (obra, cat) => (cat?.obras || []).find(o => claveVj(o.obra) === claveVj(obra))?.cliente || '';
const placaK = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

// Camión de un chofer en un día: lo último guardado en "Camiones del día" con fecha igual o anterior;
// si nunca se le ha guardado, su última placa en las notas (o en el diésel). placa '' = ese día no traía camión.
function camionDe(chofer, fecha, cat, ultima) {
  if (!chofer || !cat) return null;
  const k = claveVj(chofer), dia = fecha || txtFecha(new Date());
  let a = null;
  (cat.camiones || []).forEach(x => { if (claveVj(x.chofer) === k && x.fecha <= dia && (!a || x.fecha >= a.fecha)) a = x; });
  if (a) return { placa:a.placa, de:'dia', fecha:a.fecha, guardo:a.guardo, cuando:a.cuando, motivo:a.motivo || '' };
  const u = Object.entries(ultima || {}).find(([c]) => claveVj(c) === k)?.[1];
  // Si la placa de su última nota está mal escrita (no está en el catálogo) no se toma: no se podría guardar
  const enCatalogo = p => !(cat.placas || []).length || cat.placas.some(x => x.placa === p);
  return u && enCatalogo(u.placa) ? { placa:u.placa, de:'ultima', fecha:u.fecha } : null;
}
// Materiales que ya se han llevado a una obra (los del catálogo, del más usado al menos usado)
function usadosEnObra(obra, cat) {
  if (!obra || !cat) return [];
  const cuenta = {};
  Object.entries(cat.materialesObra || {}).filter(([o]) => claveVj(o) === claveVj(obra))
    .forEach(([, ms]) => Object.entries(ms).forEach(([m, n]) => cuenta[claveVj(m)] = (cuenta[claveVj(m)] || 0) + n));

}
const opsPlacas = cat => (cat.placas || []).map(p => ({ v:p.placa, t:p.placa + (p.descripcion ? ' · ' + p.descripcion : '') }));

// ══════════════════════════════════════════
//  DIARIO (Diario.gs): qué camión trae cada chofer, cm de diésel en el tanque, km de ProTrack,
//  notas con foto / en papel, diésel del día y el resumen para pegar en el grupo
// ══════════════════════════════════════════
const masDias = (s, n) => { const d = fechaLocal(s); d.setDate(d.getDate() + n); return txtFecha(d); };
const diaNombre = s => diaVj(s).charAt(0) + diaVj(s).slice(1).toLowerCase();
const nombreCorto = s => { const p = String(s || '').trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[1][0]}.` : p[0] || ''; };
const vacioCm = v => v === '' || v == null;
// Litros en un tanque cilíndrico acostado con h cm de diésel (diámetro y largo en cm)
function litrosCilindro(h, diam, largo) {
  if (!(h >= 0) || !(diam > 0) || !(largo > 0)) return null;
  const r = diam / 2, x = Math.min(h, diam);
  return (r * r * Math.acos((r - x) / r) - (r - x) * Math.sqrt(Math.max(0, 2 * r * x - x * x))) * largo / 1000;
}
// Litros en los tanques de un camión (null si faltan las medidas del tanque o algún cm)
function litrosCamion(placa, cm1, cm2, tanques) {
  const t = tanques?.[placa];
  if (!t || !t.diametro || !t.largo || vacioCm(cm1)) return null;
  const a = litrosCilindro(+cm1, t.diametro, t.largo);
  if (t.tanques !== 2 || a == null) return a;
  return vacioCm(cm2) ? null : a + litrosCilindro(+cm2, t.diametro, t.largo);
}
// km de cada placa en cada fecha, según qué camión es cada dispositivo de ProTrack: { 'PLACA|fecha': km }
function kmPorPlaca(km, dispositivos) {
  const o = {};
  (km || []).forEach(r => { const p = dispositivos?.[r.dispositivo]; if (p) o[p + '|' + r.fecha] = (o[p + '|' + r.fecha] || 0) + r.km; });
  return o;
}
// "Informe sobre kilometraje" de ProTrack: un bloque por dispositivo ("Dispositivo:NOMBRE") con un renglón por día
// También el "Resumen de movimiento" (.xls): "Desde AAAA-MM-DD Hasta AAAA-MM-DD" y un renglón por dispositivo
// (# · Nombre del dispositivo · Kilometraje · Exceso de velocidad · Estacionamiento) con el total del periodo;
// solo sirve si es de un día, porque no trae cada día por separado.
function leerInformeKm(wb) {
  const out = [];
  wb.SheetNames.forEach(n => {
    let disp = '', rango = null, resumen = false;
    XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:false, defval:'' }).forEach(r => {
      const a = String(r[0] ?? '').trim(), m = a.match(/^Dispositivo\s*:\s*(.+)$/i);
      const dh = a.match(/Desde\s+(\d{4}-\d{2}-\d{2})\s+Hasta\s+(\d{4}-\d{2}-\d{2})/i);
      if (dh) { rango = { desde:dh[1], hasta:dh[2] }; return; }
      if (/nombre del dispositivo/i.test(String(r[1] ?? ''))) { resumen = !!rango; return; }
      if (resumen && /^\d+$/.test(a) && String(r[1] ?? '').trim()) {
        if (rango.desde !== rango.hasta) throw new Error(`ese "Resumen de movimiento" es de varios días (del ${fechaCorta(rango.desde)} al ${fechaCorta(rango.hasta)}) y no trae cada día por separado. `
          + 'Descárgalo de un solo día, o usa el "Informe sobre kilometraje", que sí viene por día.');
        out.push({ fecha:rango.desde, dispositivo:String(r[1]).trim(), km:parseFloat(r[2]) || 0, excesos:parseInt(r[3]) || 0, paradas:parseInt(r[4]) || 0 });
        return;
      }
      if (m) { disp = m[1].trim(); resumen = false; return; }
      const fecha = String(r[1] ?? '').trim().slice(0, 10);
      if (disp && /^\d+$/.test(a) && /^\d{4}-\d{2}-\d{2}$/.test(fecha))
        out.push({ fecha, dispositivo:disp, km:parseFloat(r[2]) || 0, excesos:parseInt(r[3]) || 0, paradas:parseInt(r[4]) || 0 });
    });
  });
  return out;
}

  function botonGuardar() {
    const b = $d('dr-guardar'); if (b && !b.disabled) b.textContent = 'Guardar reparto';
    const c = $d('dr-guardar-cm'); if (c && !c.disabled) c.textContent = hayCambiosCm() ? 'Guardar cm (hay cambios)' : 'Guardar cm';
  }
  // Después de guardar camiones: Subir notas / tickets ponen la placa con lo nuevo, y los días siguientes se vuelven a leer
  function trasCamiones(j) {
    D.camiones = j.camiones;
    [SUB.nt, SUB.tk].forEach(s => { const c = s.catalogo(); if (c) { c.camiones = j.camiones; s.reajustar('camiones'); } });
    olvidar(); CACHE[D.fecha] = D;
    Object.keys(DS_CACHE).forEach(x => delete DS_CACHE[x]);
  }

  // Guardar reparto: se guarda el camión de TODOS los choferes ese día (también "sin camión"); desde ahí queda fijo
  async function guardar() {
    if (bloqueado()) return alert('El reparto de este día ya está guardado. Para cambiar un camión toca "Cambiar".');
    const f = D.fecha, camiones = D.filas.map(x => ({ chofer:x.chofer, placa:x.placa }));
    if (!camiones.length) return alert('No hay choferes en el catálogo');
    const b = $d('dr-guardar'); b.disabled = true; b.textContent = 'Guardando…'; bar(true);
    try {
      trasCamiones(await api({ action:'camiones_guardar', fecha:f, camiones }));
      // Los cm que ya se habían escrito siguen en pantalla
      const cms = Object.fromEntries(D.filas.map(x => [x.chofer, [x.cm1, x.cm2]]));
      armarFilas(); D.filas.forEach(x => { const c = cms[x.chofer]; if (c && seMide(x.placa)) [x.cm1, x.cm2] = c; });
      pintar();
    } catch(e) { alert('No se guardó: ' + e.message); }
    finally { b.disabled = false; bar(false); botonGuardar(); }
  }

  async function guardarCm() {
    const lecturas = {};
    D.filas.filter(cambioCm).forEach(x => lecturas[x.placa] = { placa:x.placa, cm1:x.cm1, cm2:x.cm2 });
    if (!Object.keys(lecturas).length) return alert('No hay cm nuevos que guardar');
    const b = $d('dr-guardar-cm'); b.disabled = true; b.textContent = 'Guardando…'; bar(true);
    try {
      D.cm = (await api({ action:'cm_guardar', fecha:D.fecha, lecturas:Object.values(lecturas) })).cm;
      olvidar(); CACHE[D.fecha] = D;
      Object.keys(DS_CACHE).forEach(x => delete DS_CACHE[x]);
      pintar();
    } catch(e) { alert('No se guardó: ' + e.message); }
    finally { b.disabled = false; bar(false); botonGuardar(); }
  }

  // Ya guardado el reparto: cambiar el camión de un chofer ese día, con su motivo
  function cambiar(i) {
    const x = D.filas[i];
    if (!x) return;
    const ops = opsPlacas(D);
    const ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c ed" role="dialog">
      <div class="dlg-t" style="margin-bottom:8px"><b>Cambiar el camión de ${esc(x.chofer)}</b> · ${diaNombre(D.fecha).toLowerCase()} ${fechaCorta(D.fecha)}</div>
      <div class="ed-info">Ahora: ${x.placa ? esc(placaTxtD(x.placa)) : 'sin camión'}. El cambio vale desde este día y queda anotado con su motivo.</div>
      <div class="ed-g"><label class="w2">Camión<select class="ci" data-k="placa"><option value="">— Sin camión —</option>${ops.map(o =>
        `<option value="${esc(o.v)}" ${x.placa === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select></label>
        <label class="w2">Motivo del cambio<input class="ci" data-k="motivo" maxlength="200" list="dr-motivos" placeholder="p. ej. se descompuso el camión">
        <datalist id="dr-motivos"><option value="Se descompuso el camión"><option value="El chofer faltó"><option value="Cambio de obra"><option value="Se había capturado mal"></datalist></label></div>
      <div class="dlg-b"><button class="ftb" data-a="no">Cancelar</button><button class="ftb p" data-a="si">Guardar cambio</button></div></div>`;
    const cerrar = () => { ov.remove(); removeEventListener('keydown', tecla, true); };
    const tecla = e => { if (e.key === 'Escape' && document.querySelectorAll('.dlg').length === 1) { e.preventDefault(); cerrar(); } };
    ov.addEventListener('click', async e => {
      const a = e.target.dataset?.a;
      if (a === 'no') return cerrar();
      if (a !== 'si') return;
      const placa = ov.querySelector('[data-k=placa]').value, motivo = ov.querySelector('[data-k=motivo]').value.trim();
      if (placa === x.placa) return alert('Escoge un camión diferente al que ya tiene.');
      if (!motivo) return alert('Escribe el motivo del cambio.');
      const otro = D.filas.find(y => y !== x && placa && y.placa === placa);
      if (otro && !(await preguntar(`${placaTxtD(placa)} ya lo trae ${otro.chofer}. ¿Ponerlo también con ${x.chofer}? (luego cambia el de ${otro.chofer})`, 'Sí, cambiar'))) return;
      e.target.disabled = true; e.target.textContent = 'Guardando…'; bar(true);
      try {
        trasCamiones(await api({ action:'camiones_guardar', fecha:D.fecha, camiones:[{ chofer:x.chofer, placa, motivo }] }));
        cerrar();
        armarFilas(); pintar();
      } catch(err) { e.target.disabled = false; e.target.textContent = 'Guardar cambio'; alert('No se guardó: ' + err.message); }
      finally { bar(false); }
    });
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    ov.querySelector('[data-k=placa]').focus();
  }

  // Mensaje con el reparto del día: qué camión trae cada chofer (y los cambios con su motivo)
  function reparto() {
    const f = D.fecha, L = [`*Camiones del ${diaNombre(f).toLowerCase()} ${fechaCorta(f)}*`];
    const con = D.filas.filter(x => x.placa);
    con.forEach(x => {
      const p = (D.placas || []).find(y => y.placa === x.placa);
      L.push(`• ${p?.descripcion ? p.descripcion + ' ' : ''}${x.placa}: ${x.chofer}${x.cam?.fecha === f && x.cam?.motivo ? ` (cambio: ${x.cam.motivo})` : ''}`);
    });
    if (!con.length) L.push('• Sin camiones');
    return L.join('\n');
  }
  async function copiarReparto() {
    const txt = reparto();
    try { await navigator.clipboard.writeText(txt); alert('Reparto copiado. Pégalo en WhatsApp.'); }
    catch(e) { alert('No se pudo copiar solo. Este es el texto:\n\n' + txt); }
  }

  async function subirKm(files) {
    files = [...files];
    if (!files.length) return;
    try {
      if (!window.XLSX) await cargarScript(XLSX_URL);
      const filas = [];
      for (const file of files) filas.push(...leerInformeKm(XLSX.read(await file.arrayBuffer())));
      if (!filas.length) return alert('No encontré kilometraje en ese archivo. Debe ser el "Informe sobre kilometraje" o el "Resumen de movimiento" (de un día) que descargas de ProTrack.');
      const fechas = [...new Set(filas.map(x => x.fecha))].sort(), disp = new Set(filas.map(x => x.dispositivo)).size;
      const rango = fechas.length === 1 ? 'del ' + fechaCorta(fechas[0]) : `del ${fechaCorta(fechas[0])} al ${fechaCorta(fechas[fechas.length - 1])}`;
      if (!(await preguntar(`Informe de kilometraje ${rango}: ${disp} dispositivos, ${f0(filas.reduce((s, x) => s + x.km, 0))} km en total.\n\n¿Guardarlo?`, 'Sí, guardar'))) return;
      bar(true);
      await api({ action:'km_guardar', filas });

  // "Viaje explicado": por qué un camión trabajó sin notas (quitar = se guarda vacío)

  async function confirmar(valor) {

  function resumen() {

      cambios.push(`• ${nombreCorto(a.chofer)}: ${antes?.placa || 'sin camión'} → ${a.placa || 'sin camión'} (${a.motivo})`);

    const n = D.notasDia, foto = n.filter(v => v.foto), papel = n.filter(v => v.entregado), faltan = foto.filter(v => !v.entregado);

      + `folio${g.items.length > 1 ? 's' : ''} ${g.items.map(v => (v.folio || 's/folio') + (conFecha ? ` (${fechaCorta(v.fecha)})` : '')).join(', ')}`).join(' · ');
    const cuando = f === masDias(txtFecha(new Date()), -1) ? 'Ayer' : `El ${diaNombre(f).toLowerCase()}`;
    const sinFoto = n.filter(v => !v.foto);
    L.push('', `*Notas*: ${n.length} · ${foto.length} con foto · ${papel.length} ya en papel`);
    if (faltan.length) L.push('Faltan en papel: ' + porChofer(faltan));
    if (sinFoto.length) L.push(`${cuando} no enviaron foto: ` + porChofer(sinFoto));
    const siguen = D.pendPapel.filter(v => !v.entregado);
    if (siguen.length) L.push('De días anteriores siguen sin papel: ' + porChofer(siguen, true));

    const tk = D.tickets || [];

    tk.forEach(t => L.push(`• ${nombreCorto(t.chofer)} – ${t.unidad.split(' — ')[0]} – ${f0(t.litros)} L`));
    const cam = D.filas.filter(x => seMide(x.placa));      // a los que no se les miden cm no salen

        return `${nombreCorto(x.chofer)} ${x.cm1}${vacioCm(x.cm2) ? '' : '/' + x.cm2} cm${l == null ? '' : ` (≈${f0(Math.round(l))} L)`}`;
      }).join(' · '));

    const exc = (D.km || []).filter(r => r.excesos > 0);

      const p = D.dispositivos[r.dispositivo], ch = p && D.filas.find(x => x.placa === p)?.chofer;

const ALERTAS_DS = { litros_min:30, precio_min:15, precio_max:45, dias_max:60, diff_monto:0.10 };
function avisosTicket(d) {
  const av = [], L = parseFloat(d.litros), M = parseFloat(d.monto), P = parseFloat(d.precio);
  if (L > 0 && L < ALERTAS_DS.litros_min) av.push(`Carga baja: ${L} L`);
  if (P > 0 && (P < ALERTAS_DS.precio_min || P > ALERTAS_DS.precio_max)) av.push(`Precio fuera de rango: $${P}/L`);
  if (L > 0 && P > 0 && M > 0 && Math.abs(L * P - M) / M > ALERTAS_DS.diff_monto) av.push(`${L} L × $${P} = $${f0(L * P)}, no $${f0(M)}`);
  if (d.fecha) { const dias = diasDesde(d.fecha); if (dias > ALERTAS_DS.dias_max) av.push(`Ticket de hace ${dias} días`); if (dias < -1) av.push('La fecha es futura'); }
  return av;
}

const DS_CACHE = {};
let DS = null;
const $$ = v => '$' + new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}).format(N(v));

// Semana (lunes a domingo) o mes completo del día escogido
const porMesDs = () => document.getElementById('ds-per').value === 'mes';
function periodoDs(dia) {
  if (!porMesDs()) return semanaVj(dia);
  const d = fechaLocal(dia);
  return { desde:txtFecha(new Date(d.getFullYear(), d.getMonth(), 1)), hasta:txtFecha(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
}
const queDs = () => porMesDs() ? 'mes' : 'semana';
const esteDs = () => porMesDs() ? 'este mes' : 'esta semana';
const tituloDs = () => porMesDs()
  ? `Mes de ${MESES[+DS.desde.slice(5, 7) - 1].toLowerCase()} ${DS.desde.slice(0, 4)}`
  : `Semana del ${fechaCorta(DS.desde)} al ${fechaCorta(DS.hasta)} ${DS.hasta.slice(0, 4)}`;
function moverDs(n) {
  const inp = document.getElementById('ds-dia');
  const d = fechaLocal(inp.value || txtFecha(new Date()));
  if (porMesDs()) d.setMonth(d.getMonth() + n, 1); else d.setDate(d.getDate() + 7 * n);
  inp.value = txtFecha(d);
  cargarDiesel();
}
async function cargarDiesel(forzar) {
  const inp = document.getElementById('ds-dia');
  if (!inp.value) inp.value = txtFecha(new Date());
  const { desde, hasta } = periodoDs(inp.value);
  const k = desde + '|' + hasta, body = document.getElementById('ds-body');
  if (!forzar && DS_CACHE[k]) { DS = DS_CACHE[k]; return renderDiesel(); }
  body.innerHTML = '<div class="pn"><div class="empty">Leyendo los tickets de diésel…</div></div>';
  bar(true);
  try {
    const r = DS_CACHE[k] = await api({ action:'diesel_semana', desde, hasta });
    const ahora = periodoDs(inp.value);
    if (ahora.desde + '|' + ahora.hasta === k) { DS = r; renderDiesel(); }     // mientras tanto se pidió otro periodo
  }
  catch(e) { body.innerHTML = `<div class="pn"><div class="empty">No se pudieron leer los tickets: ${esc(e.message)}</div></div>`; }
  finally { bar(false); }
}

// Tickets ordenados, con los filtros de chofer y unidad y los avisos de cada uno
function datosDiesel() {
  const cat = {}; (DS.placas||[]).forEach(p => cat[p.placa] = p);
  const uni = FD.unidad, ch = FD.chofer;
  const todos = (DS.tickets||[]).slice().sort((a,b) => a.fecha.localeCompare(b.fecha) || a.hora.localeCompare(b.hora) || a.fila - b.fila);
  const rep = {};
  todos.forEach(t => { const x = `${t.placa}|${t.fecha}|${t.monto.toFixed(2)}`; rep[x] = (rep[x]||0) + 1; });
  todos.forEach(t => {
    t.avisos = avisosTicket({ litros:t.litros, monto:t.monto, precio:t.precio, fecha:'' });
    if (t.duplicado || rep[`${t.placa}|${t.fecha}|${t.monto.toFixed(2)}`] > 1) t.avisos.push('Ticket repetido');
    if (!cat[t.placa]) t.avisos.push('Unidad no está en el catálogo');
    if (t.sin_fecha_ticket) t.avisos.push('Sin fecha del ticket (se usó la de registro)');
  });
  return { cat, todos, lista: todos.filter(t => (!uni || t.placa === uni) && (!ch || claveVj(t.chofer) === ch)) };
}
const sumaDs = (lista, k) => lista.reduce((s, t) => s + t[k], 0);
const precioProm = lista => { const L = sumaDs(lista, 'litros'); return L ? sumaDs(lista, 'monto') / L : 0; };

// Km por litro de la semana: km de ProTrack (Diario) entre los litros de los tickets.
// Si hay cm del día anterior al lunes y del último día con cm, y medidas del tanque, se corrige con lo que quedó en el tanque.
function rendimientoHtml(lista) {
  const R = DS.rendimiento, pn = (c, t) => `<div class="pn"><div class="pnh"><span>Rendimiento · km por litro${t ? ' · ' + t : ''}</span></div>
    ${subTxt(t === 'por chofer' ? 'Cuánto rinde cada chofer: km que manejó entre los litros que cargó.' : 'Cuánto rinde cada camión: km que recorrió según ProTrack entre los litros que cargó.')}${c}</div>`;
  if (!R || R.error) return pn(`<div class="empty">No se pudo calcular el rendimiento${R?.error ? ': ' + esc(R.error) : ''}</div>`);
  const kmP = kmPorPlaca(R.km, R.dispositivos);
  if (!Object.keys(kmP).length) return pn(`<div class="empty">Sin km de ProTrack ${esteDs()}. Sube los informes de kilometraje en
    <a href="#" onclick="event.preventDefault();irSeccion('diario')">Diario</a>${R.km?.length ? ' y escoge qué camión es cada dispositivo' : ''}.</div>`);
  const uni = FD.unidad;
  const dias = [];
  for (let f = DS.desde; f <= DS.hasta; f = masDias(f, 1)) dias.push(f);
  // Excesos de velocidad de cada placa cada día (de los dispositivos que ya tienen camión)
  const excPF = {};
  (R.km || []).forEach(r => { const p = R.dispositivos?.[r.dispositivo]; if (p && r.fecha >= DS.desde && r.fecha <= DS.hasta) excPF[p + '|' + r.fecha] = (excPF[p + '|' + r.fecha] || 0) + r.excesos; });
  const excDe = p => dias.reduce((s, f) => s + (excPF[p + '|' + f] || 0), 0);
  const kmDe = (p, hasta) => dias.filter(f => f <= hasta).reduce((s, f) => s + (kmP[p + '|' + f] || 0), 0);
  const placas = [...new Set([...Object.keys(kmP).map(k => k.split('|')[0]), ...lista.map(t => t.placa)])].filter(p => !uni || p === uni);
  const kml = (km, L) => km > 0 && L > 0 ? km / L : null;
  const filas = placas.map(p => {
    const tks = lista.filter(t => t.placa === p), km = kmDe(p, DS.hasta), L = sumaDs(tks, 'litros'), M = sumaDs(tks, 'monto');
    const ini = R.cm.find(x => x.placa === p && x.fecha === masDias(DS.desde, -1));
    const fin = R.cm.filter(x => x.placa === p && x.fecha >= DS.desde).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    let corr = null;
    if (ini && fin) {
      const li = litrosCamion(p, ini.cm1, ini.cm2, R.tanques), lf = litrosCamion(p, fin.cm1, fin.cm2, R.tanques);
      if (li != null && lf != null) corr = kml(kmDe(p, fin.fecha), sumaDs(tks.filter(t => t.fecha <= fin.fecha), 'litros') + li - lf);
    }
    return { p, km, L, M, r:kml(km, L), corr, exc:excDe(p), unidad:tks[0]?.unidad };
  }).filter(x => x.km > 0 || x.L > 0).sort((a, b) => b.km - a.km);
  const conAmbos = filas.filter(x => x.r != null), prom = kml(conAmbos.reduce((s, x) => s + x.km, 0), conAmbos.reduce((s, x) => s + x.L, 0));
  const aviso = x => x.L > 0 && x.km < 5 ? (R.km.length ? 'Cargó y casi no se movió (o no tiene GPS)' : '')
    : x.r != null && prom && x.r < prom * 0.6 ? 'Rinde mucho menos que los demás' : x.km > 0 && !x.L ? `Sin cargas ${esteDs()}` : '';
  const nomPlaca = x => { const c = (DS.placas || []).find(y => y.placa === x.p); return x.unidad || (c?.descripcion ? `${x.p} — ${c.descripcion}` : x.p); };
  const kmlTxt = v => v == null ? '—' : v.toFixed(2);
  // Por chofer: los km de cada camión cada día van al chofer que lo traía (Camiones del día); los litros, al chofer del ticket
  const choferes = [...new Set((R.camiones || []).map(a => a.chofer))], kmCh = {}, LCh = {}, excCh = {};
  Object.entries(kmP).forEach(([k, km]) => {
    const [p, f] = k.split('|');
    if (f < DS.desde || f > DS.hasta) return;
    const ch = choferes.find(c => camionDe(c, f, R, null)?.placa === p) || '(sin chofer guardado)';
    kmCh[ch] = (kmCh[ch] || 0) + km;
    excCh[ch] = (excCh[ch] || 0) + (excPF[k] || 0);
  });
  DS.tickets.forEach(t => { if (t.chofer) LCh[t.chofer] = (LCh[t.chofer] || 0) + t.litros; });
  const nomCh = [...new Set([...Object.keys(kmCh), ...Object.keys(LCh)])].filter(c => !FD.chofer || claveVj(c) === FD.chofer)
    .sort((a, b) => (kmCh[b] || 0) - (kmCh[a] || 0));
  const tabla = (enc, filas) => `<div class="tw"><table><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody></table></div>`;
  return `
    ${pn(tabla('<th>Camión</th><th class="rt">Km</th><th class="rt">Litros cargados</th><th class="rt">km/L</th><th class="rt">$ por km</th><th class="rt" title="Corregido con los cm del tanque al empezar y al terminar">km/L con cm</th><th class="rt">Excesos de velocidad</th><th>Aviso</th>',
      filas.map(x => `<tr><td class="amb">${esc(nomPlaca(x))}</td><td class="rt">${f0(x.km)}</td><td class="rt">${f0(x.L)}</td>
        <td class="rt"><b>${kmlTxt(x.r)}</b></td><td class="rt">${x.km > 0 && x.M ? $$(x.M / x.km) : '—'}</td><td class="rt">${kmlTxt(x.corr)}</td><td class="rt${x.exc ? ' neg' : ''}">${x.exc}</td>
        <td class="av" style="color:var(--warn)">${aviso(x)}</td></tr>`).join(''))
      + `<div class="nota-pn">Promedio: <b>${kmlTxt(prom)}</b> km/L. ${porMesDs() ? 'Por mes sale más parejo que por semana.' : 'Por semana sale poco exacto porque las cargas no caen parejo (velo por mes).'}
        La columna "con cm" corrige con lo que había en el tanque el día antes de empezar y el último día con cm (cuando estén las medidas de los tanques).</div>`, 'por camión')}
    ${pn(tabla('<th>Chofer</th><th class="rt">Km</th><th class="rt">Litros</th><th class="rt">km/L</th><th class="rt">Excesos de velocidad</th>',
      nomCh.map(c => `<tr><td>${esc(c)}</td><td class="rt">${f0(kmCh[c] || 0)}</td><td class="rt">${f0(LCh[c] || 0)}</td>
        <td class="rt"><b>${kmlTxt(kml(kmCh[c] || 0, LCh[c] || 0))}</b></td><td class="rt${excCh[c] ? ' neg' : ''}">${excCh[c] || 0}</td></tr>`).join(''))
      + '<div class="nota-pn">Los km de cada día van al chofer que traía ese camión según el Diario; los litros, al chofer del ticket; los excesos, igual que los km.</div>', 'por chofer')}`;
}

// Guarda la casilla en la hoja de Diesel; si falla, la regresa como estaba
async function marcarTicket(fila, campo, chk) {
  const t = (DS.tickets||[]).find(x => x.fila === fila);
  if (!t) return;
  chk.disabled = true;
  try {
    await api({ action:'diesel_marcar', fila, campo, valor:chk.checked, fecha:t.fecha, monto:t.monto });
    t[campo] = chk.checked;
    renderDiesel();
  } catch(e) {
    chk.checked = !chk.checked; chk.disabled = false;
    alert('No se pudo guardar la casilla: ' + e.message);
  }
}

async function excelDiesel(btn) {
  if (!DS) return;
  const { lista } = datosDiesel();
  if (!lista.length) return alert(`No hay tickets en ${esteDs()}`);
  btn.disabled = true;
  try {
    if (!window.XLSX) await cargarScript(XLSX_URL);
    const nombre = porMesDs() ? `${MESES[+DS.desde.slice(5, 7) - 1]} ${DS.desde.slice(0, 4)}` : `${ddmmyy(DS.desde)}-${ddmmyy(DS.hasta)}`;
    const hoja = XLSX.utils.aoa_to_sheet([['', 'DIÉSEL — ' + tituloDs().toUpperCase()], [],
      ['FECHA','HORA','CHOFER','UNIDAD','LITROS','MONTO','PRECIO/L','GASOLINERA','FACTURADO','RECIBIDO FÍSICO'],
      ...lista.map(t => [celdaFecha(t.fecha), t.hora, t.chofer, t.unidad, t.litros, t.monto, t.precio || '', t.gasolinera, t.facturado ? 'SÍ' : 'NO', t.recibido ? 'SÍ' : 'NO']),
      [], ['', '', '', 'TOTAL', sumaDs(lista, 'litros'), sumaDs(lista, 'monto')]]);
    hoja['!cols'] = [11,7,18,24,9,11,9,28,10,14].map(wch => ({ wch }));
    const fila = x => [x.items.length, sumaDs(x.items, 'litros'), sumaDs(x.items, 'monto'), Math.round(precioProm(x.items) * 100) / 100];
    const hoja2 = XLSX.utils.aoa_to_sheet([['POR CAMIÓN'], ['UNIDAD','TICKETS','LITROS','MONTO','PRECIO PROM.'],
      ...agruparVj(lista, t => t.placa).map(x => [x.items[0].unidad, ...fila(x)]), [],
      ['POR CHOFER'], ['CHOFER','TICKETS','LITROS','MONTO','PRECIO PROM.'],
      ...agruparVj(lista, t => claveVj(t.chofer)).map(x => [x.items[0].chofer, ...fila(x)])]);
    hoja2['!cols'] = [24,9,10,12,12].map(wch => ({ wch }));
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, nombre);
    XLSX.utils.book_append_sheet(libro, hoja2, 'TOTALES');
    XLSX.writeFile(libro, `DIESEL ${nombre}.xlsx`);
  } catch(e) { alert('No se pudo generar el Excel: ' + e.message); }
  finally { btn.disabled = false; }
}

function whatsDiesel() {
  if (!DS) return;
  const { lista } = datosDiesel();
  if (!lista.length) return alert(`No hay tickets en ${esteDs()}`);
  const sinFact = lista.filter(t => !t.facturado).length, avisos = lista.filter(t => t.avisos.length).length;
  const texto = [
    `*Diésel — ${tituloDs()}*`,
    `Total: ${f0(sumaDs(lista, 'litros'))} L · ${$$(sumaDs(lista, 'monto'))} (${lista.length} tickets, ${$$(precioProm(lista))}/L)`,
    '', '*Por camión*',
    ...agruparVj(lista, t => t.placa).sort((a,b) => sumaDs(b.items,'litros') - sumaDs(a.items,'litros'))
      .map(x => `• ${x.items[0].unidad}: ${f0(sumaDs(x.items, 'litros'))} L · ${$$(sumaDs(x.items, 'monto'))}`),
    ...(sinFact ? ['', `🧾 ${sinFact} ticket${sinFact!==1?'s':''} sin facturar`] : []),
    ...(avisos ? [`⚠️ ${avisos} con aviso por revisar`] : []),
  ].join('\n');
  window.open(`https://wa.me/${WA_NUM}?text=` + encodeURIComponent(texto), '_blank');
}

setTheme(document.documentElement.dataset.theme==='light' ? 'light' : 'dark', false);   // etiqueta inicial del botón

// Sin permiso de viajes regresa a index.html
Sesion.requerir('viajes').then(s => {
  document.getElementById('sb-user').textContent = s.nombre;
  PUEDE_OBRAS = (s.permisos || []).includes('obras');
  document.getElementById('vj-obras').hidden = !PUEDE_OBRAS;
  document.getElementById('vj-conc').hidden = !PUEDE_OBRAS;
  document.getElementById('app').style.display = 'flex';
  document.getElementById('vj-dia').value = txtFecha(new Date());
  // El Diario abre en ayer (el resumen de cada mañana); el lunes, en el sábado si el domingo no hubo nada
  // Tarjetas del inicio: viajes.html#fletes, #subir, #diesel, #tickets abren esa pestaña
  const pestana = document.querySelector(`nav a[data-s="${location.hash.slice(1)}"]`);
  if (pestana && pestana.dataset.s !== 'diario') pestana.click(); else Diario.ir(-1);
}).catch(e => alert('No se pudo revisar la sesión: ' + e.message));
