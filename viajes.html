function vistaDs(v) { VISTA_DS = v; guardarVista('ds-vista', v); mostrarVista(document.getElementById('ds-body'), v); }
function filtrarDs(k, v) { FD[k] = v; renderDiesel(); }

// Tickets ordenados, con los filtros de chofer y unidad y los avisos de cada uno
function datosDiesel() {
  const cat = {}; (DS.placas||[]).forEach(p => cat[p.placa] = p);
  const uni = FD.unidad, ch = FD.chofer;
  const todos = (DS.tickets||[]).slice().sort((a,b) => a.fecha.localeCompare(b.fecha) || a.hora.localeCompare(b.hora) || a.fila - b.fila);
  const rep = {};
  todos.forEach(t => { const x = `${t.placa}|${t.fecha}|${t.monto.toFixed(2)}`; rep[x] = (rep[x]||0) + 1; });
  todos.forEach(t => {
    t.avisos = avisosTicket({ litros:t.litros, monto:t.monto, precio:t.precio, fecha:'' });
    if (t.duplicado || rep[`${t.placa}|${t.fecha}|${t.monto.toFixed(2)}`] > 1) t.avisos.push('Ticket repetido');
    if (!cat[t.placa]) t.avisos.push('Unidad no está en el catálogo');
    if (t.sin_fecha_ticket) t.avisos.push('Sin fecha del ticket (se usó la de registro)');
  });
  return { cat, todos, lista: todos.filter(t => (!uni || t.placa === uni) && (!ch || claveVj(t.chofer) === ch)) };
}
const sumaDs = (lista, k) => lista.reduce((s, t) => s + t[k], 0);
const precioProm = lista => { const L = sumaDs(lista, 'litros'); return L ? sumaDs(lista, 'monto') / L : 0; };

function renderDiesel() {
  if (!DS) return;
  const body = document.getElementById('ds-body');
  const { todos, lista } = datosDiesel();
  const titulo = tituloDs();
  if (!todos.length && !(DS.rendimiento?.km || []).length) {
    const ult = DS.ultima && DS.ultima < DS.desde
      ? `<br>El último ticket registrado es del <b>${DS.ultima}</b>. <button class="ftb" onclick="document.getElementById('ds-dia').value='${DS.ultima}';cargarDiesel()">Ir a ${porMesDs() ? 'ese mes' : 'esa semana'}</button>` : '';
    body.innerHTML = `<div class="pn"><div class="pnh">${titulo}</div><div class="empty">Sin tickets de diésel ${esteDs()}${ult}</div></div>`;
    return;
  }
  // Filtros de chofer y unidad (cada lista muestra lo que hay con el otro filtro puesto)
  const opsDs = (k, get, txt) => {
    const otro = k === 'chofer' ? t => !FD.unidad || t.placa === FD.unidad : t => !FD.chofer || claveVj(t.chofer) === FD.chofer;
    const m = new Map();
    todos.filter(otro).forEach(t => { const c = get(t); if (!c) return; if (!m.has(c)) m.set(c, { c, t:txt(t), n:0 }); m.get(c).n++; });
    if (FD[k] && !m.has(FD[k])) m.set(FD[k], { c:FD[k], t:FD[k], n:0 });
    return [...m.values()].sort((a, b) => a.t.localeCompare(b.t, 'es'));
  };
  const defs = [['chofer', 'Chofer', t => claveVj(t.chofer), t => t.chofer], ['unidad', 'Unidad', t => t.placa, t => t.unidad]];
  const puestos = defs.filter(([k]) => FD[k]);
  const txtPuesto = ([k, , get, txt]) => { const t = todos.find(x => get(x) === FD[k]); return t ? txt(t) : FD[k]; };
  const filtros = `<details class="pn fil" ${FIL_DS_ABIERTO ? 'open' : ''} ontoggle="FIL_DS_ABIERTO = this.open">
      <summary class="pnh"><span>Filtros${puestos.length ? ` (${puestos.length})` : ''} · chofer, unidad</span><span class="fl"></span></summary>
      <div class="vj-fil">${defs.map(([k, n, get, txt]) => `<label>${n}<select class="${FD[k] ? 'on' : ''}" onchange="filtrarDs('${k}', this.value)">
        <option value="">Todos</option>${opsDs(k, get, txt).map(o => `<option value="${esc(o.c)}" ${FD[k] === o.c ? 'selected' : ''}>${esc(o.t)} (${o.n})</option>`).join('')}</select></label>`).join('')}</div>
    </details>
    ${puestos.length ? `<div class="vj-chips" style="padding:0">${puestos.map(d => `<button class="chip" onclick="filtrarDs('${d[0]}', '')" title="Quitar este filtro">${d[1]}: ${esc(txtPuesto(d))} ✕</button>`).join('')}
      <button class="ftb" onclick="FD.chofer = FD.unidad = ''; renderDiesel()">Quitar filtros</button>
      <span style="color:var(--muted)">${lista.length} de ${todos.length} tickets</span></div>` : ''}`;
  const vistas = vistasHtml('vistaDs', [['tickets', 'Tickets'], ['rendimiento', 'Rendimiento']], VISTA_DS);

  const L = sumaDs(lista, 'litros'), M = sumaDs(lista, 'monto');
  const sinFact = lista.filter(t => !t.facturado).length, sinRec = lista.filter(t => !t.recibido).length;
  const conAviso = lista.filter(t => t.avisos.length);
  const tabla = (enc, filas, pie) => `<div class="tw"><table><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody>${pie ? `<tfoot><tr>${pie}</tr></tfoot>` : ''}</table></div>`;
  const tot = `<td class="rt"><b>${lista.length}</b></td><td class="rt"><b>${f0(L)}</b></td><td class="rt"><b>${$$(M)}</b></td><td class="rt"><b>${$$(precioProm(lista))}</b></td>`;
  const grupo = x => `<td class="rt">${x.items.length}</td><td class="rt amb">${f0(sumaDs(x.items, 'litros'))}</td><td class="rt">${$$(sumaDs(x.items, 'monto'))}</td><td class="rt">${$$(precioProm(x.items))}</td>`;
  const cols = '<th class="rt">Tickets</th><th class="rt">Litros</th><th class="rt">Monto</th><th class="rt">Precio prom.</th>';
  const casilla = (t, campo) => DS.marcar
    ? `<input type="checkbox" ${t[campo] ? 'checked' : ''} onchange="marcarTicket(${t.fila}, '${campo}', this)" title="${campo === 'facturado' ? 'Ya se tiene la factura' : 'El ticket en papel ya llegó'}">`
    : (t[campo] ? '✓' : '—');

  // ── Vista Tickets: lo administrativo (gasto, facturas, tickets en papel) ──
  const vTickets = !lista.length ? `<div class="pn"><div class="empty">Sin tickets ${puestos.length ? 'con estos filtros' : esteDs()}</div></div>` : `
    <div class="mg">
      <div class="mc m"><div class="ml">Litros</div><div class="mv">${f0(L)}</div><div class="ms">${titulo}</div></div>
      <div class="mc"><div class="ml">Gasto en diésel</div><div class="mv">${$$(M)}</div><div class="ms">${lista.length} ticket${lista.length!==1?'s':''} · ${$$(precioProm(lista))} por litro</div></div>
      <div class="mc ${sinFact ? 'r' : 'g'}"><div class="ml">Sin facturar</div><div class="mv">${sinFact}</div><div class="ms">${sinRec} sin ticket en papel</div></div>
      <div class="mc ${conAviso.length ? 'r' : 'g'}"><div class="ml">Con aviso</div><div class="mv">${conAviso.length}</div><div class="ms">Se marcan en rojo en la lista</div></div>
    </div>
    <div class="pn"><div class="pnh">Tickets ${porMesDs() ? 'del mes' : 'de la semana'} <span style="color:var(--muted);font-weight:400">· último registrado ${DS.ultima || '—'}${DS.marcar ? '' : ' · faltan las columnas FACTURADO / RECIBIDO FISICO en la hoja'}</span></div>
      ${subTxt('Palomea "Facturado" cuando ya se tenga la factura y "Recibido físico" cuando el ticket en papel llegue a la oficina.')}
      ${tabla('<th>Fecha</th><th>Hora</th><th>Chofer</th><th>Unidad</th><th class="rt">Litros</th><th class="rt">Monto</th><th class="rt">Precio/L</th><th>Gasolinera</th><th>Facturado</th><th>Recibido físico</th><th>Foto</th><th>Avisos</th>',
        lista.map(t => `<tr${t.avisos.length ? ' style="background:rgba(239,68,68,.08)"' : ''}>
          <td>${t.fecha}</td><td>${t.hora || '—'}</td><td>${esc(t.chofer)}</td><td>${esc(t.unidad)}</td>
          <td class="rt">${f0(t.litros)}</td><td class="rt">${$$(t.monto)}</td><td class="rt">${t.precio ? $$(t.precio) : '—'}</td>
          <td style="white-space:normal;min-width:120px">${esc(t.gasolinera) || '—'}</td>
          <td style="text-align:center">${casilla(t, 'facturado')}</td><td style="text-align:center">${casilla(t, 'recibido')}</td>
          <td>${/^https:\/\/drive\.google\.com\//.test(t.foto) ? `<a href="${esc(t.foto)}" target="_blank" rel="noopener">Ver</a>` : '—'}</td>
          <td class="av">${t.avisos.map(esc).join('<br>')}</td></tr>`).join(''),
        `<td colspan="4"><b>Total</b></td><td class="rt"><b>${f0(L)}</b></td><td class="rt"><b>${$$(M)}</b></td><td colspan="6"></td>`)}
    </div>
    <div class="two">
      <div class="pn"><div class="pnh">Por camión</div>
        ${subTxt('Litros y gasto de cada camión.')}
        ${tabla('<th>Unidad</th><th>Choferes</th>' + cols,
          agruparVj(lista, t => t.placa).sort((a,b) => sumaDs(b.items,'litros') - sumaDs(a.items,'litros')).map(x => `<tr>
            <td class="amb">${esc(x.items[0].unidad)}</td><td style="color:var(--muted)">${esc([...new Set(x.items.map(t => t.chofer))].join(', '))}</td>${grupo(x)}</tr>`).join(''),
          `<td colspan="2"><b>Total</b></td>${tot}`)}
      </div>
      <div class="pn"><div class="pnh">Por chofer</div>
        ${subTxt('Litros y gasto de lo que cargó cada chofer.')}
        ${tabla('<th>Chofer</th>' + cols,
          agruparVj(lista, t => claveVj(t.chofer)).sort((a,b) => sumaDs(b.items,'litros') - sumaDs(a.items,'litros')).map(x => `<tr>
            <td>${esc(x.items[0].chofer)}</td>${grupo(x)}</tr>`).join(''),
          `<td><b>Total</b></td>${tot}`)}
      </div>
    </div>
    <div class="pn"><div class="pnh">Por día</div>
      ${subTxt('Cargas, litros y gasto de cada día.')}
      ${tabla('<th>Día</th><th>Fecha</th>' + cols,
        agruparVj(lista, t => t.fecha).map(x => `<tr><td>${diaVj(x.k)}</td><td>${x.k}</td>${grupo(x)}</tr>`).join(''),
        `<td colspan="2"><b>Total</b></td>${tot}`)}
    </div>`;

  const c = (v, html) => `<div class="vista-c" data-v="${v}" ${VISTA_DS === v ? '' : 'hidden'}>${html}</div>`;
  body.innerHTML = vistas + filtros + c('tickets', vTickets) + c('rendimiento', rendimientoHtml(lista));
}

// Km por litro de la semana: km de ProTrack (Diario) entre los litros de los tickets.
// Si hay cm del día anterior al lunes y del último día con cm, y medidas del tanque, se corrige con lo que quedó en el tanque.
function rendimientoHtml(lista) {
  const R = DS.rendimiento, pn = (c, t) => `<div class="pn"><div class="pnh"><span>Rendimiento · km por litro${t ? ' · ' + t : ''}</span></div>
    ${subTxt(t === 'por chofer' ? 'Cuánto rinde cada chofer: km que manejó entre los litros que cargó.' : 'Cuánto rinde cada camión: km que recorrió según ProTrack entre los litros que cargó.')}${c}</div>`;
  if (!R || R.error) return pn(`<div class="empty">No se pudo calcular el rendimiento${R?.error ? ': ' + esc(R.error) : ''}</div>`);
  const kmP = kmPorPlaca(R.km, R.dispositivos);
  if (!Object.keys(kmP).length) return pn(`<div class="empty">Sin km de ProTrack ${esteDs()}. Sube los informes de kilometraje en
    <a href="#" onclick="event.preventDefault();irSeccion('diario')">Diario</a>${R.km?.length ? ' y escoge qué camión es cada dispositivo' : ''}.</div>`);
  const uni = FD.unidad;
  const dias = [];
  for (let f = DS.desde; f <= DS.hasta; f = masDias(f, 1)) dias.push(f);
  // Excesos de velocidad de cada placa cada día (de los dispositivos que ya tienen camión)
  const excPF = {};
  (R.km || []).forEach(r => { const p = R.dispositivos?.[r.dispositivo]; if (p && r.fecha >= DS.desde && r.fecha <= DS.hasta) excPF[p + '|' + r.fecha] = (excPF[p + '|' + r.fecha] || 0) + r.excesos; });
  const excDe = p => dias.reduce((s, f) => s + (excPF[p + '|' + f] || 0), 0);
  const kmDe = (p, hasta) => dias.filter(f => f <= hasta).reduce((s, f) => s + (kmP[p + '|' + f] || 0), 0);
  const placas = [...new Set([...Object.keys(kmP).map(k => k.split('|')[0]), ...lista.map(t => t.placa)])].filter(p => !uni || p === uni);
  const kml = (km, L) => km > 0 && L > 0 ? km / L : null;
  const filas = placas.map(p => {
    const tks = lista.filter(t => t.placa === p), km = kmDe(p, DS.hasta), L = sumaDs(tks, 'litros'), M = sumaDs(tks, 'monto');
    const ini = R.cm.find(x => x.placa === p && x.fecha === masDias(DS.desde, -1));
    const fin = R.cm.filter(x => x.placa === p && x.fecha >= DS.desde).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    let corr = null;
    if (ini && fin) {
      const li = litrosCamion(p, ini.cm1, ini.cm2, R.tanques), lf = litrosCamion(p, fin.cm1, fin.cm2, R.tanques);
      if (li != null && lf != null) corr = kml(kmDe(p, fin.fecha), sumaDs(tks.filter(t => t.fecha <= fin.fecha), 'litros') + li - lf);
    }
    return { p, km, L, M, r:kml(km, L), corr, exc:excDe(p), unidad:tks[0]?.unidad };
  }).filter(x => x.km > 0 || x.L > 0).sort((a, b) => b.km - a.km);
  const conAmbos = filas.filter(x => x.r != null), prom = kml(conAmbos.reduce((s, x) => s + x.km, 0), conAmbos.reduce((s, x) => s + x.L, 0));
  const aviso = x => x.L > 0 && x.km < 5 ? (R.km.length ? 'Cargó y casi no se movió (o no tiene GPS)' : '')
    : x.r != null && prom && x.r < prom * 0.6 ? 'Rinde mucho menos que los demás' : x.km > 0 && !x.L ? `Sin cargas ${esteDs()}` : '';
  const nomPlaca = x => { const c = (DS.placas || []).find(y => y.placa === x.p); return x.unidad || (c?.descripcion ? `${x.p} — ${c.descripcion}` : x.p); };
  const kmlTxt = v => v == null ? '—' : v.toFixed(2);
  // Por chofer: los km de cada camión cada día van al chofer que lo traía (Camiones del día); los litros, al chofer del ticket
  const choferes = [...new Set((R.camiones || []).map(a => a.chofer))], kmCh = {}, LCh = {}, excCh = {};
  Object.entries(kmP).forEach(([k, km]) => {
    const [p, f] = k.split('|');
    if (f < DS.desde || f > DS.hasta) return;
    const ch = choferes.find(c => camionDe(c, f, R, null)?.placa === p) || '(sin chofer guardado)';
    kmCh[ch] = (kmCh[ch] || 0) + km;
    excCh[ch] = (excCh[ch] || 0) + (excPF[k] || 0);
  });
  DS.tickets.forEach(t => { if (t.chofer) LCh[t.chofer] = (LCh[t.chofer] || 0) + t.litros; });
  const nomCh = [...new Set([...Object.keys(kmCh), ...Object.keys(LCh)])].filter(c => !FD.chofer || claveVj(c) === FD.chofer)
    .sort((a, b) => (kmCh[b] || 0) - (kmCh[a] || 0));
  const tabla = (enc, filas) => `<div class="tw"><table><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody></table></div>`;
  return `
    ${pn(tabla('<th>Camión</th><th class="rt">Km</th><th class="rt">Litros cargados</th><th class="rt">km/L</th><th class="rt">$ por km</th><th class="rt" title="Corregido con los cm del tanque al empezar y al terminar">km/L con cm</th><th class="rt">Excesos de velocidad</th><th>Aviso</th>',
      filas.map(x => `<tr><td class="amb">${esc(nomPlaca(x))}</td><td class="rt">${f0(x.km)}</td><td class="rt">${f0(x.L)}</td>
        <td class="rt"><b>${kmlTxt(x.r)}</b></td><td class="rt">${x.km > 0 && x.M ? $$(x.M / x.km) : '—'}</td><td class="rt">${kmlTxt(x.corr)}</td><td class="rt${x.exc ? ' neg' : ''}">${x.exc}</td>
        <td class="av" style="color:var(--warn)">${aviso(x)}</td></tr>`).join(''))
      + `<div class="nota-pn">Promedio: <b>${kmlTxt(prom)}</b> km/L. ${porMesDs() ? 'Por mes sale más parejo que por semana.' : 'Por semana sale poco exacto porque las cargas no caen parejo (velo por mes).'}
        La columna "con cm" corrige con lo que había en el tanque el día antes de empezar y el último día con cm (cuando estén las medidas de los tanques).</div>`, 'por camión')}
    ${pn(tabla('<th>Chofer</th><th class="rt">Km</th><th class="rt">Litros</th><th class="rt">km/L</th><th class="rt">Excesos de velocidad</th>',
      nomCh.map(c => `<tr><td>${esc(c)}</td><td class="rt">${f0(kmCh[c] || 0)}</td><td class="rt">${f0(LCh[c] || 0)}</td>
        <td class="rt"><b>${kmlTxt(kml(kmCh[c] || 0, LCh[c] || 0))}</b></td><td class="rt${excCh[c] ? ' neg' : ''}">${excCh[c] || 0}</td></tr>`).join(''))
      + '<div class="nota-pn">Los km de cada día van al chofer que traía ese camión según el Diario; los litros, al chofer del ticket; los excesos, igual que los km.</div>', 'por chofer')}`;
}

// Guarda la casilla en la hoja de Diesel; si falla, la regresa como estaba
async function marcarTicket(fila, campo, chk) {
  const t = (DS.tickets||[]).find(x => x.fila === fila);
  if (!t) return;
  chk.disabled = true;
  try {
    await api({ action:'diesel_marcar', fila, campo, valor:chk.checked, fecha:t.fecha, monto:t.monto });
    t[campo] = chk.checked;
    renderDiesel();
  } catch(e) {
    chk.checked = !chk.checked; chk.disabled = false;
    alert('No se pudo guardar la casilla: ' + e.message);
  }
}

async function excelDiesel(btn) {
  if (!DS) return;
  const { lista } = datosDiesel();
  if (!lista.length) return alert(`No hay tickets en ${esteDs()}`);
  btn.disabled = true;
  try {
    if (!window.XLSX) await cargarScript(XLSX_URL);
    const nombre = porMesDs() ? `${MESES[+DS.desde.slice(5, 7) - 1]} ${DS.desde.slice(0, 4)}` : `${ddmmyy(DS.desde)}-${ddmmyy(DS.hasta)}`;
    const hoja = XLSX.utils.aoa_to_sheet([['', 'DIÉSEL — ' + tituloDs().toUpperCase()], [],
      ['FECHA','HORA','CHOFER','UNIDAD','LITROS','MONTO','PRECIO/L','GASOLINERA','FACTURADO','RECIBIDO FÍSICO'],
      ...lista.map(t => [celdaFecha(t.fecha), t.hora, t.chofer, t.unidad, t.litros, t.monto, t.precio || '', t.gasolinera, t.facturado ? 'SÍ' : 'NO', t.recibido ? 'SÍ' : 'NO']),
      [], ['', '', '', 'TOTAL', sumaDs(lista, 'litros'), sumaDs(lista, 'monto')]]);
    hoja['!cols'] = [11,7,18,24,9,11,9,28,10,14].map(wch => ({ wch }));
    const fila = x => [x.items.length, sumaDs(x.items, 'litros'), sumaDs(x.items, 'monto'), Math.round(precioProm(x.items) * 100) / 100];
    const hoja2 = XLSX.utils.aoa_to_sheet([['POR CAMIÓN'], ['UNIDAD','TICKETS','LITROS','MONTO','PRECIO PROM.'],
      ...agruparVj(lista, t => t.placa).map(x => [x.items[0].unidad, ...fila(x)]), [],
      ['POR CHOFER'], ['CHOFER','TICKETS','LITROS','MONTO','PRECIO PROM.'],
      ...agruparVj(lista, t => claveVj(t.chofer)).map(x => [x.items[0].chofer, ...fila(x)])]);
    hoja2['!cols'] = [24,9,10,12,12].map(wch => ({ wch }));
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, nombre);
    XLSX.utils.book_append_sheet(libro, hoja2, 'TOTALES');
    XLSX.writeFile(libro, `DIESEL ${nombre}.xlsx`);
  } catch(e) { alert('No se pudo generar el Excel: ' + e.message); }
  finally { btn.disabled = false; }
}

function whatsDiesel() {
  if (!DS) return;
  const { lista } = datosDiesel();
  if (!lista.length) return alert(`No hay tickets en ${esteDs()}`);
  const sinFact = lista.filter(t => !t.facturado).length, avisos = lista.filter(t => t.avisos.length).length;
  const texto = [
    `*Diésel — ${tituloDs()}*`,
    `Total: ${f0(sumaDs(lista, 'litros'))} L · ${$$(sumaDs(lista, 'monto'))} (${lista.length} tickets, ${$$(precioProm(lista))}/L)`,
    '', '*Por camión*',
    ...agruparVj(lista, t => t.placa).sort((a,b) => sumaDs(b.items,'litros') - sumaDs(a.items,'litros'))
      .map(x => `• ${x.items[0].unidad}: ${f0(sumaDs(x.items, 'litros'))} L · ${$$(sumaDs(x.items, 'monto'))}`),
    ...(sinFact ? ['', `🧾 ${sinFact} ticket${sinFact!==1?'s':''} sin facturar`] : []),
    ...(avisos ? [`⚠️ ${avisos} con aviso por revisar`] : []),
  ].join('\n');
  window.open(`https://wa.me/${WA_NUM}?text=` + encodeURIComponent(texto), '_blank');
}

Sesion.requerir('viajes').then(s => {
  document.getElementById('sb-user').textContent = s.nombre;
  document.getElementById('app').style.display = 'flex';
  document.getElementById('vj-dia').value = txtFecha(new Date());
  // El Diario abre en ayer (el resumen de cada mañana); el lunes, en el sábado si el domingo no hubo nada
  // Tarjetas del inicio: viajes.html#fletes, #subir, #diesel, #tickets abren esa pestaña
  const pestana = document.querySelector(`nav a[data-s="${location.hash.slice(1)}"]`);
  if (pestana && pestana.dataset.s !== 'diario') pestana.click(); else Diario.ir(-1);
}).catch(e => alert('No se pudo revisar la sesión: ' + e.message));
</script>
</body>
</html>
