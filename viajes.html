<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes locales — CAO Centauro</title>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mismo aspecto que el panel de la planta (dashboard.html) */
:root{--bg:#0b1116;--s1:#141d24;--s2:#1b2731;--bd:#26333d;--amb:#F7931E;--green:#16a34a;--red:#dc2626;--text:#e8eef2;--muted:#8796a1;--sw:210px;
  --pos:#5fd18e;--neg:#f28b82;--warn:#f2b45c;color-scheme:dark;--f-tit:'Outfit',system-ui,sans-serif}
:root[data-theme="light"]{--bg:#F3F7FA;--s1:#ffffff;--s2:#eef3f6;--bd:#dce3e9;--amb:#E07F0F;--text:#0d141a;--muted:#5d6d78;
  --pos:#1b7a43;--neg:#b42318;--warn:#a65300;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
#app{display:none;height:100vh}
#sidebar{width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bd)}
.sb-logo span{display:block;font-size:10px;color:var(--amb);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sb-logo strong{display:block;font-size:14px;margin-top:3px;font-family:var(--f-tit);font-weight:600}
nav{padding:10px 0;flex:1}
nav a{display:block;padding:9px 16px;color:var(--muted);text-decoration:none;font-size:13px;border-left:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.active{color:var(--amb);border-left-color:var(--amb);background:rgba(247,147,30,.05)}
nav a.pronto{opacity:.55;cursor:default}
nav a small{font-size:10px;margin-left:4px}
.nav-g{padding:14px 16px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.nav-g:first-child{padding-top:4px}
.sb-foot{padding:12px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--muted)}
.btn-r{margin-top:10px;padding:6px 10px;background:transparent;border:1px solid var(--bd);color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;width:100%}
.btn-r:hover{border-color:var(--amb);color:var(--amb)}
.btn-r + .btn-r{margin-top:6px}
.theme-btn{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.theme-btn:hover{background:var(--amb);border-color:var(--amb);color:#000}
.btn-r.casa{display:flex;align-items:center;justify-content:center;padding:5px 10px}
.btn-r.casa svg{width:18px;height:18px}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
#pbar{height:2px;background:var(--amb);width:0;transition:width .3s;position:fixed;top:0;left:0;right:0;z-index:999}
.sec{display:none;flex-direction:column;height:100%;overflow-y:auto}
.sec.on{display:flex}
.ph{padding:15px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0;flex-wrap:wrap}
.ph h2{font-size:17px;font-weight:600;flex:1;font-family:var(--f-tit)}
.sb{padding:24px;display:flex;flex-direction:column;gap:20px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.mc{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--amb);padding:16px}
.mc.r{border-left-color:var(--red)}.mc.g{border-left-color:var(--green)}.mc.m{border-left-color:var(--muted)}
.ml{font-size:11px;color:var(--muted);margin-bottom:6px}
.mv{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--f-tit)}
.ms{font-size:11px;color:var(--muted);margin-top:5px}
.pn{background:var(--s1);border:1px solid var(--bd)}
.pnh{padding:11px 16px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:last-child td{border-bottom:none}
tfoot td{border-top:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 7px;font-size:10px;font-weight:600}
.ta{background:rgba(220,38,38,.15);color:var(--neg)}
.tm{background:rgba(247,147,30,.15);color:var(--warn)}
.tb{background:rgba(22,163,74,.15);color:var(--pos)}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=date]{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:6px 10px;font-family:inherit;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--amb)}
.ftb{background:transparent;border:1px solid var(--bd);color:var(--muted);padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.ftb:hover{border-color:var(--amb);color:var(--amb)}
.ftb:disabled{opacity:.5;cursor:default}
.ftb.active{background:rgba(247,147,30,.12);border-color:var(--amb);color:var(--amb)}
.ftb.p{background:var(--amb);border-color:var(--amb);color:#000}
.ftb.p:hover{background:#d97706;color:#000}
/* SUBIR NOTAS */
.ci{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;font-family:inherit;font-size:12px;outline:none;width:100%}
.ci:focus{border-color:var(--amb)}
.ci.mal{border-color:var(--red)}
.ci:disabled{opacity:.6}
.thumb{width:44px;height:44px;object-fit:cover;cursor:zoom-in;border:1px solid var(--bd);display:block}
.sinfoto{width:44px;height:44px;border:1px dashed var(--bd);color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center}
.drop{border:2px dashed var(--bd);padding:36px 16px;text-align:center;color:var(--muted);cursor:pointer;line-height:1.8}
.drop.over,.drop:hover{border-color:var(--amb);color:var(--amb)}
.av{font-size:11px;color:var(--neg);white-space:normal;min-width:150px;max-width:220px;line-height:1.35}
#nt-tbl td{vertical-align:top}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.bulk .ci{width:auto;min-width:120px}
/* DIARIO */
.dr-tbl td{vertical-align:middle}
.dr-tbl .ci{width:auto}
.dr-tbl select.ci{width:190px}
.dr-tbl input.cm{width:64px}
.dr-n{font-weight:600}
.dr-n small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px;white-space:normal;max-width:220px}
.pnh .ftb{text-transform:none;letter-spacing:0}
.nota-pn{font-size:12px;color:var(--muted);padding:10px 16px;line-height:1.6;white-space:normal}
#dr-resumen{width:100%;min-height:260px;background:var(--s2);border:1px solid var(--bd);color:var(--text);font-family:inherit;font-size:13px;line-height:1.5;padding:12px;resize:vertical}
.conf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner-dr{font-size:12px;padding:10px 14px;border-left:3px solid var(--amb);background:rgba(247,147,30,.08);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
summary.pnh{cursor:pointer;list-style:none}
summary.pnh::-webkit-details-marker{display:none}
/* Barra de arriba igual en Diario, Fletes y Diésel: a la izquierda qué día/periodo; a la derecha Actualizar y el botón principal */
.ph.bar h2{flex:0 0 auto;margin-right:6px}
.acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ftb.s2{border-color:transparent;text-decoration:underline;text-underline-offset:3px}
/* Vistas (Capturar / Ver, Viajes / Resúmenes / Acumulado, Tickets / Rendimiento) */
.vistas{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.vistas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:-1px}
.vistas button:hover{color:var(--text)}
.vistas button.on{color:var(--amb);border-bottom-color:var(--amb)}
.vista-c{display:flex;flex-direction:column;gap:16px}
.vista-c[hidden]{display:none}
/* Línea gris bajo el título de cada panel: para qué sirve */
.pn-sub{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--bd);line-height:1.5}
/* Pasos del Diario */
.avance{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.avance i{display:inline-block;width:26px;height:6px;background:var(--bd)}
.avance i.ok{background:var(--green)}
.avance b{margin-left:6px;color:var(--text);font-weight:600}
.paso{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--amb)}
.paso.ok{border-left-color:var(--green)}
.paso.aj{border-left-color:var(--muted)}
.paso > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.paso > summary::-webkit-details-marker{display:none}
.paso[open] > summary{border-bottom:1px solid var(--bd)}
.paso-n{width:24px;height:24px;border-radius:50%;border:1px solid var(--amb);color:var(--amb);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.paso.ok .paso-n{background:var(--green);border-color:var(--green);color:#fff}
.paso.aj .paso-n{border-color:var(--muted);color:var(--muted)}
.paso-t{font-weight:600;font-size:14px;font-family:var(--f-tit)}
.paso-e{font-size:12px;color:var(--muted);margin-left:auto}
.paso-e.mal{color:var(--warn)}
.paso .fl{font-size:11px;color:var(--muted)}
.paso .pn.sub{border:none;border-top:1px solid var(--bd)}
.bar-paso{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:12px;color:var(--muted)}
.bar-paso .ftb{font-size:12px;padding:6px 14px}
/* FLETES: filtros y acumulado */
.flt[hidden]{display:none}
details.fil > summary{cursor:pointer;list-style:none}
details.fil > summary::-webkit-details-marker{display:none}
details.fil:not([open]) > summary{border-bottom:none}
.vj-fil{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px}
.vj-fil label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.vj-fil select{min-width:120px;max-width:200px}
.vj-fil select.on{border-color:var(--amb);color:var(--amb)}
.vj-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 12px;font-size:12px}
.chip{border:1px solid var(--amb);color:var(--amb);background:rgba(247,147,30,.08);padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.chip:hover{background:rgba(247,147,30,.2)}
.vista{display:flex;gap:0}
.vista .ftb{font-size:11px;padding:5px 12px}
.sinp{color:var(--warn)}
.fl{white-space:nowrap}
.fl::after{content:'Mostrar ▸';text-transform:none;letter-spacing:0;font-weight:500}
details[open] > summary .fl::after{content:'Ocultar ▾'}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-c{background:var(--s1);border:1px solid var(--bd);border-top:3px solid var(--amb);max-width:440px;width:100%;padding:20px}
.dlg-t{font-size:14px;line-height:1.5;white-space:pre-line;margin-bottom:18px}
.dlg-b{display:flex;justify-content:flex-end;gap:8px}
.dlg-b .ftb{font-size:12px;padding:8px 16px}
#modal-foto{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;cursor:zoom-out}
#modal-foto.on{display:flex}
#modal-foto img{max-width:95vw;max-height:92vh}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}.rt{text-align:right}
a{color:var(--amb)}
.empty{padding:36px;text-align:center;color:var(--muted);line-height:2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > *{min-width:0}     /* una tabla ancha se desplaza dentro de su panel, no empuja la página */
@media(max-width:860px){.two{grid-template-columns:1fr}}
#menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
@media(max-width:640px){
  #menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:101;background:var(--s1);border:1px solid var(--bd);padding:4px 10px}
  #sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:100;transition:left .2s;width:220px}
  #sidebar.open{left:0}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
  #overlay.on{display:block}
  #main{padding-top:44px}
}
</style>
</head>
<body>
<div id="pbar"></div>

<!-- Se muestra cuando la sesión es válida; el acceso está en index.html -->
<div id="app">
<button id="menu-btn" onclick="toggleMenu()">Menú</button>
<div id="overlay" onclick="closeMenu()"></div>
<div id="sidebar">
  <div class="sb-logo"><span>CAO Centauro</span><strong>Viajes locales</strong></div>
  <nav>
    <div class="nav-g">Cada día</div>
    <a href="#" class="active" data-s="diario">Diario</a>
    <a href="#" data-s="subir">Subir notas <span id="nt-badge" style="color:var(--amb)"></span></a>
    <a href="#" data-s="tickets">Subir tickets de diésel <span id="tk-badge" style="color:var(--amb)"></span></a>
    <div class="nav-g">Consultar</div>
    <a href="#" data-s="fletes">Fletes</a>
    <a href="#" data-s="diesel">Diésel y rendimiento</a>
  </nav>
  <div class="sb-foot">
    <span id="sb-user" style="display:block;margin:0 0 8px;font-weight:600;color:var(--text)">—</span>
    <button class="btn-r theme-btn" onclick="toggleTheme()">Modo claro</button>
    <button class="btn-r casa" onclick="location.href='index.html?n=viajes'" title="Menú de inicio" aria-label="Menú de inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg></button>
    <button class="btn-r" onclick="Sesion.salir()">Salir</button>
  </div>
</div>

<div id="main">
  <!-- DIARIO: lo de un día (camiones, cm de diésel, km, notas, diésel) y el resumen para el grupo -->
  <section class="sec on" id="sec-diario">
    <div class="ph bar">
      <h2>Diario</h2>
      <div class="flt">
        <button class="ftb" onclick="Diario.mover(-1)" title="Día anterior">‹</button>
        <input type="date" id="dr-dia" onchange="Diario.cargar()">
        <button class="ftb" onclick="Diario.mover(1)" title="Día siguiente">›</button>
        <button class="ftb" onclick="Diario.ir(-1)">Ayer</button>
        <button class="ftb" onclick="Diario.ir(0)">Hoy</button>
      </div>
      <div class="acc">
        <button class="ftb" onclick="Diario.cargar(true)">Actualizar</button>
        <button class="ftb p" onclick="Diario.copiar()">Copiar resumen</button>
      </div>
    </div>
    <div class="sb" id="dr-body"></div>
  </section>

  <!-- FLETES DE LA SEMANA -->
  <section class="sec" id="sec-fletes">
    <div class="ph bar">
      <h2>Fletes</h2>
      <div class="flt">
        <select id="vj-per" onchange="cambiarPeriodoVj()" title="Ver por semana, por mes o un rango de fechas">
          <option value="semana">Semana</option><option value="mes">Mes</option><option value="rango">Desde – hasta</option></select>
        <span id="vj-nav" class="flt">
          <button class="ftb" onclick="moverVj(-1)" title="Anterior">‹</button>
          <input type="date" id="vj-dia" onchange="cargarViajes()" title="Cualquier día de la semana o del mes">
          <button class="ftb" onclick="moverVj(1)" title="Siguiente">›</button>
        </span>
        <span id="vj-rango" class="flt" hidden>
          <input type="date" id="vj-desde" onchange="cargarViajes()" title="Desde"> –
          <input type="date" id="vj-hasta" onchange="cargarViajes()" title="Hasta">
        </span>
      </div>
      <div class="acc">
        <button class="ftb s2" onclick="excelViajes(this)">Descargar Excel</button>
        <button class="ftb s2" onclick="whatsViajes()">Enviar por WhatsApp</button>
        <button class="ftb" onclick="cargarViajes(true)">Actualizar</button>
      </div>
    </div>
    <div class="sb" id="vj-body"></div>
  </section>

  <!-- SUBIR NOTAS y SUBIR TICKETS: las llena Subidor() (como los admin de Notas de Viaje y de Diesel) -->
  <section class="sec" id="sec-subir"></section>
  <section class="sec" id="sec-tickets"></section>

  <!-- DIÉSEL DE LA SEMANA -->
  <section class="sec" id="sec-diesel">
    <div class="ph bar">
      <h2>Diésel y rendimiento</h2>
      <div class="flt">
        <select id="ds-per" onchange="cargarDiesel()" title="Ver por semana o por mes"><option value="semana">Semana</option><option value="mes">Mes</option></select>
        <button class="ftb" onclick="moverDs(-1)" title="Anterior">‹</button>
        <input type="date" id="ds-dia" onchange="cargarDiesel()" title="Cualquier día de la semana o del mes">
        <button class="ftb" onclick="moverDs(1)" title="Siguiente">›</button>
      </div>
      <div class="acc">
        <button class="ftb s2" onclick="excelDiesel(this)">Descargar Excel</button>
        <button class="ftb s2" onclick="whatsDiesel()">Enviar por WhatsApp</button>
        <button class="ftb" onclick="cargarDiesel(true)">Actualizar</button>
      </div>
    </div>
    <div class="sb" id="ds-body"></div>
  </section>
</div><!-- /main -->
</div><!-- /app -->
<div id="modal-foto" onclick="this.classList.remove('on')"><img alt="Foto de la nota"></div>

<script src="sesion.js"></script>
<script>
const api = body => Sesion.api(body, 60000);
const N  = v => v==null ? 0 : parseFloat(v)||0;
const f0 = v => new Intl.NumberFormat('es-MX',{maximumFractionDigits:2}).format(N(v));
// Lo escriben los choferes o la IA: se escapa antes de ponerlo en la página
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Avisos y confirmaciones dentro de la página (algunos navegadores bloquean las ventanas alert/confirm)
function dialogo(msg, siTxt, noTxt) {
  return new Promise(listo => {
    const ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c" role="dialog"><div class="dlg-t"></div><div class="dlg-b">
      ${noTxt ? `<button class="ftb" data-r="0">${noTxt}</button>` : ''}<button class="ftb p" data-r="1">${siTxt}</button></div></div>`;
    ov.querySelector('.dlg-t').textContent = msg;
    const cerrar = r => { ov.remove(); removeEventListener('keydown', tecla, true); listo(r); };
    const tecla = e => { if (e.key === 'Escape') { e.preventDefault(); cerrar(false); } };
    ov.addEventListener('click', e => { const r = e.target.dataset?.r; if (r != null) cerrar(r === '1'); });
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}
const preguntar = (msg, siTxt = 'Sí, continuar') => dialogo(msg, siTxt, 'Cancelar');
window.alert = msg => { dialogo(String(msg), 'Entendido'); };
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
// Número de WhatsApp para enviar los fletes: lada + número, solo dígitos. Vacío → WhatsApp pide elegir el contacto.
const WA_NUM = '525566852302';

function cargarScript(src) {
  return new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => err(new Error('no se pudo cargar ' + src.split('/').pop()));
    document.head.appendChild(s);
  });
}
function bar(on) {
  const el = document.getElementById('pbar');
  el.style.width = on ? '65%' : '100%';
  if (!on) setTimeout(() => el.style.width = '0', 400);
}
function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
}
function closeMenu() {

// Vistas dentro de una sección (Capturar / Ver, Viajes / Resúmenes / Acumulado, Tickets / Rendimiento):

const vistaGuardada = (k, def, validas) => { try { const v = localStorage.getItem(k); return validas.includes(v) ? v : def; } catch(e) { return def; } };
const guardarVista = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
// Línea gris bajo el título de un panel: para qué sirve

// ══════════════════════════════════════════
//  FLETES DE LA SEMANA (Viajes.gs lee el Sheets de Notas de Viaje)
// ══════════════════════════════════════════
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const DIAS_VJ = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const VJ_CACHE = {};        // `${desde}|${hasta}` → respuesta de viajes_semana
let VJ = null;              // semana en pantalla

const fechaLocal = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const txtFecha = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const diaVj = s => DIAS_VJ[fechaLocal(s).getDay()];
const claveVj = s => String(s||'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const ddmmyy = s => s.slice(8,10) + s.slice(5,7) + s.slice(2,4);                 // 2026-11-03 → 031126
const nViajes = n => `${n} viaje${n!==1?'s':''}`;
// Fecha para Excel como número de serie (con Date el Excel la corre un día por la zona horaria)
const celdaFecha = s => { const [y, m, d] = s.split('-').map(Number); return { t:'n', v:(Date.UTC(y, m-1, d) - Date.UTC(1899, 11, 30)) / 864e5, z:'dd/mm/yyyy' }; };
// Lunes a domingo de la semana del día dado
function semanaVj(dia) {
  const d = fechaLocal(dia), lun = new Date(d); lun.setDate(d.getDate() - (d.getDay() + 6) % 7);
  const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
  return { desde:txtFecha(lun), hasta:txtFecha(dom) };
}

// Periodo en pantalla: semana (lunes a domingo), mes, o desde – hasta (máximo un año)
const elVj = id => document.getElementById(id);
function periodoVj() {
  const per = elVj('vj-per').value, dia = elVj('vj-dia').value || txtFecha(new Date());
  if (per === 'mes') {
    const d = fechaLocal(dia);
    return { per, desde:txtFecha(new Date(d.getFullYear(), d.getMonth(), 1)), hasta:txtFecha(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  if (per === 'rango') {
    let a = elVj('vj-desde').value, b = elVj('vj-hasta').value;
    if (!a || !b) { const s = semanaVj(dia); a = a || s.desde; b = b || s.hasta; }
    if (a > b) [a, b] = [b, a];
    return { per, desde:a, hasta:b };
  }
  return { per, ...semanaVj(dia) };
}
function tituloVj(p) {
  const anio = p.hasta.slice(0, 4);
  if (p.per === 'mes') return `${MESES[+p.desde.slice(5, 7) - 1]} ${anio}`;
  return `${p.per === 'semana' ? 'Semana del' : 'Del'} ${fechaCorta(p.desde)}${p.desde.slice(0, 4) !== anio ? ' ' + p.desde.slice(0, 4) : ''} al ${fechaCorta(p.hasta)} ${anio}`;
}
function cambiarPeriodoVj() {
  const rango = elVj('vj-per').value === 'rango';
  elVj('vj-rango').hidden = !rango; elVj('vj-nav').hidden = rango;
  if (rango && (!elVj('vj-desde').value || !elVj('vj-hasta').value)) {
    elVj('vj-desde').value = VJ?.desde || semanaVj(txtFecha(new Date())).desde;
    elVj('vj-hasta').value = VJ?.hasta || semanaVj(txtFecha(new Date())).hasta;
  }
  cargarViajes();
}
function moverVj(n) {
  const inp = elVj('vj-dia'), d = fechaLocal(inp.value || txtFecha(new Date()));
  if (elVj('vj-per').value === 'mes') d.setMonth(d.getMonth() + n, 1); else d.setDate(d.getDate() + 7 * n);
  inp.value = txtFecha(d);
  cargarViajes();
}
function irSemanaVj(dia) {
  elVj('vj-per').value = 'semana'; elVj('vj-rango').hidden = true; elVj('vj-nav').hidden = false;
  elVj('vj-dia').value = dia; cargarViajes();
}

async function cargarViajes(forzar) {
  const { desde, hasta } = periodoVj();
  const k = desde + '|' + hasta, body = elVj('vj-body');
  if (!forzar && VJ_CACHE[k]) { VJ = VJ_CACHE[k]; return renderViajes(); }
  body.innerHTML = '<div class="pn"><div class="empty">Leyendo las notas de viaje…</div></div>';
  bar(true);
  try {
    VJ = VJ_CACHE[k] = await api({ action:'viajes_semana', desde, hasta });
    if (periodoVj().desde + '|' + periodoVj().hasta === k) renderViajes();     // mientras tanto se pidió otro periodo
  } catch(e) {
    body.innerHTML = `<div class="pn"><div class="empty">No se pudieron leer las notas: ${esc(e.message)}</div></div>`;
  } finally { bar(false); }
}

// ── Filtros: cada lista muestra solo lo que hay con los demás filtros puestos ──
const FILTROS_VJ = [
  ['cliente',  'Cliente',  v => v.cliente],
  ['obra',     'Obra',     v => v.obra],
  ['chofer',   'Chofer',   v => v.chofer],
  ['placa',    'Placa',    v => v.placa],
  ['material', 'Material', v => v.material],
  ['dia',      'Día',      v => diaNombre(v.fecha)],
  ['m3',       'm³',       v => v.m3 ? String(v.m3) : ''],
];
const FV = {};                       // filtro → clave elegida ('' = todos)
let VISTA_VJ = vistaGuardada('vj-vista', 'viajes', ['viajes', 'resumenes', 'acumulado']), AGR_VJ = 'semana', FIL_VJ_ABIERTO = false;
const claveFil = t => claveVj(t) || '(VACIO)';
const pasaVj = (v, salvo) => FILTROS_VJ.every(([k, , get]) => k === salvo || !FV[k] || claveFil(get(v)) === FV[k]);
function filtrarVj(k, valor) { FV[k] = valor; renderViajes(); }
function quitarFiltrosVj() { FILTROS_VJ.forEach(([k]) => FV[k] = ''); renderViajes(); }
function vistaVj(v) { VISTA_VJ = v; guardarVista('vj-vista', v); mostrarVista(elVj('vj-body'), v); }
function agruparPorVj(a) { AGR_VJ = a; renderViajes(); }
// Texto de un filtro puesto ("Soto"), tomado de los viajes
function textoFiltroVj(k, todos) {
  const get = FILTROS_VJ.find(f => f[0] === k)[2], v = todos.find(x => claveFil(get(x)) === FV[k]);
  return v ? (String(get(v)).trim() || '(vacío)') : FV[k];
}
const filtrosTxtVj = todos => FILTROS_VJ.filter(([k]) => FV[k]).map(([k, n]) => `${n}: ${textoFiltroVj(k, todos)}`).join(' · ');
function opcionesVj(todos, k) {
  const get = FILTROS_VJ.find(f => f[0] === k)[2], m = new Map();
  todos.filter(v => pasaVj(v, k)).forEach(v => {
    const t = String(get(v) ?? '').trim(), c = claveFil(t);
    if (!m.has(c)) m.set(c, { c, t:t || '(vacío)', n:0 });
    m.get(c).n++;
  });
  const ops = [...m.values()];
  if (FV[k] && !m.has(FV[k])) ops.push({ c:FV[k], t:textoFiltroVj(k, todos), n:0 });
  const orden = k === 'dia' ? o => (DIAS_VJ.map(claveVj).indexOf(o.c) + 6) % 7 : k === 'm3' ? o => Number(o.c) || 0 : null;
  return ops.sort((a, b) => orden ? orden(a) - orden(b) : a.t.localeCompare(b.t, 'es'));
}

// ── Precio por m³ de cada viaje (Sheets "Precios viajes"): cliente + material, la obra si se puso, y el vigente a esa fecha ──
function precioVj(v, precios) {
  const c = claveVj(v.cliente), m = claveVj(v.material), o = claveVj(v.obra);
  let mejor = null;
  (precios || []).forEach(p => {
    if (claveVj(p.cliente) !== c || claveVj(p.material) !== m) return;
    if (p.obra && claveVj(p.obra) !== o) return;
    if (p.desde && p.desde > v.fecha) return;
    const r = [p.obra ? 1 : 0, p.desde || ''];
    if (!mejor || r[0] > mejor.r[0] || (r[0] === mejor.r[0] && r[1] >= mejor.r[1])) mejor = { p, r };
  });
  return mejor ? mejor.p.precio : null;
}

// Viajes del periodo ya ordenados, con avisos, precio e importe, y los filtrados
function datosViajes() {
  const cat = {}; (VJ.placas||[]).forEach(p => cat[p.placa] = p);
  const todos = (VJ.viajes||[]).slice().sort((a,b) => a.fecha.localeCompare(b.fecha) || claveVj(a.cliente).localeCompare(claveVj(b.cliente))
    || a.obra.localeCompare(b.obra) || a.placa.localeCompare(b.placa) || (Number(a.folio)||0) - (Number(b.folio)||0) || a.fila - b.fila);
  const rep = {};
  todos.forEach(v => { if (v.folio) { const k = claveVj(v.obra) + '|' + v.folio; rep[k] = (rep[k]||0) + 1; } });
  const hayPrecios = Array.isArray(VJ.precios);
  todos.forEach(v => {
    v.avisos = [];
    if (v.duplicado || (v.folio && rep[claveVj(v.obra) + '|' + v.folio] > 1)) v.avisos.push('Folio repetido');
    if (!cat[v.placa]) v.avisos.push('Placa no está en el catálogo');
    if (!v.cliente) v.avisos.push('Sin cliente (la obra no está en el catálogo)');
    if (!v.m3) v.avisos.push('Sin m³');
    v.precio = hayPrecios ? precioVj(v, VJ.precios) : null;
    v.importe = v.precio == null ? null : v.precio * v.m3;
  });
  return { cat, todos, lista:todos.filter(v => pasaVj(v)), hayPrecios };
}

// Suma viajes, m³ e importe agrupando por la clave que se le dé
function agruparVj(lista, clave) {
  const g = new Map();
  lista.forEach(v => {
    const k = clave(v);
    if (!g.has(k)) g.set(k, { k, viajes:0, m3:0, importe:0, sinPrecio:0, items:[] });
    const x = g.get(k); x.viajes++; x.m3 += v.m3; x.items.push(v);
    if (v.importe == null) x.sinPrecio++; else x.importe += v.importe;
  });
  return [...g.values()];
}
// "Tepetate 5 · Lodo 3"
const materialesVj = items => agruparVj(items, v => claveVj(v.material) || 'SIN MATERIAL')
  .sort((a,b) => b.viajes - a.viajes).map(x => `${x.items[0].material || 'Sin material'} ${x.viajes}`).join(' · ');
const fechaCorta = s => `${+s.slice(8,10)} ${MESES[+s.slice(5,7)-1].toLowerCase().slice(0,3)}`;
// Importe de un grupo: "$12,345" o "$12,345 + 3 sin precio"
const importeVj = x => x.sinPrecio === x.viajes ? '<span class="sinp">sin precio</span>'
  : $$(x.importe) + (x.sinPrecio ? ` <span class="sinp" title="Viajes sin precio en el Sheets de precios">+ ${x.sinPrecio} sin precio</span>` : '');

// Acumulado: un renglón por semana, mes o día ("3 al 7 nov" = del primer al último día con viajes)
function periodosVj(lista, agr) {
  const clave = agr === 'mes' ? v => v.fecha.slice(0, 7) : agr === 'dia' ? v => v.fecha : v => semanaVj(v.fecha).desde;
  return agruparVj(lista, clave).sort((a, b) => a.k.localeCompare(b.k)).map(x => {
    const fs = x.items.map(v => v.fecha).sort(), a = fs[0], b = fs[fs.length - 1];
    x.nombre = agr === 'mes' ? `${MESES[+x.k.slice(5, 7) - 1]} ${x.k.slice(0, 4)}`
      : agr === 'dia' ? `${diaNombre(x.k).slice(0, 3)} ${fechaCorta(x.k)}`
      : a === b ? `${diaNombre(a).slice(0, 3)} ${fechaCorta(a)}`
      : a.slice(5, 7) === b.slice(5, 7) ? `${+a.slice(8, 10)} al ${fechaCorta(b)}` : `${fechaCorta(a)} al ${fechaCorta(b)}`;
    return x;
  });
}

function renderViajes() {
  if (!VJ) return;
  const body = elVj('vj-body'), p = { per:elVj('vj-per').value, desde:VJ.desde, hasta:VJ.hasta }, titulo = tituloVj(p);
  if (!(VJ.viajes || []).length) {
    const ult = VJ.ultima && VJ.ultima < VJ.desde
      ? `<br>La última nota registrada es del <b>${VJ.ultima}</b>. <button class="ftb" onclick="irSemanaVj('${VJ.ultima}')">Ir a esa semana</button>` : '';
    body.innerHTML = `<div class="pn"><div class="pnh">${titulo}</div><div class="empty">Sin notas de viaje en este periodo${ult}</div></div>`;
    return;
  }
  const { cat, todos, lista, hayPrecios } = datosViajes();
  const tabla = (enc, filas, pie) => `<div class="tw"><table><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody>${pie ? `<tfoot><tr>${pie}</tr></tfoot>` : ''}</table></div>`;
  const puestos = FILTROS_VJ.filter(([k]) => FV[k]);

  // Filtros plegados en una línea; lo que está puesto se ve como etiquetas aunque estén cerrados
  const filtros = `<details class="pn fil" ${FIL_VJ_ABIERTO ? 'open' : ''} ontoggle="FIL_VJ_ABIERTO = this.open">
      <summary class="pnh"><span>Filtros${puestos.length ? ` (${puestos.length})` : ''} · cliente, obra, chofer, placa, material, día, m³</span><span class="fl"></span></summary>
      <div class="vj-fil">${FILTROS_VJ.map(([k, n]) => `<label>${n}<select class="${FV[k] ? 'on' : ''}" onchange="filtrarVj('${k}', this.value)">
        <option value="">Todos</option>${opcionesVj(todos, k).map(o => `<option value="${esc(o.c)}" ${FV[k] === o.c ? 'selected' : ''}>${esc(o.t)} (${o.n})</option>`).join('')}</select></label>`).join('')}</div>
    </details>
    ${puestos.length ? `<div class="vj-chips" style="padding:0">${puestos.map(([k, n]) => `<button class="chip" onclick="filtrarVj('${k}', '')" title="Quitar este filtro">${n}: ${esc(textoFiltroVj(k, todos))} ✕</button>`).join('')}
      <button class="ftb" onclick="quitarFiltrosVj()">Quitar filtros</button>
      <span style="color:var(--muted)">${lista.length} de ${todos.length} viajes</span></div>` : ''}`;

  // Precios: si no se pudo leer el Sheets, o hay viajes sin precio
  const sinPrecio = hayPrecios ? agruparVj(lista.filter(v => v.precio == null), v => claveVj(v.cliente) + '|' + claveVj(v.material) + '|' + claveVj(v.obra)) : [];
  const avisoPrecios = VJ.errPrecios ? `<div class="banner-dr">No se pudo leer el Sheets de precios: ${esc(VJ.errPrecios)}</div>`
    : sinPrecio.length ? `<details class="pn"><summary class="pnh"><span class="sinp">${nViajes(sinPrecio.reduce((s, x) => s + x.viajes, 0))} sin precio
        (${sinPrecio.length} combinación${sinPrecio.length !== 1 ? 'es' : ''} de cliente y material que no está en el Sheets de precios)</span><span class="fl"></span></summary>
      ${tabla('<th>Cliente</th><th>Obra</th><th>Material</th><th class="rt">Viajes</th><th class="rt">m³</th>',
        sinPrecio.sort((a, b) => b.viajes - a.viajes).map(x => `<tr><td>${esc(x.items[0].cliente) || '<span class="neg">Sin cliente</span>'}</td><td>${esc(x.items[0].obra)}</td>
          <td>${esc(x.items[0].material)}</td><td class="rt">${x.viajes}</td><td class="rt">${f0(x.m3)}</td></tr>`).join(''))}
      <div class="nota-pn">En el Sheets de precios: CLIENTE y MATERIAL escritos igual que en las notas (no importan mayúsculas ni acentos). OBRA vacía = todas las obras del cliente.</div></details>` : '';

  const vistas = vistasHtml('vistaVj', [['viajes', 'Viajes'], ['resumenes', 'Resúmenes'], ['acumulado', 'Acumulado']], VISTA_VJ);
  if (!lista.length) {
    body.innerHTML = vistas + filtros + `<div class="pn"><div class="pnh">${titulo}</div><div class="empty">Ningún viaje con estos filtros
      <br><button class="ftb" onclick="quitarFiltrosVj()">Quitar filtros</button></div></div>`;
    return;
  }
  const tot = agruparVj(lista, () => 'x')[0];
  const sinRevisar = lista.filter(v => !v.revisado).length;
  const sinFisica = lista.filter(v => !v.entregado).length;
  const conAviso = lista.filter(v => v.avisos.length);
  const camiones = new Set(lista.map(v => v.placa)).size;
  const porDia = agruparVj(lista, v => v.fecha);
  const porCli = agruparVj(lista, v => claveVj(v.cliente) + '|' + claveVj(v.obra)).sort((a,b) => b.m3 - a.m3);
  const porCam = agruparVj(lista, v => v.placa).sort((a,b) => b.viajes - a.viajes);
  const conImp = hayPrecios;      // columnas de importe solo si se leyó el Sheets de precios
  const thImp = conImp ? '<th class="rt">Importe</th>' : '', tdImp = x => conImp ? `<td class="rt">${importeVj(x)}</td>` : '';
  const pie = n => `<td colspan="${n}"><b>Total</b></td><td class="rt"><b>${tot.viajes}</b></td><td class="rt"><b>${f0(tot.m3)}</b></td>${conImp ? `<td class="rt"><b>${importeVj(tot)}</b></td>` : ''}`;

  const tarjetas = `<div class="mg">
      <div class="mc m"><div class="ml">Viajes</div><div class="mv">${lista.length}</div><div class="ms">${titulo}</div></div>
      <div class="mc"><div class="ml">m³ acarreados</div><div class="mv">${f0(tot.m3)}</div><div class="ms">${porDia.length} día${porDia.length!==1?'s':''} con viajes</div></div>
      ${conImp ? `<div class="mc"><div class="ml">Importe</div><div class="mv">${tot.sinPrecio === tot.viajes ? '—' : $$(tot.importe)}</div>
        <div class="ms">${tot.sinPrecio ? `<span class="sinp">${tot.sinPrecio} viaje${tot.sinPrecio !== 1 ? 's' : ''} sin precio</span>` : 'Todos con precio'}</div></div>` : ''}
      <div class="mc"><div class="ml">Camiones</div><div class="mv">${camiones}</div><div class="ms">${porCli.length} obra${porCli.length!==1?'s':''}</div></div>
      <div class="mc ${conAviso.length || sinRevisar ? 'r' : 'g'}"><div class="ml">Por revisar</div><div class="mv">${conAviso.length}</div>
        <div class="ms">${sinRevisar} sin revisar · ${sinFisica} sin nota física</div></div>
    </div>`;

  const panelCli = `<div class="pn"><div class="pnh">Por cliente y obra</div>
      ${subTxt('Viajes y m³ de cada obra, con los materiales que se llevaron.')}
      ${tabla(`<th>A nombre de</th><th>Obra</th><th>Material</th><th class="rt">Viajes</th><th class="rt">m³</th>${thImp}`,
        porCli.map(x => `<tr><td>${esc(x.items[0].cliente) || '<span class="neg">Sin cliente</span>'}</td><td>${esc(x.items[0].obra) || '—'}</td>
          <td style="color:var(--muted)">${esc(materialesVj(x.items))}</td><td class="rt">${x.viajes}</td><td class="rt amb">${f0(x.m3)}</td>${tdImp(x)}</tr>`).join(''),
        pie(3))}
    </div>`;

  // ── Vista Viajes: lo que hay que atender (notas con aviso) y la lista ──
  const vViajes = `
    ${conAviso.length ? `<div class="pn"><div class="pnh">Notas con aviso (${conAviso.length})</div>
      ${subTxt('Notas que hay que revisar: folio repetido, placa que no está en el catálogo, obra sin cliente o sin m³.')}

// ══════════════════════════════════════════
//  SUBIR FOTOS POR LOTE (notas de viaje y tickets de diésel)
//  Como los admin de Notas de Viaje y de Diesel: la IA lee cada foto, se revisa y se registra.
//  Con foto lo guarda el programa de cada uno (Viajes.gs / Diesel.gs se lo pasan); sin foto, el servidor.
// ══════════════════════════════════════════
const IMG_ANCHO_MAX = 1280, IMG_CALIDAD = 0.78;      // igual que esos admin
const LECTORES = 2;                                  // fotos que se leen a la vez
const ESTADO_SUB = {
  leyendo:   '<span class="tag tm">Leyendo…</span>',
  guardando: '<span class="tag tm">Guardando…</span>',
  ok:        '<span class="tag tb">Registrada</span>',
  dup:       '<span class="tag tm">Ya estaba</span>',
  error:     '<span class="tag ta">Error</span>',
};
const SUB = {};

// Reduce la foto (1280 px de ancho, JPEG) antes de mandarla
function reducirFoto(file) {
  return new Promise((ok, err) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > IMG_ANCHO_MAX) { h = Math.round(h * IMG_ANCHO_MAX / w); w = IMG_ANCHO_MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', IMG_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); err(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function verFoto(src) { const m = document.getElementById('modal-foto'); m.querySelector('img').src = src; m.classList.add('on'); }
const diasDesde = fecha => Math.round((Date.now() - fechaLocal(fecha)) / 864e5);

function Subidor(cfg) {
  const k = cfg.k, sec = document.getElementById(cfg.sec);
  let items = [], sig = 0, leyendo = 0, cat = null;
  const cola = [];
  const el = s => document.getElementById(k + '-' + s);
  const porGuardar = () => items.filter(n => n.estado === 'pendiente' || n.estado === 'error');
  const campos = () => cfg.campos(cat);
  // Opciones de un desplegable: lista de textos o de {v, t}, o grupos [{t, ops}] (p. ej. "Usados en esta obra")
  const normOp = o => typeof o === 'object' ? o : { v:o, t:o };
  const gruposDe = (c, d) => {
    const g = typeof c.ops === 'function' ? c.ops(d, cat) : c.ops;
    return g.length && g[0].ops ? g.map(x => ({ t:x.t, ops:x.ops.map(normOp) })) : [{ t:null, ops:g.map(normOp) }];
  };
  const opcionesHtml = (c, d, actual) => {
    const gr = gruposDe(c, d);
    if (actual && !gr.some(g => g.ops.some(o => claveVj(o.v) === claveVj(actual)))) gr.unshift({ t:null, ops:[{ v:actual, t:actual }] });
    const op = o => `<option value="${esc(o.v)}" ${actual && claveVj(o.v) === claveVj(actual) ? 'selected' : ''}>${esc(o.t)}</option>`;
    return `<option value="">${c.vacio}</option>` + gr.map(g => g.t ? `<optgroup label="${esc(g.t)}">${g.ops.map(op).join('')}</optgroup>` : g.ops.map(op).join('')).join('');
  };
  // Lo que se cambia solo cuando cambia otro dato (p. ej. el chofer pone la placa)
  const ajustar = (n, cambios) => cfg.ajustar?.(n.d, cambios, cat);

  sec.innerHTML = `<div class="ph"><h2>${cfg.titulo}</h2><div class="flt">
      <label class="ftb" style="display:inline-block">Elegir fotos<input type="file" id="${k}-fotos" accept="image/*" multiple hidden></label>
      <button class="ftb" onclick="SUB.${k}.sinFoto()">Agregar sin foto</button>
      <button class="ftb" id="${k}-limpiar" onclick="SUB.${k}.limpiar()" style="display:none">Quitar las registradas</button>
      <button class="ftb p" id="${k}-guardar" onclick="SUB.${k}.guardar()">Registrar ${cfg.que}</button>
    </div></div>
    <div class="sb">
      <div id="${k}-arriba" style="display:contents"></div>
      <div class="pn" id="${k}-bulk" style="display:none"><div class="pnh">Aplicar a todas las que falta registrar</div>
        <div class="bulk"><span id="${k}-bulkc" style="display:contents"></span><button class="ftb" onclick="SUB.${k}.aplicar()">Aplicar</button>
          <span id="${k}-cont" style="margin-left:auto;font-size:12px;color:var(--muted)"></span></div></div>
      <div class="pn"><div id="${k}-lista"></div></div>
    </div>`;
  el('fotos').addEventListener('change', e => { agregarFotos(e.target.files); e.target.value = ''; });

  async function abrir() {
    if (!cat) {
      el('lista').innerHTML = '<div class="empty">Cargando catálogos…</div>';
      try { cat = await api({ action:cfg.acciones.cat }); }
      catch(e) { el('lista').innerHTML = `<div class="empty">No se pudieron cargar los catálogos: ${esc(e.message)}</div>`; return; }
      el('bulkc').innerHTML = campos().filter(c => cfg.bulk.includes(c.f) && c.tipo !== 'chk').map(c => c.tipo === 'sel'
        ? `<select class="ci" data-b="${c.f}">${opcionesHtml(c, cfg.vacia(), '')}</select>`
        : `<input class="ci" type="${c.tipo}" data-b="${c.f}" placeholder="${c.t}" title="${c.t}" ${c.attr || ''} style="${c.tipo === 'number' ? 'min-width:70px;width:90px' : ''}">`).join('');
      cfg.alCargar?.(cat, el('arriba'));
    }
    render();
  }
  // Volver a calcular lo automático de las que falta registrar (p. ej. después de guardar los camiones del día)
  function reajustar(cambio) {
    if (!cat) return;
    porGuardar().forEach(n => ajustar(n, [cambio]));
    render();
  }

  // Los avisos también ven las demás de la lista (p. ej. el mismo folio dos veces)
  const avisos = n => cfg.avisos(n.d, cat, porGuardar().filter(x => x !== n).map(x => x.d));
  function fila(n, i) {
    const d = n.d, dis = ['pendiente','error'].includes(n.estado) ? '' : 'disabled';
    const celda = c => {
      if (c.tipo === 'calc') return `<td data-calc="${c.f}" style="color:var(--muted)">${esc(c.calc(d, cat)) || '—'}</td>`;
      if (c.tipo === 'chk') return c.soloSinFoto && n.foto ? '<td style="color:var(--muted);text-align:center">—</td>'
        : `<td style="text-align:center"><input type="checkbox" data-f="${c.f}" ${d[c.f] ? 'checked' : ''} ${dis} title="${esc(c.titulo || c.t)}"></td>`;
      if (c.tipo === 'sel')
        return `<td style="min-width:${c.w}px"><select class="ci" data-f="${c.f}" ${dis}>${opcionesHtml(c, d, d[c.f])}</select></td>`;
      return `<td style="min-width:${c.w}px"><input class="ci" type="${c.tipo}" data-f="${c.f}" value="${esc(d[c.f])}" placeholder="${c.ph || ''}" ${c.attr || ''} ${dis}></td>`;

    const conf = d.confianza == null ? '' : `<span class="tag ${d.confianza >= 80 ? 'tb' : d.confianza >= 60 ? 'tm' : 'ta'}">${d.confianza}%</span>`;
    return `<tr data-id="${n.id}"${n.estado === 'ok' || n.estado === 'dup' ? ' style="opacity:.6"' : ''}>

      ${campos().map(celda).join('')}

  }
  function cabecera() {
    const faltan = porGuardar().length, hechas = items.filter(n => n.estado === 'ok' || n.estado === 'dup').length;

    el('limpiar').style.display = hechas ? '' : 'none';
    el('bulk').style.display = items.length ? '' : 'none';

    el('cont').textContent = items.length ? `${items.length} ${items.length !== 1 ? cfg.que : cfg.una} · ${faltan} por registrar${leyendo ? ` · leyendo ${leyendo + cola.length}` : ''}` : '';
  }
  function render() {
    if (!cat) return;
    const drop = `<div class="drop" id="${k}-drop" onclick="document.getElementById('${k}-fotos').click()">
        <b>${items.length ? 'Agregar más fotos' : `Elige o arrastra aquí las fotos de ${cfg.de}`}</b><br>

    el('lista').innerHTML = items.length ? `<div class="tw"><table id="${k}-tbl" data-sub="${k}"><thead><tr><th>Foto</th><th></th>
        ${campos().map(c => `<th>${c.t}</th>`).join('')}<th>Avisos</th><th></th></tr></thead>
        <tbody>${items.map(fila).join('')}</tbody></table></div><div style="padding:12px 16px">${drop}</div>` : `<div style="padding:16px">${drop}</div>`;
    const dz = el('drop');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); agregarFotos(e.dataTransfer.files); });
    cabecera();
  }
  // Cambia solo la fila de esa foto (para no perder lo que se está escribiendo en otra)
  function renderFila(n) {
    const tr = document.querySelector(`#${k}-tbl tr[data-id="${n.id}"]`);
    if (!tr) return render();
    tr.outerHTML = fila(n, items.indexOf(n));
    cabecera();
  }
  // Lo que se escribe en la tabla va directo a su fila
  function escribir(tr, f, valor) {
    const n = items.find(x => x.id == tr.dataset.id);
    if (!n) return;
    const antes = { ...n.d };
    n.d[f] = valor;
    ajustar(n, [f]);
    // Un desplegable que cambia las opciones o los datos de otros (chofer, obra): se vuelve a dibujar la fila
    if (cfg.rehacer?.includes(f)) return renderFila(n);
    // Si no, solo se ponen los datos que cambiaron solos, sin tocar lo que se está escribiendo
    for (const c of campos().filter(c => c.f !== f && c.tipo !== 'calc' && n.d[c.f] !== antes[c.f])) {
      const x = tr.querySelector(`[data-f="${c.f}"]`);
      if (x && x.type === 'checkbox') { x.checked = !!n.d[c.f]; continue; }
      if (x) x.value = n.d[c.f] ?? '';
      if (x && x.value !== String(n.d[c.f] ?? '')) return renderFila(n);     // ese valor no estaba en el desplegable
    }
    campos().filter(c => c.tipo === 'calc').forEach(c => tr.querySelector(`[data-calc="${c.f}"]`).textContent = c.calc(n.d, cat) || '—');
    tr.querySelector('[data-av]').innerHTML = avisos(n).map(esc).join('<br>');
    // El folio u otro dato puede cambiar los avisos de las demás (repetidos en la lista)
    if (cfg.avisosLista?.includes(f)) document.querySelectorAll(`#${k}-tbl tr[data-id]`).forEach(o => {
      const m = o !== tr && items.find(x => x.id == o.dataset.id);
      if (m && m.estado !== 'leyendo') o.querySelector('[data-av]').innerHTML = avisos(m).map(esc).join('<br>');
    });
  }

  // Renglones sin foto (capturados del papel); con datos = varios iguales, que luego se pueden cambiar uno por uno
  function sinFoto(cant, datos) {
    if (!cat) return;
    for (let i = 0; i < (cant || 1); i++) {
      const n = { id:++sig, foto:null, estado:'pendiente', msg:'', d:{ ...cfg.vacia(), ...(cfg.sinFoto || {}), ...(datos || {}) } };
      if (datos) ajustar(n, Object.keys(datos));
      items.push(n);
    }
    render();
  }
  function quitar(id) { items = items.filter(n => n.id !== id); render(); }
  function limpiar() { items = items.filter(n => n.estado !== 'ok' && n.estado !== 'dup'); render(); }

  async function agregarFotos(files) {
    if (!cat) return;
    for (const f of [...files].filter(f => f.type.startsWith('image/'))) {
      const n = { id:++sig, foto:null, estado:'leyendo', msg:'', d:cfg.vacia() };
      items.push(n);
      try { n.foto = await reducirFoto(f); cola.push(n); }
      catch(e) { n.estado = 'pendiente'; n.msg = `${f.name}: ${e.message}. Captúrala a mano o vuelve a elegirla.`; }
    }
    render();
    while (leyendo < LECTORES && cola.length) leerSiguiente();
  }
  async function leerSiguiente() {
    const n = cola.shift();
    if (!n) return;
    leyendo++;
    try {
      const { datos } = await Sesion.api({ action:cfg.acciones.extraer, foto:n.foto }, 90000);
      if (datos) { Object.assign(n.d, cfg.deIA(datos)); ajustar(n, ['ia']); }
      else n.msg = 'La IA no pudo leerla: captura los datos a mano';
    } catch(e) { n.msg = 'No se pudo leer: ' + e.message + '. Captura los datos a mano.'; }
    n.estado = 'pendiente';
    leyendo--;
    renderFila(n);
    if (cola.length) leerSiguiente(); else if (!leyendo) render();
  }

  function aplicar() {
    const vals = {};
    el('bulkc').querySelectorAll('[data-b]').forEach(x => { if (x.value) vals[x.dataset.b] = x.value; });
    if (!Object.keys(vals).length) return alert('Escoge al menos un dato para aplicar');
    porGuardar().forEach(n => { Object.assign(n.d, vals); ajustar(n, Object.keys(vals)); });
    render();
  }

  async function guardar() {
    const lista = porGuardar();
    // [campo, texto, (opcional) solo en las que cumplan esto]
    const faltan = cfg.requeridos.map(([f, txt, si]) => [lista.filter(n => !n.d[f] && (!si || si(n))).length, txt]).filter(([c]) => c).map(([c, txt]) => `${c} ${txt}`);
    if (faltan.length) return alert(faltan.join(', ') + '. Complétalas antes de registrar.');
    const conAviso = lista.filter(n => avisos(n).length).length;
    if (!(await preguntar(`Se van a registrar ${lista.length} ${lista.length !== 1 ? cfg.que : cfg.una} en ${cfg.donde}` +
      (conAviso ? ` (${conAviso} con avisos)` : '') + '.\n\n¿Continuar?', 'Sí, registrar'))) return;
    el('guardar').disabled = true; bar(true);
    let ok = 0, dup = 0, mal = 0;
    for (const n of lista) {
      n.estado = 'guardando'; n.msg = ''; renderFila(n);
      try {
        const j = await Sesion.api({ action:cfg.acciones.guardar, [cfg.acciones.campo]:{ ...n.d, foto:n.foto || '' } }, 90000);
        n.estado = 'ok'; n.msg = j.url ? 'Foto guardada en Drive' : ''; ok++;
      } catch(e) {
        if (e.code === 'DUPLICADA') { n.estado = 'dup'; n.msg = e.message; dup++; }
        else { n.estado = 'error'; n.msg = e.message; mal++; }
      }
      renderFila(n);
    }
    bar(false);
    cfg.alGuardar?.();
    render();
    alert(`Registradas: ${ok}` + (dup ? `\nYa estaban registradas (no se repitieron): ${dup}` : '') + (mal ? `\nCon error: ${mal} (quedan marcadas en rojo para reintentar)` : ''));
  }

  return { abrir, sinFoto, quitar, limpiar, aplicar, guardar, escribir, reajustar, catalogo: () => cat,
           pendientes: () => porGuardar().length + leyendo };
}

// ── Notas de viaje (Viajes.gs) ──
const clienteDeObra = (obra, cat) => (cat?.obras || []).find(o => claveVj(o.obra) === claveVj(obra))?.cliente || '';
const placaK = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

// Camión de un chofer en un día: lo último guardado en "Camiones del día" con fecha igual o anterior;
// si nunca se le ha guardado, su última placa en las notas (o en el diésel). placa '' = ese día no traía camión.
function camionDe(chofer, fecha, cat, ultima) {
  if (!chofer || !cat) return null;
  const k = claveVj(chofer), dia = fecha || txtFecha(new Date());
  let a = null;
  (cat.camiones || []).forEach(x => { if (claveVj(x.chofer) === k && x.fecha <= dia && (!a || x.fecha >= a.fecha)) a = x; });
  if (a) return { placa:a.placa, de:'dia', fecha:a.fecha, guardo:a.guardo, cuando:a.cuando };
  const u = Object.entries(ultima || {}).find(([c]) => claveVj(c) === k)?.[1];
  // Si la placa de su última nota está mal escrita (no está en el catálogo) no se toma: no se podría guardar
  const enCatalogo = p => !(cat.placas || []).length || cat.placas.some(x => x.placa === p);
  return u && enCatalogo(u.placa) ? { placa:u.placa, de:'ultima', fecha:u.fecha } : null;
}
// Materiales que ya se han llevado a una obra (los del catálogo, del más usado al menos usado)
function usadosEnObra(obra, cat) {
  if (!obra || !cat) return [];
  const cuenta = {};
  Object.entries(cat.materialesObra || {}).filter(([o]) => claveVj(o) === claveVj(obra))
    .forEach(([, ms]) => Object.entries(ms).forEach(([m, n]) => cuenta[claveVj(m)] = (cuenta[claveVj(m)] || 0) + n));
  return (cat.materiales || []).filter(m => cuenta[claveVj(m)]).sort((a, b) => cuenta[claveVj(b)] - cuenta[claveVj(a)]);
}
const opsPlacas = cat => (cat.placas || []).map(p => ({ v:p.placa, t:p.placa + (p.descripcion ? ' · ' + p.descripcion : '') }));
const irSeccion = s => document.querySelector(`nav a[data-s="${s}"]`)?.click();

// ══════════════════════════════════════════
//  DIARIO (Diario.gs): qué camión trae cada chofer, cm de diésel en el tanque, km de ProTrack,
//  notas con foto / en papel, diésel del día y el resumen para pegar en el grupo
// ══════════════════════════════════════════
const masDias = (s, n) => { const d = fechaLocal(s); d.setDate(d.getDate() + n); return txtFecha(d); };
const diaNombre = s => diaVj(s).charAt(0) + diaVj(s).slice(1).toLowerCase();
const nombreCorto = s => { const p = String(s || '').trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[1][0]}.` : p[0] || ''; };
const vacioCm = v => v === '' || v == null;
// Litros en un tanque cilíndrico acostado con h cm de diésel (diámetro y largo en cm)
function litrosCilindro(h, diam, largo) {
  if (!(h >= 0) || !(diam > 0) || !(largo > 0)) return null;
  const r = diam / 2, x = Math.min(h, diam);
  return (r * r * Math.acos((r - x) / r) - (r - x) * Math.sqrt(Math.max(0, 2 * r * x - x * x))) * largo / 1000;
}
// Litros en los tanques de un camión (null si faltan las medidas del tanque o algún cm)
function litrosCamion(placa, cm1, cm2, tanques) {
  const t = tanques?.[placa];
  if (!t || !t.diametro || !t.largo || vacioCm(cm1)) return null;
  const a = litrosCilindro(+cm1, t.diametro, t.largo);
  if (t.tanques !== 2 || a == null) return a;
  return vacioCm(cm2) ? null : a + litrosCilindro(+cm2, t.diametro, t.largo);
}
// km de cada placa en cada fecha, según qué camión es cada dispositivo de ProTrack: { 'PLACA|fecha': km }
function kmPorPlaca(km, dispositivos) {
  const o = {};
  (km || []).forEach(r => { const p = dispositivos?.[r.dispositivo]; if (p) o[p + '|' + r.fecha] = (o[p + '|' + r.fecha] || 0) + r.km; });
  return o;
}
// "Informe sobre kilometraje" de ProTrack: un bloque por dispositivo ("Dispositivo:NOMBRE") con un renglón por día
function leerInformeKm(wb) {
  const out = [];
  wb.SheetNames.forEach(n => {
    let disp = '';
    XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:false, defval:'' }).forEach(r => {
      const a = String(r[0] ?? '').trim(), m = a.match(/^Dispositivo\s*:\s*(.+)$/i);
      if (m) { disp = m[1].trim(); return; }
      const fecha = String(r[1] ?? '').trim().slice(0, 10);
      if (disp && /^\d+$/.test(a) && /^\d{4}-\d{2}-\d{2}$/.test(fecha))
        out.push({ fecha, dispositivo:disp, km:parseFloat(r[2]) || 0, excesos:parseInt(r[3]) || 0, paradas:parseInt(r[4]) || 0 });
    });
  });
  return out;
}

const Diario = (() => {
  let D = null, pide = 0;
  const CACHE = {};
  const $d = id => document.getElementById(id);
  const dia = () => $d('dr-dia').value || txtFecha(new Date());
  const olvidar = () => Object.keys(CACHE).forEach(x => delete CACHE[x]);
  let saltado = '';      // domingo sin nada que "Ayer" se saltó para mostrar el sábado
  function ir(n) { $d('dr-dia').value = masDias(txtFecha(new Date()), n); cargar(false, n === -1); }
  function mover(n) { $d('dr-dia').value = masDias(dia(), n); cargar(); }
  // Un domingo sin notas, sin cargas de diésel y sin camiones moviéndose (si algún domingo se trabaja, sí se muestra)
  const domingoVacio = r => fechaLocal(r.fecha).getDay() === 0 && !(r.notas || []).some(v => v.fecha === r.fecha)
    && !(r.tickets || []).length && !(r.km || []).some(k => k.km > 0);

  async function cargar(forzar, saltarDomingo) {
    const f = dia(), body = $d('dr-body'), yo = ++pide;
    if (!saltarDomingo && !(saltado && f === masDias(saltado, -1))) saltado = '';
    if (!forzar && CACHE[f]) {
      if (saltarDomingo && domingoVacio(CACHE[f])) { saltado = f; $d('dr-dia').value = masDias(f, -1); return cargar(false); }
      D = CACHE[f]; D.marcadas = null; if (!D.filas) armarFilas(); calcular(); return pintar();
    }
    body.innerHTML = '<div class="pn"><div class="empty">Leyendo lo del día…</div></div>';
    bar(true);
    try {
      const r = await api({ action:'diario_dia', fecha:f });
      if (yo !== pide) return;          // mientras tanto se pidió otro día
      CACHE[f] = r;
      if (saltarDomingo && domingoVacio(r)) { saltado = f; $d('dr-dia').value = masDias(f, -1); bar(false); return cargar(false); }
      D = r;
      armarFilas(); calcular(); pintar();
    } catch(e) {
      if (yo === pide) body.innerHTML = `<div class="pn"><div class="empty">No se pudo leer el día: ${esc(e.message)}</div></div>`;
    } finally { bar(false); }
  }
  const cmDe = placa => (D.cm || []).find(x => x.placa === placa && x.fecha === D.fecha) || null;
  // Un renglón por chofer con el camión que traía ese día; lo que se escribe se queda aquí hasta guardar
  function armarFilas() {
    D.filas = (D.choferes || []).map(ch => {
      const cam = camionDe(ch, D.fecha, D, D.ultimaPlaca), placa = cam?.placa || '', s = placa ? cmDe(placa) : null;
      return { chofer:ch, cam, placa, cm1:s?.cm1 ?? '', cm2:s?.cm2 ?? '' };
    });
  }
  function calcular() {
    D.notasDia = (D.notas || []).filter(v => v.fecha === D.fecha);
    // Las que se palomean aquí no se quitan de la lista hasta Actualizar o cambiar de día (que no se mueva mientras se palomea)
    D.marcadas = D.marcadas || new Set();
    D.pendPapel = (D.notas || []).filter(v => v.fecha < D.fecha && v.foto && (!v.entregado || D.marcadas.has(v.fila)));
    D.kmPlaca = kmPorPlaca(D.km, D.dispositivos);
  }
  const notasDe = ch => D.notasDia.filter(v => claveVj(v.chofer) === claveVj(ch));
  const cambioCamion = x => x.placa !== (x.cam?.placa || '') || (x.placa && x.cam?.de !== 'dia');
  const cambioCm = x => { if (!x.placa) return false; const s = cmDe(x.placa); return String(x.cm1 ?? '') !== String(s?.cm1 ?? '') || String(x.cm2 ?? '') !== String(s?.cm2 ?? ''); };
  const hayCambios = () => D?.filas?.some(x => (x.placa !== (x.cam?.placa || '')) || cambioCm(x));
  // Camiones que trabajaron y no tienen notas ese día: se movieron (ProTrack) o, sin ProTrack, traían chofer en un día con notas.
  // A veces es un viaje sin nota (p. ej. llevar material a la planta): se anota como "viaje explicado".
  const KM_MOVIO = 5;
  function sinNotas() {
    const f = D.fecha, hayNotas = D.notasDia.length > 0, out = new Map();
    const conNotas = (placa, chofer) => D.notasDia.some(v => v.placa === placa || (chofer && claveVj(v.chofer) === claveVj(chofer)));
    const choferDe = placa => D.filas.find(x => x.placa === placa)?.chofer || '';
    Object.entries(D.kmPlaca).forEach(([k, km]) => {
      const [placa, fecha] = k.split('|');
      if (fecha === f && km >= KM_MOVIO && !conNotas(placa, choferDe(placa))) out.set(placa, { placa, chofer:choferDe(placa), km, motivo:`recorrió ${f0(Math.round(km))} km` });
    });
    if (hayNotas) D.filas.filter(x => x.placa && D.kmPlaca[x.placa + '|' + f] == null && !out.has(x.placa) && !conNotas(x.placa, x.chofer))
      .forEach(x => out.set(x.placa, { placa:x.placa, chofer:x.chofer, km:null, motivo:'traía chofer (sin km de ProTrack)' }));
    const ex = {}; (D.explicados || []).forEach(e => ex[e.placa] = e);
    // También los explicados que ya no salen en la lista (p. ej. después llegó la nota), para poder quitarlos
    (D.explicados || []).forEach(e => { if (!out.has(e.placa)) out.set(e.placa, { placa:e.placa, chofer:e.chofer, km:null, motivo:'—' }); });
    return [...out.values()].map(x => ({ ...x, expl:ex[x.placa] || null }));
  }
  const litrosTxt = x => {
    if (!x.placa || vacioCm(x.cm1)) return '—';
    const L = litrosCamion(x.placa, x.cm1, x.cm2, D.tanques);
    return L == null ? '<span style="color:var(--muted)" title="Faltan las medidas del tanque en la hoja Tanques">sin medidas</span>' : f0(Math.round(L)) + ' L';
  };

  function filaCam(x, i, ops, repetidas) {
    const t = D.tanques?.[x.placa], c = x.cam, km = x.placa ? D.kmPlaca[x.placa + '|' + D.fecha] : null, nv = notasDe(x.chofer);
    const origen = x.placa !== (c?.placa || '') ? 'Cambio sin guardar'
      : !c ? 'Sin camión guardado' : c.de === 'ultima' ? `De su última nota (${fechaCorta(c.fecha)})`
      : c.fecha === D.fecha ? `Guardado por ${c.guardo}` : `Igual que el ${fechaCorta(c.fecha)}`;
    const dis = x.placa ? '' : 'disabled', rep = repetidas.has(x.placa);
    // Una placa guardada que ya no está en el catálogo se muestra igual (si no, el renglón diría "Sin camión")
    if (x.placa && !ops.some(o => o.v === x.placa)) ops = [...ops, { v:x.placa, t:x.placa + ' · no está en el catálogo' }];
    const cm = k => `<input class="ci cm" type="number" min="0" max="150" step="0.5" data-k="${k}" value="${esc(x[k])}" placeholder="cm" ${dis}>`;
    return `<tr data-i="${i}"><td class="dr-n">${esc(x.chofer)}<small>${esc(origen)}</small></td>
      <td><select class="ci${rep ? ' mal' : ''}" data-k="placa" ${rep ? `title="${esc(x.placa)} está con dos choferes"` : ''}><option value="">— Sin camión —</option>${ops.map(o =>
        `<option value="${esc(o.v)}" ${x.placa === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select></td>
      <td>${cm('cm1')}</td><td>${t?.tanques === 2 ? cm('cm2') : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="rt" data-l>${litrosTxt(x)}</td>
      <td class="rt">${km == null ? '—' : f0(km)}</td>
      <td class="rt">${nv.length ? `${nViajes(nv.length)} · ${f0(nv.reduce((s, v) => s + v.m3, 0))} m³` : '—'}</td></tr>`;
  }

  // Dos vistas: Capturar (pasos en el orden de la mañana) y Ver (todo lo del día, solo para leer).
  // Los pasos abiertos o cerrados se respetan mientras se ve el mismo día (no se cierran solos mientras se palomea).
  let vista = vistaGuardada('dr-vista', 'capturar', ['capturar', 'ver']);
  let abiertos = {}, diaAbiertos = '';
  function verVista(v) { vista = v; guardarVista('dr-vista', v); mostrarVista($d('dr-body'), v); }

  function pintar() {
    if (!D) return;
    const f = D.fecha, body = $d('dr-body');
    if (diaAbiertos !== f) { abiertos = {}; diaAbiertos = f; }
    const titulo = `${diaNombre(f)} ${fechaCorta(f)} ${f.slice(0, 4)}`;
    const conCamion = D.filas.filter(x => x.placa), sinCm = conCamion.filter(x => !cmDe(x.placa));
    const n = D.notasDia, foto = n.filter(v => v.foto), papel = n.filter(v => v.entregado), faltan = foto.filter(v => !v.entregado);
    const tk = D.tickets || [], kmTot = (D.km || []).reduce((s, r) => s + r.km, 0);
    const movidos = (D.km || []).filter(r => r.km > 0), quietos = (D.km || []).filter(r => !(r.km > 0));
    const ops = opsPlacas(D), usos = {};
    D.filas.forEach(x => { if (x.placa) usos[x.placa] = (usos[x.placa] || 0) + 1; });
    const repetidas = new Set(Object.keys(usos).filter(p => usos[p] > 1));
    const tabla = (enc, filas, pie, id) => `<div class="tw"><table class="dr-tbl"${id ? ` id="${id}"` : ''}><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody>${pie ? `<tfoot><tr>${pie}</tr></tfoot>` : ''}</table></div>`;
    const linkFoto = v => /^https:\/\/drive\.google\.com\//.test(v.foto) ? `<a href="${esc(v.foto)}" target="_blank" rel="noopener">Ver</a>` : '—';
    const casillaPapel = v => `<input type="checkbox" ${v.entregado ? 'checked' : ''} onchange="Diario.papel(${v.fila}, this)" title="La nota en papel ya llegó">`;

  function botonGuardar() { const b = $d('dr-guardar'); if (b && !b.disabled) b.textContent = hayCambios() ? 'Guardar cambios' : 'Guardar'; }

  async function guardar() {
    const f = D.fecha;
    // Camiones: solo los que cambiaron (o venían de su última nota y no de lo guardado)
    const camiones = D.filas.filter(cambioCamion).map(x => ({ chofer:x.chofer, placa:x.placa }));
    const lecturas = {};
    D.filas.filter(cambioCm).forEach(x => lecturas[x.placa] = { placa:x.placa, cm1:x.cm1, cm2:x.cm2 });
    if (!camiones.length && !Object.keys(lecturas).length) return alert('No hay cambios que guardar');
    const b = $d('dr-guardar'); b.disabled = true; b.textContent = 'Guardando…'; bar(true);
    try {
      if (camiones.length) {
        const j = await api({ action:'camiones_guardar', fecha:f, camiones });
        D.camiones = j.camiones;
        [SUB.nt, SUB.tk].forEach(s => { const c = s.catalogo(); if (c) { c.camiones = j.camiones; s.reajustar('camiones'); } });
      }
      if (Object.keys(lecturas).length) D.cm = (await api({ action:'cm_guardar', fecha:f, lecturas:Object.values(lecturas) })).cm;
      olvidar(); CACHE[f] = D;        // los camiones también cambian los días siguientes
      Object.keys(DS_CACHE).forEach(x => delete DS_CACHE[x]);
      armarFilas(); pintar();
    } catch(e) { alert('No se guardó: ' + e.message); }
    finally { b.disabled = false; bar(false); botonGuardar(); }
  }

  async function subirKm(files) {
    files = [...files];
    if (!files.length) return;
    try {
      if (!window.XLSX) await cargarScript(XLSX_URL);
      const filas = [];
      for (const file of files) filas.push(...leerInformeKm(XLSX.read(await file.arrayBuffer())));
      if (!filas.length) return alert('No encontré kilometraje en ese archivo. Debe ser el "Informe sobre kilometraje" que descargas de ProTrack.');
      const fechas = [...new Set(filas.map(x => x.fecha))].sort(), disp = new Set(filas.map(x => x.dispositivo)).size;
      const rango = fechas.length === 1 ? 'del ' + fechaCorta(fechas[0]) : `del ${fechaCorta(fechas[0])} al ${fechaCorta(fechas[fechas.length - 1])}`;
      if (!(await preguntar(`Informe de kilometraje ${rango}: ${disp} dispositivos, ${f0(filas.reduce((s, x) => s + x.km, 0))} km en total.\n\n¿Guardarlo?`, 'Sí, guardar'))) return;
      bar(true);
      await api({ action:'km_guardar', filas });
      olvidar(); Object.keys(DS_CACHE).forEach(x => delete DS_CACHE[x]);
      if (fechas.length === 1) $d('dr-dia').value = fechas[0];      // se ve el día del informe
      await cargar(true);
    } catch(e) { alert('No se pudo subir el informe: ' + e.message); }
    finally { bar(false); }
  }

  async function asignar(disp, sel) {
    sel.disabled = true;
    try {
      D.dispositivos = (await api({ action:'km_dispositivo', dispositivo:disp, placa:sel.value })).dispositivos;
      Object.values(CACHE).forEach(x => x.dispositivos = D.dispositivos);
      Object.keys(DS_CACHE).forEach(x => delete DS_CACHE[x]);
      calcular(); pintar();
    } catch(e) { sel.disabled = false; alert('No se guardó: ' + e.message); }
  }

  async function papel(fila, chk) {
    const v = (D.notas || []).find(x => x.fila === fila);
    if (!v) return;
    chk.disabled = true;
    try {
      await api({ action:'nota_papel', fila, valor:chk.checked, folio:v.folio, fecha:v.fecha });
      Object.values(CACHE).forEach(x => (x.notas || []).forEach(o => { if (o.fila === fila) o.entregado = chk.checked; }));
      Object.keys(VJ_CACHE).forEach(x => delete VJ_CACHE[x]);
      D.marcadas.add(fila);
      calcular(); pintar();
    } catch(e) { chk.checked = !chk.checked; chk.disabled = false; alert('No se pudo guardar la casilla: ' + e.message); }
  }

  // "Viaje explicado": por qué un camión trabajó sin notas (quitar = se guarda vacío)
  async function explicar(btn, quitar) {
    const placa = btn.dataset.p, chofer = btn.dataset.c, inp = btn.parentElement.querySelector('input');
    const nota = quitar ? '' : (inp?.value || '').trim();
    if (!quitar && !nota) { inp?.focus(); return alert('Escribe por qué trabajó sin notas (p. ej. llevó material a la planta).'); }
    if (quitar && !(await preguntar(`¿Quitar la explicación de ${placa}?`, 'Sí, quitar'))) return;
    btn.disabled = true; bar(true);

  function resumen() {

      if (km) partes.push(`${Math.round(km)} km`);

    // Por chofer: "Juan S. folios 1234, 1235 · Noe G. folio 889"
    const porChofer = (lista, conFecha) => agruparVj(lista, v => claveVj(v.chofer)).map(g => `${nombreCorto(g.items[0].chofer) || 'Sin chofer'} `
      + `folio${g.items.length > 1 ? 's' : ''} ${g.items.map(v => (v.folio || 's/folio') + (conFecha ? ` (${fechaCorta(v.fecha)})` : '')).join(', ')}`).join(' · ');
    const cuando = f === masDias(txtFecha(new Date()), -1) ? 'Ayer' : `El ${diaNombre(f).toLowerCase()}`;
    const sinFoto = n.filter(v => !v.foto);
    L.push('', `*Notas*: ${n.length} · ${foto.length} con foto · ${papel.length} ya en papel`);
    if (faltan.length) L.push('📄 Faltan en papel: ' + porChofer(faltan));
    if (sinFoto.length) L.push(`📷 ${cuando} no enviaron foto: ` + porChofer(sinFoto));

    tk.forEach(t => L.push(`• ${nombreCorto(t.chofer)} – ${t.unidad.split(' — ')[0]} – ${f0(t.litros)} L`));

    const exc = (D.km || []).filter(r => r.excesos > 0);

      const p = D.dispositivos[r.dispositivo], ch = p && D.filas.find(x => x.placa === p)?.chofer;
      return `${ch ? nombreCorto(ch) + ' (' + p + ')' : p || r.dispositivo} ${r.excesos}`;

const ALERTAS_DS = { litros_min:30, precio_min:15, precio_max:45, dias_max:60, diff_monto:0.10 };
function avisosTicket(d) {
  const av = [], L = parseFloat(d.litros), M = parseFloat(d.monto), P = parseFloat(d.precio);
  if (L > 0 && L < ALERTAS_DS.litros_min) av.push(`Carga baja: ${L} L`);
  if (P > 0 && (P < ALERTAS_DS.precio_min || P > ALERTAS_DS.precio_max)) av.push(`Precio fuera de rango: $${P}/L`);
  if (L > 0 && P > 0 && M > 0 && Math.abs(L * P - M) / M > ALERTAS_DS.diff_monto) av.push(`${L} L × $${P} = $${f0(L * P)}, no $${f0(M)}`);
  if (d.fecha) { const dias = diasDesde(d.fecha); if (dias > ALERTAS_DS.dias_max) av.push(`Ticket de hace ${dias} días`); if (dias < -1) av.push('La fecha es futura'); }
  return av;
}

// Semana (lunes a domingo) o mes completo del día escogido
const porMesDs = () => document.getElementById('ds-per').value === 'mes';
function periodoDs(dia) {
  if (!porMesDs()) return semanaVj(dia);
  const d = fechaLocal(dia);
  return { desde:txtFecha(new Date(d.getFullYear(), d.getMonth(), 1)), hasta:txtFecha(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
}
const queDs = () => porMesDs() ? 'mes' : 'semana';
const esteDs = () => porMesDs() ? 'este mes' : 'esta semana';
const tituloDs = () => porMesDs()
  ? `Mes de ${MESES[+DS.desde.slice(5, 7) - 1].toLowerCase()} ${DS.desde.slice(0, 4)}`
  : `Semana del ${fechaCorta(DS.desde)} al ${fechaCorta(DS.hasta)} ${DS.hasta.slice(0, 4)}`;
function moverDs(n) {
  const inp = document.getElementById('ds-dia');
  const d = fechaLocal(inp.value || txtFecha(new Date()));
  if (porMesDs()) d.setMonth(d.getMonth() + n, 1); else d.setDate(d.getDate() + 7 * n);
  inp.value = txtFecha(d);
  cargarDiesel();
}
async function cargarDiesel(forzar) {
  const inp = document.getElementById('ds-dia');
  if (!inp.value) inp.value = txtFecha(new Date());
  const { desde, hasta } = periodoDs(inp.value);
  const k = desde + '|' + hasta, body = document.getElementById('ds-body');
  if (!forzar && DS_CACHE[k]) { DS = DS_CACHE[k]; return renderDiesel(); }
  body.innerHTML = '<div class="pn"><div class="empty">Leyendo los tickets de diésel…</div></div>';
  bar(true);
  try {
    const r = DS_CACHE[k] = await api({ action:'diesel_semana', desde, hasta });
    const ahora = periodoDs(inp.value);
    if (ahora.desde + '|' + ahora.hasta === k) { DS = r; renderDiesel(); }     // mientras tanto se pidió otro periodo
  }
  catch(e) { body.innerHTML = `<div class="pn"><div class="empty">No se pudieron leer los tickets: ${esc(e.message)}</div></div>`; }
  finally { bar(false); }
}
