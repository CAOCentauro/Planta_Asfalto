<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viajes locales — CAO Centauro</title>
<script>try{const t=localStorage.getItem('tema');if(t==='light'||(!t&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.dataset.theme='light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mismo aspecto que el panel de la planta (dashboard.html) */
:root{--bg:#0b1116;--s1:#141d24;--s2:#1b2731;--bd:#26333d;--amb:#5B9BE8;--ink:#fff;--green:#16a34a;--red:#dc2626;--text:#e8eef2;--muted:#8796a1;--sw:210px;
  --pos:#5fd18e;--neg:#f28b82;--warn:#f2b45c;color-scheme:dark;--f-tit:'Outfit',system-ui,sans-serif}
:root[data-theme="light"]{--bg:#F3F7FA;--s1:#ffffff;--s2:#eef3f6;--bd:#dce3e9;--amb:#1F64B5;--ink:#fff;--text:#0d141a;--muted:#5d6d78;
  --pos:#1b7a43;--neg:#b42318;--warn:#a65300;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
#app{display:none;height:100vh}
#sidebar{width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bd)}
.sb-logo span{display:block;font-size:10px;color:var(--amb);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sb-logo strong{display:block;font-size:14px;margin-top:3px;font-family:var(--f-tit);font-weight:600}
nav{padding:10px 0;flex:1}
nav a{display:block;padding:9px 16px;color:var(--muted);text-decoration:none;font-size:13px;border-left:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.active{color:var(--amb);border-left-color:var(--amb);background:rgba(56,128,214,.05)}
nav a.pronto{opacity:.55;cursor:default}
nav a small{font-size:10px;margin-left:4px}
.nav-g{padding:14px 16px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.nav-g:first-child{padding-top:4px}
.sb-foot{padding:12px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--muted)}
.btn-r{margin-top:10px;padding:6px 10px;background:transparent;border:1px solid var(--bd);color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;width:100%}
.btn-r:hover{border-color:var(--amb);color:var(--amb)}
.btn-r + .btn-r{margin-top:6px}
.theme-btn{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.theme-btn:hover{background:var(--amb);border-color:var(--amb);color:var(--ink)}
.btn-r.casa{display:flex;align-items:center;justify-content:center;padding:5px 10px}
.btn-r.casa svg{width:18px;height:18px}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
#pbar{height:2px;background:var(--amb);width:0;transition:width .3s;position:fixed;top:0;left:0;right:0;z-index:999}
.sec{display:none;flex-direction:column;height:100%;overflow-y:auto}
.sec.on{display:flex}
.ph{padding:15px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0;flex-wrap:wrap}
.ph h2{font-size:17px;font-weight:600;flex:1;font-family:var(--f-tit)}
.sb{padding:24px;display:flex;flex-direction:column;gap:20px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.mc{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--amb);padding:16px}
.mc.r{border-left-color:var(--red)}.mc.g{border-left-color:var(--green)}.mc.m{border-left-color:var(--muted)}
.ml{font-size:11px;color:var(--muted);margin-bottom:6px}
.mv{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--f-tit)}
.ms{font-size:11px;color:var(--muted);margin-top:5px}
.pn{background:var(--s1);border:1px solid var(--bd)}
.pnh{padding:11px 16px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:last-child td{border-bottom:none}
tfoot td{border-top:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 7px;font-size:10px;font-weight:600}
.ta{background:rgba(220,38,38,.15);color:var(--neg)}
.tm{background:rgba(247,147,30,.15);color:var(--warn)}
.tb{background:rgba(22,163,74,.15);color:var(--pos)}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=date]{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:6px 10px;font-family:inherit;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--amb)}
.ftb{background:transparent;border:1px solid var(--bd);color:var(--muted);padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.ftb:hover{border-color:var(--amb);color:var(--amb)}
.ftb:disabled{opacity:.5;cursor:default}
a.ftb{display:inline-block;text-decoration:none}
.ftb.active{background:rgba(56,128,214,.12);border-color:var(--amb);color:var(--amb)}
.ftb.p{background:var(--amb);border-color:var(--amb);color:var(--ink)}
.ftb.p:hover{filter:brightness(.9);color:var(--ink)}
/* SUBIR NOTAS */
.ci{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:5px 7px;font-family:inherit;font-size:12px;outline:none;width:100%}
.ci:focus{border-color:var(--amb)}
.ci.mal{border-color:var(--red)}
.ci:disabled{opacity:.6}
.thumb{width:44px;height:44px;object-fit:cover;cursor:zoom-in;border:1px solid var(--bd);display:block}
.sinfoto{width:44px;height:44px;border:1px dashed var(--bd);color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center}
.drop{border:2px dashed var(--bd);padding:36px 16px;text-align:center;color:var(--muted);cursor:pointer;line-height:1.8}
.drop.over,.drop:hover{border-color:var(--amb);color:var(--amb)}
.av{font-size:11px;color:var(--neg);white-space:normal;min-width:150px;max-width:220px;line-height:1.35}
#nt-tbl td{vertical-align:top}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.bulk .ci{width:auto;min-width:120px}
/* DIARIO */
.dr-tbl td{vertical-align:middle}
.dr-tbl .ci{width:auto}
.dr-tbl select.ci{width:190px}
.dr-tbl input.cm{width:64px}
.dr-n{font-weight:600}
.dr-n small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px;white-space:normal;max-width:220px}
.pnh .ftb{text-transform:none;letter-spacing:0}
.nota-pn{font-size:12px;color:var(--muted);padding:10px 16px;line-height:1.6;white-space:normal}
#dr-resumen{width:100%;min-height:260px;background:var(--s2);border:1px solid var(--bd);color:var(--text);font-family:inherit;font-size:13px;line-height:1.5;padding:12px;resize:vertical}
.conf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner-dr{font-size:12px;padding:10px 14px;border-left:3px solid var(--warn);background:rgba(247,147,30,.08);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
summary.pnh{cursor:pointer;list-style:none}
summary.pnh::-webkit-details-marker{display:none}
/* Barra de arriba igual en Diario, Fletes y Diésel: a la izquierda qué día/periodo; a la derecha Actualizar y el botón principal */
.ph.bar h2{flex:0 0 auto;margin-right:6px}
.acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ftb.s2{border-color:transparent;text-decoration:underline;text-underline-offset:3px}
/* Vistas (Capturar / Ver, Viajes / Resúmenes / Acumulado, Tickets / Rendimiento) */
.vistas{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.vistas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:-1px}
.vistas button:hover{color:var(--text)}
.vistas button.on{color:var(--amb);border-bottom-color:var(--amb)}
.vista-c{display:flex;flex-direction:column;gap:16px}
.vista-c[hidden]{display:none}
/* Línea gris bajo el título de cada panel: para qué sirve */
.pn-sub{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--bd);line-height:1.5}
/* Pasos del Diario */
.avance{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.avance i{display:inline-block;width:26px;height:6px;background:var(--bd)}
.avance i.ok{background:var(--green)}
.avance b{margin-left:6px;color:var(--text);font-weight:600}
.paso{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--amb)}
.paso.ok{border-left-color:var(--green)}
.paso.aj{border-left-color:var(--muted)}
.paso > summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.paso > summary::-webkit-details-marker{display:none}
.paso[open] > summary{border-bottom:1px solid var(--bd)}
.paso-n{width:24px;height:24px;border-radius:50%;border:1px solid var(--amb);color:var(--amb);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.paso.ok .paso-n{background:var(--green);border-color:var(--green);color:#fff}
.paso.aj .paso-n{border-color:var(--muted);color:var(--muted)}
.paso-t{font-weight:600;font-size:14px;font-family:var(--f-tit)}
.paso-e{font-size:12px;color:var(--muted);margin-left:auto}
.paso-e.mal{color:var(--warn)}
.paso .fl{font-size:11px;color:var(--muted)}
.paso .pn.sub{border:none;border-top:1px solid var(--bd)}
.bar-paso{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:12px;color:var(--muted)}
.bar-paso .ftb{font-size:12px;padding:6px 14px}
/* FLETES: filtros y acumulado */
.flt[hidden]{display:none}
details.fil > summary{cursor:pointer;list-style:none}
details.fil > summary::-webkit-details-marker{display:none}
details.fil:not([open]) > summary{border-bottom:none}
.vj-fil{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px}
.vj-fil label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.vj-fil select{min-width:120px;max-width:200px}
.vj-fil select.on{border-color:var(--amb);color:var(--amb)}
.vj-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 12px;font-size:12px}
.chip{border:1px solid var(--amb);color:var(--amb);background:rgba(56,128,214,.08);padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.chip:hover{background:rgba(56,128,214,.2)}
.vista{display:flex;gap:0}
.vista .ftb{font-size:11px;padding:5px 12px}
.sinp{color:var(--warn)}
.fl{white-space:nowrap}
.fl::after{content:'Mostrar ▸';text-transform:none;letter-spacing:0;font-weight:500}
details[open] > summary .fl::after{content:'Ocultar ▾'}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-c{background:var(--s1);border:1px solid var(--bd);border-top:3px solid var(--amb);max-width:440px;width:100%;padding:20px}
.dlg-t{font-size:14px;line-height:1.5;white-space:pre-line;margin-bottom:18px}
.dlg-b{display:flex;justify-content:flex-end;gap:8px}
.dlg-b .ftb{font-size:12px;padding:8px 16px}
/* Editar una nota ya registrada */
.dlg-c.ed{max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.ed-g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:16px}
.ed-g label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.ed-g label.w2{grid-column:1/-1}
.ed-g .ci.cambio{border-color:var(--amb)}
.ed-info{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.dlg-b .ed-anular{margin-right:auto}
.btn-ed{background:none;border:1px solid var(--bd);color:var(--muted);cursor:pointer;padding:2px 7px;font-size:12px}
.btn-ed:hover{border-color:var(--amb);color:var(--amb)}
@media(max-width:520px){.ed-g{grid-template-columns:1fr}}
.dlg-c.ob{max-width:720px}
.ob-o{border:1px solid var(--bd);margin-bottom:10px}
.ob-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--s2)}
.ob-h small{color:var(--muted);font-size:12px}
.ob-o table{width:100%}
.ob-vacio{font-size:12px;color:var(--muted);padding:10px}
.ob-ok{font-size:12px;border-left:3px solid var(--pos);background:rgba(34,197,94,.1);padding:8px 10px;margin-bottom:12px;line-height:1.5}
.ob-p{display:grid;grid-template-columns:1fr 120px;gap:6px;margin-bottom:6px}
.cc-obra{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);margin-bottom:12px}
.cc-pad{padding:10px;font-size:13px;line-height:1.5}
.cc-pad small{color:var(--muted)}
.cc-pad .ed-g{margin-bottom:10px}
.cc-dif td{font-size:12px;padding-top:0}
.cc-prev{margin-bottom:10px}
.cc-prev .btn-ed{margin:3px 0 3px 6px}
@media(max-width:520px){.cc-m3{display:none}.cc-t th,.cc-t td{padding-left:6px;padding-right:6px}}
#modal-foto{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;cursor:zoom-out}
#modal-foto.on{display:flex}
#modal-foto img{max-width:95vw;max-height:92vh}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}.rt{text-align:right}
a{color:var(--amb)}
.empty{padding:36px;text-align:center;color:var(--muted);line-height:2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > *{min-width:0}     /* una tabla ancha se desplaza dentro de su panel, no empuja la página */
@media(max-width:860px){.two{grid-template-columns:1fr}}
#menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
@media(max-width:640px){
  #menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:101;background:var(--s1);border:1px solid var(--bd);padding:4px 10px}
  #sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:100;transition:left .2s;width:220px}
  #sidebar.open{left:0}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
  #overlay.on{display:block}
  #main{padding-top:44px}
}
</style>
</head>
<body>
<div id="pbar"></div>

<!-- Se muestra cuando la sesión es válida; el acceso está en index.html -->
<div id="app">
<button id="menu-btn" onclick="toggleMenu()">Secciones</button>
<div id="overlay" onclick="closeMenu()"></div>
<div id="sidebar">
  <div class="sb-logo"><span>CAO Centauro</span><strong>Viajes locales</strong></div>
  <nav>
    <div class="nav-g">Cada día</div>
    <a href="#" class="active" data-s="diario">Diario</a>
    <a href="#" data-s="subir">Subir notas <span id="nt-badge" style="color:var(--amb)"></span></a>
    <a href="#" data-s="tickets">Subir tickets de diésel <span id="tk-badge" style="color:var(--amb)"></span></a>
    <div class="nav-g">Consultar</div>
    <a href="#" data-s="fletes">Fletes</a>
    <a href="#" data-s="diesel">Diésel y rendimiento</a>
  </nav>
  <div class="sb-foot">
    <span id="sb-user" style="display:block;margin:0 0 8px;font-weight:600;color:var(--text)">—</span>
    <button class="btn-r theme-btn" onclick="toggleTheme()">Modo claro</button>
  </div>
</div>

<div id="main">
  <!-- DIARIO: lo de un día (camiones, cm de diésel, km, notas, diésel) y el resumen para el grupo -->
  <section class="sec on" id="sec-diario">
    <div class="ph bar">
      <h2>Diario</h2>
      <div class="flt">
        <button class="ftb" onclick="Diario.mover(-1)" title="Día anterior">‹</button>
        <input type="date" id="dr-dia" onchange="Diario.cargar()">
        <button class="ftb" onclick="Diario.mover(1)" title="Día siguiente">›</button>
        <button class="ftb" onclick="Diario.ir(-1)">Ayer</button>
        <button class="ftb" onclick="Diario.ir(0)">Hoy</button>
      </div>
      <div class="acc">
        <button class="ftb" onclick="Diario.cargar(true)">Actualizar</button>
        <button class="ftb p" onclick="Diario.copiar()">Copiar resumen</button>
      </div>
    </div>
    <div class="sb" id="dr-body"></div>
  </section>

  <!-- FLETES DE LA SEMANA -->
  <section class="sec" id="sec-fletes">
    <div class="ph bar">
      <h2>Fletes</h2>
      <div class="flt">
        <select id="vj-per" onchange="cambiarPeriodoVj()" title="Ver por semana, por mes o un rango de fechas">
          <option value="semana">Semana</option><option value="mes">Mes</option><option value="rango">Desde – hasta</option></select>
        <span id="vj-nav" class="flt">
          <button class="ftb" onclick="moverVj(-1)" title="Anterior">‹</button>
          <input type="date" id="vj-dia" onchange="cargarViajes()" title="Cualquier día de la semana o del mes">
          <button class="ftb" onclick="moverVj(1)" title="Siguiente">›</button>
        </span>
        <span id="vj-rango" class="flt" hidden>
          <input type="date" id="vj-desde" onchange="cargarViajes()" title="Desde"> –
          <input type="date" id="vj-hasta" onchange="cargarViajes()" title="Hasta">
        </span>
      </div>
      <div class="acc">
        <button class="ftb" id="vj-obras" onclick="Obras.abrir()" hidden>Obras y precios</button>
        <button class="ftb" id="vj-conc" onclick="Conc.abrir()" hidden>Conciliaciones</button>
        <button class="ftb s2" onclick="excelViajes(this)">Descargar Excel</button>
        <button class="ftb s2" onclick="whatsViajes()">Enviar por WhatsApp</button>
        <button class="ftb" onclick="cargarViajes(true)">Actualizar</button>
      </div>
    </div>
    <div class="sb" id="vj-body"></div>
  </section>

  <!-- SUBIR NOTAS y SUBIR TICKETS: las llena Subidor() (como los admin de Notas de Viaje y de Diesel) -->
  <section class="sec" id="sec-subir"></section>
  <section class="sec" id="sec-tickets"></section>

  <!-- DIÉSEL DE LA SEMANA -->
  <section class="sec" id="sec-diesel">
    <div class="ph bar">
      <h2>Diésel y rendimiento</h2>
      <div class="flt">
        <select id="ds-per" onchange="cargarDiesel()" title="Ver por semana o por mes"><option value="semana">Semana</option><option value="mes">Mes</option></select>
        <button class="ftb" onclick="moverDs(-1)" title="Anterior">‹</button>
        <input type="date" id="ds-dia" onchange="cargarDiesel()" title="Cualquier día de la semana o del mes">
        <button class="ftb" onclick="moverDs(1)" title="Siguiente">›</button>
      </div>
      <div class="acc">
        <button class="ftb s2" onclick="excelDiesel(this)">Descargar Excel</button>
        <button class="ftb s2" onclick="whatsDiesel()">Enviar por WhatsApp</button>
        <button class="ftb" onclick="cargarDiesel(true)">Actualizar</button>
      </div>
    </div>
    <div class="sb" id="ds-body"></div>
  </section>
</div><!-- /main -->
</div><!-- /app -->
<div id="modal-foto" onclick="this.classList.remove('on')"><img alt="Foto de la nota"></div>

<script src="sesion.js"></script>
<script>
const api = body => Sesion.api(body, 60000);
const N  = v => v==null ? 0 : parseFloat(v)||0;
const f0 = v => new Intl.NumberFormat('es-MX',{maximumFractionDigits:2}).format(N(v));
// Lo escriben los choferes o la IA: se escapa antes de ponerlo en la página
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Avisos y confirmaciones dentro de la página (algunos navegadores bloquean las ventanas alert/confirm)
function dialogo(msg, siTxt, noTxt) {
  return new Promise(listo => {
    const ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c" role="dialog"><div class="dlg-t"></div><div class="dlg-b">
      ${noTxt ? `<button class="ftb" data-r="0">${noTxt}</button>` : ''}<button class="ftb p" data-r="1">${siTxt}</button></div></div>`;
    ov.querySelector('.dlg-t').textContent = msg;
    const cerrar = r => { ov.remove(); removeEventListener('keydown', tecla, true); listo(r); };
    const tecla = e => { if (e.key === 'Escape') { e.preventDefault(); cerrar(false); } };
    ov.addEventListener('click', e => { const r = e.target.dataset?.r; if (r != null) cerrar(r === '1'); });
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}
const preguntar = (msg, siTxt = 'Sí, continuar') => dialogo(msg, siTxt, 'Cancelar');
window.alert = msg => { dialogo(String(msg), 'Entendido'); };
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
// Número de WhatsApp para enviar los fletes: lada + número, solo dígitos. Vacío → WhatsApp pide elegir el contacto.

function cargarScript(src) {
  return new Promise((ok, err) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => err(new Error('no se pudo cargar ' + src.split('/').pop()));
    document.head.appendChild(s);
  });
}

const guardarVista = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
