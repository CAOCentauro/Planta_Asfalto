// ══════════════════════════════════════════
//  FLETES DE LA SEMANA (Viajes.gs lee el Sheets de Notas de Viaje)
// ══════════════════════════════════════════
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const DIAS_VJ = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const VJ_CACHE = {};        // `${desde}|${hasta}` → respuesta de viajes_semana
let VJ = null;              // semana en pantalla

const fechaLocal = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const txtFecha = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const diaVj = s => DIAS_VJ[fechaLocal(s).getDay()];
const claveVj = s => String(s||'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const ddmmyy = s => s.slice(8,10) + s.slice(5,7) + s.slice(2,4);                 // 2026-11-03 → 031126
const nViajes = n => `${n} viaje${n!==1?'s':''}`;
// Fecha para Excel como número de serie (con Date el Excel la corre un día por la zona horaria)
const celdaFecha = s => { const [y, m, d] = s.split('-').map(Number); return { t:'n', v:(Date.UTC(y, m-1, d) - Date.UTC(1899, 11, 30)) / 864e5, z:'dd/mm/yyyy' }; };
// Lunes a domingo de la semana del día dado
function semanaVj(dia) {
  const d = fechaLocal(dia), lun = new Date(d); lun.setDate(d.getDate() - (d.getDay() + 6) % 7);
  const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
  return { desde:txtFecha(lun), hasta:txtFecha(dom) };
}

// Periodo en pantalla: semana (lunes a domingo), mes, o desde – hasta (máximo un año)
const elVj = id => document.getElementById(id);
function periodoVj() {
  const per = elVj('vj-per').value, dia = elVj('vj-dia').value || txtFecha(new Date());
  if (per === 'mes') {
    const d = fechaLocal(dia);
    return { per, desde:txtFecha(new Date(d.getFullYear(), d.getMonth(), 1)), hasta:txtFecha(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  if (per === 'rango') {
    let a = elVj('vj-desde').value, b = elVj('vj-hasta').value;
    if (!a || !b) { const s = semanaVj(dia); a = a || s.desde; b = b || s.hasta; }
    if (a > b) [a, b] = [b, a];
    return { per, desde:a, hasta:b };
  }
  return { per, ...semanaVj(dia) };
}
function tituloVj(p) {
  const anio = p.hasta.slice(0, 4);
  if (p.per === 'mes') return `${MESES[+p.desde.slice(5, 7) - 1]} ${anio}`;
  return `${p.per === 'semana' ? 'Semana del' : 'Del'} ${fechaCorta(p.desde)}${p.desde.slice(0, 4) !== anio ? ' ' + p.desde.slice(0, 4) : ''} al ${fechaCorta(p.hasta)} ${anio}`;
}
function cambiarPeriodoVj() {
  const rango = elVj('vj-per').value === 'rango';
  elVj('vj-rango').hidden = !rango; elVj('vj-nav').hidden = rango;
  if (rango && (!elVj('vj-desde').value || !elVj('vj-hasta').value)) {
    elVj('vj-desde').value = VJ?.desde || semanaVj(txtFecha(new Date())).desde;
    elVj('vj-hasta').value = VJ?.hasta || semanaVj(txtFecha(new Date())).hasta;
  }
  cargarViajes();
}
function moverVj(n) {
  const inp = elVj('vj-dia'), d = fechaLocal(inp.value || txtFecha(new Date()));
  if (elVj('vj-per').value === 'mes') d.setMonth(d.getMonth() + n, 1); else d.setDate(d.getDate() + 7 * n);
  inp.value = txtFecha(d);
  cargarViajes();
}
function irSemanaVj(dia) {
  elVj('vj-per').value = 'semana'; elVj('vj-rango').hidden = true; elVj('vj-nav').hidden = false;
  elVj('vj-dia').value = dia; cargarViajes();
}

async function cargarViajes(forzar) {
  const { desde, hasta } = periodoVj();
  const k = desde + '|' + hasta, body = elVj('vj-body');
  if (!forzar && VJ_CACHE[k]) { VJ = VJ_CACHE[k]; return renderViajes(); }
  body.innerHTML = '<div class="pn"><div class="empty">Leyendo las notas de viaje…</div></div>';
  bar(true);
  try {
    VJ = VJ_CACHE[k] = await api({ action:'viajes_semana', desde, hasta });
    if (periodoVj().desde + '|' + periodoVj().hasta === k) renderViajes();     // mientras tanto se pidió otro periodo
  } catch(e) {
    body.innerHTML = `<div class="pn"><div class="empty">No se pudieron leer las notas: ${esc(e.message)}</div></div>`;
  } finally { bar(false); }
}

// ── Filtros: cada lista muestra solo lo que hay con los demás filtros puestos ──
const FILTROS_VJ = [
  ['cliente',  'Cliente',  v => v.cliente],
  ['obra',     'Obra',     v => v.obra],
  ['chofer',   'Chofer',   v => v.chofer],
  ['placa',    'Placa',    v => v.placa],
  ['material', 'Material', v => v.material],
  ['dia',      'Día',      v => diaNombre(v.fecha)],
  ['m3',       'm³',       v => v.m3 ? String(v.m3) : ''],
];
const FV = {};                       // filtro → clave elegida ('' = todos)
let VISTA_VJ = vistaGuardada('vj-vista', 'viajes', ['viajes', 'resumenes', 'acumulado']), AGR_VJ = 'semana', FIL_VJ_ABIERTO = false;
const claveFil = t => claveVj(t) || '(VACIO)';
const pasaVj = (v, salvo) => FILTROS_VJ.every(([k, , get]) => k === salvo || !FV[k] || claveFil(get(v)) === FV[k]);
function filtrarVj(k, valor) { FV[k] = valor; renderViajes(); }
function quitarFiltrosVj() { FILTROS_VJ.forEach(([k]) => FV[k] = ''); renderViajes(); }
function vistaVj(v) { VISTA_VJ = v; guardarVista('vj-vista', v); mostrarVista(elVj('vj-body'), v); }
function agruparPorVj(a) { AGR_VJ = a; renderViajes(); }
// Texto de un filtro puesto ("Soto"), tomado de los viajes
function textoFiltroVj(k, todos) {
  const get = FILTROS_VJ.find(f => f[0] === k)[2], v = todos.find(x => claveFil(get(x)) === FV[k]);
  return v ? (String(get(v)).trim() || '(vacío)') : FV[k];
}
const filtrosTxtVj = todos => FILTROS_VJ.filter(([k]) => FV[k]).map(([k, n]) => `${n}: ${textoFiltroVj(k, todos)}`).join(' · ');
function opcionesVj(todos, k) {
  const get = FILTROS_VJ.find(f => f[0] === k)[2], m = new Map();
  todos.filter(v => pasaVj(v, k)).forEach(v => {
    const t = String(get(v) ?? '').trim(), c = claveFil(t);
    if (!m.has(c)) m.set(c, { c, t:t || '(vacío)', n:0 });
    m.get(c).n++;
  });
  const ops = [...m.values()];
  if (FV[k] && !m.has(FV[k])) ops.push({ c:FV[k], t:textoFiltroVj(k, todos), n:0 });
  const orden = k === 'dia' ? o => (DIAS_VJ.map(claveVj).indexOf(o.c) + 6) % 7 : k === 'm3' ? o => Number(o.c) || 0 : null;
  return ops.sort((a, b) => orden ? orden(a) - orden(b) : a.t.localeCompare(b.t, 'es'));
}

// ── Precio por m³ de cada viaje (Sheets "Precios viajes"): cliente + material, la obra si se puso, y el vigente a esa fecha ──
function precioVj(v, precios) {
  const c = claveVj(v.cliente), m = claveVj(v.material), o = claveVj(v.obra);
  let mejor = null;
  (precios || []).forEach(p => {
    if (claveVj(p.cliente) !== c || claveVj(p.material) !== m) return;
    if (p.obra && claveVj(p.obra) !== o) return;
    if (p.desde && p.desde > v.fecha) return;
    const r = [p.obra ? 1 : 0, p.desde || ''];
    if (!mejor || r[0] > mejor.r[0] || (r[0] === mejor.r[0] && r[1] >= mejor.r[1])) mejor = { p, r };
  });
  return mejor ? mejor.p.precio : null;
}

// Viajes del periodo ya ordenados, con avisos, precio e importe, y los filtrados
function datosViajes() {
  const cat = {}; (VJ.placas||[]).forEach(p => cat[p.placa] = p);
  const todos = (VJ.viajes||[]).slice().sort((a,b) => a.fecha.localeCompare(b.fecha) || claveVj(a.cliente).localeCompare(claveVj(b.cliente))
    || a.obra.localeCompare(b.obra) || a.placa.localeCompare(b.placa) || (Number(a.folio)||0) - (Number(b.folio)||0) || (a.fila||0) - (b.fila||0));
  const rep = {};
  todos.forEach(v => { if (v.folio) { const k = claveVj(v.obra) + '|' + v.folio; rep[k] = (rep[k]||0) + 1; } });
  const hayPrecios = Array.isArray(VJ.precios);
  todos.forEach(v => {
    v.avisos = [];
    if (v.duplicado || (v.folio && rep[claveVj(v.obra) + '|' + v.folio] > 1)) v.avisos.push('Folio repetido');
    if (!cat[v.placa]) v.avisos.push('Placa no está en el catálogo');
    if (!v.cliente) v.avisos.push('Sin cliente (la obra no está en el catálogo)');
    if (!v.m3) v.avisos.push('Sin m³');
    // Viajes a la planta: si no tienen precio en el Sheets van en $0 (son de la casa), sin aviso de "sin precio"
    v.precio = hayPrecios ? (precioVj(v, VJ.precios) ?? (v.planta ? 0 : null)) : null;
    v.importe = v.precio == null ? null : v.precio * v.m3;
  });
  return { cat, todos, lista:todos.filter(v => pasaVj(v)), hayPrecios };
}

// Suma viajes, m³ e importe agrupando por la clave que se le dé
function agruparVj(lista, clave) {
  const g = new Map();
  lista.forEach(v => {
    const k = clave(v);
    if (!g.has(k)) g.set(k, { k, viajes:0, m3:0, importe:0, sinPrecio:0, items:[] });
    const x = g.get(k); x.viajes++; x.m3 += v.m3; x.items.push(v);
    if (v.importe == null) x.sinPrecio++; else x.importe += v.importe;
  });
  return [...g.values()];
}
// "Tepetate 5 · Lodo 3"
const materialesVj = items => agruparVj(items, v => claveVj(v.material) || 'SIN MATERIAL')
  .sort((a,b) => b.viajes - a.viajes).map(x => `${x.items[0].material || 'Sin material'} ${x.viajes}`).join(' · ');
const fechaCorta = s => `${+s.slice(8,10)} ${MESES[+s.slice(5,7)-1].toLowerCase().slice(0,3)}`;
// Importe de un grupo: "$12,345" o "$12,345 + 3 sin precio"
const importeVj = x => x.sinPrecio === x.viajes ? '<span class="sinp">sin precio</span>'
  : $$(x.importe) + (x.sinPrecio ? ` <span class="sinp" title="Viajes sin precio en el Sheets de precios">+ ${x.sinPrecio} sin precio</span>` : '');

// Acumulado: un renglón por semana, mes o día ("3 al 7 nov" = del primer al último día con viajes)
function periodosVj(lista, agr) {
  const clave = agr === 'mes' ? v => v.fecha.slice(0, 7) : agr === 'dia' ? v => v.fecha : v => semanaVj(v.fecha).desde;
  return agruparVj(lista, clave).sort((a, b) => a.k.localeCompare(b.k)).map(x => {
    const fs = x.items.map(v => v.fecha).sort(), a = fs[0], b = fs[fs.length - 1];
    x.nombre = agr === 'mes' ? `${MESES[+x.k.slice(5, 7) - 1]} ${x.k.slice(0, 4)}`
      : agr === 'dia' ? `${diaNombre(x.k).slice(0, 3)} ${fechaCorta(x.k)}`
      : a === b ? `${diaNombre(a).slice(0, 3)} ${fechaCorta(a)}`
      : a.slice(5, 7) === b.slice(5, 7) ? `${+a.slice(8, 10)} al ${fechaCorta(b)}` : `${fechaCorta(a)} al ${fechaCorta(b)}`;
    return x;
  });
}

function renderViajes() {
  if (!VJ) return;
  const body = elVj('vj-body'), p = { per:elVj('vj-per').value, desde:VJ.desde, hasta:VJ.hasta }, titulo = tituloVj(p);
  if (!(VJ.viajes || []).length) {
    const ult = VJ.ultima && VJ.ultima < VJ.desde
      ? `<br>La última nota registrada es del <b>${VJ.ultima}</b>. <button class="ftb" onclick="irSemanaVj('${VJ.ultima}')">Ir a esa semana</button>` : '';
    body.innerHTML = `<div class="pn"><div class="pnh">${titulo}</div><div class="empty">Sin notas de viaje en este periodo${ult}</div></div>`;
    return;
  }
  const { cat, todos, lista, hayPrecios } = datosViajes();
  const tabla = (enc, filas, pie) => `<div class="tw"><table><thead><tr>${enc}</tr></thead><tbody>${filas}</tbody>${pie ? `<tfoot><tr>${pie}</tr></tfoot>` : ''}</table></div>`;
  const puestos = FILTROS_VJ.filter(([k]) => FV[k]);

  // Filtros plegados en una línea; lo que está puesto se ve como etiquetas aunque estén cerrados
  const filtros = `<details class="pn fil" ${FIL_VJ_ABIERTO ? 'open' : ''} ontoggle="FIL_VJ_ABIERTO = this.open">
      <summary class="pnh"><span>Filtros${puestos.length ? ` (${puestos.length})` : ''} · cliente, obra, chofer, placa, material, día, m³</span><span class="fl"></span></summary>
      <div class="vj-fil">${FILTROS_VJ.map(([k, n]) => `<label>${n}<select class="${FV[k] ? 'on' : ''}" onchange="filtrarVj('${k}', this.value)">
        <option value="">Todos</option>${opcionesVj(todos, k).map(o => `<option value="${esc(o.c)}" ${FV[k] === o.c ? 'selected' : ''}>${esc(o.t)} (${o.n})</option>`).join('')}</select></label>`).join('')}</div>
    </details>
    ${puestos.length ? `<div class="vj-chips" style="padding:0">${puestos.map(([k, n]) => `<button class="chip" onclick="filtrarVj('${k}', '')" title="Quitar este filtro">${n}: ${esc(textoFiltroVj(k, todos))} ✕</button>`).join('')}
      <button class="ftb" onclick="quitarFiltrosVj()">Quitar filtros</button>
      <span style="color:var(--muted)">${lista.length} de ${todos.length} viajes</span></div>` : ''}`;

  // Precios: si no se pudo leer el Sheets, o hay viajes sin precio
  const sinPrecio = hayPrecios ? agruparVj(lista.filter(v => v.precio == null), v => claveVj(v.cliente) + '|' + claveVj(v.material) + '|' + claveVj(v.obra)) : [];
  SINP_VJ = sinPrecio.sort((a, b) => b.viajes - a.viajes);
  const avisoPrecios = VJ.errPrecios ? `<div class="banner-dr">No se pudieron leer los precios: ${esc(VJ.errPrecios)}</div>`
    : sinPrecio.length ? `<details class="pn"><summary class="pnh"><span class="sinp">${nViajes(sinPrecio.reduce((s, x) => s + x.viajes, 0))} sin precio
        (${sinPrecio.length} combinación${sinPrecio.length !== 1 ? 'es' : ''} de obra y material sin precio)</span><span class="fl"></span></summary>
      ${tabla(`<th>Cliente</th><th>Obra</th><th>Material</th><th class="rt">Viajes</th><th class="rt">m³</th>${PUEDE_OBRAS ? '<th></th>' : ''}`,
        SINP_VJ.map((x, i) => `<tr><td>${esc(x.items[0].cliente) || '<span class="neg">Sin cliente</span>'}</td><td>${esc(x.items[0].obra)}</td>
          <td>${esc(x.items[0].material)}</td><td class="rt">${x.viajes}</td><td class="rt">${f0(x.m3)}</td>
          ${PUEDE_OBRAS ? `<td class="rt"><button class="ftb" onclick="Obras.ponerSinPrecio(${i})">${x.items[0].cliente ? 'Poner precio' : 'Iniciar obra'}</button></td>` : ''}</tr>`).join(''))}
      <div class="nota-pn">${PUEDE_OBRAS ? 'Con "Poner precio" se guarda el precio por m³ de ese material en esa obra. Si la obra no tiene cliente, primero hay que iniciarla.'
        : 'Los precios se ponen en Fletes › Obras y precios (pide el permiso "Obras y precios").'}</div></details>` : '';

  const vistas = vistasHtml('vistaVj', [['viajes', 'Viajes'], ['resumenes', 'Resúmenes'], ['acumulado', 'Acumulado']], VISTA_VJ);
  // Notas anuladas del periodo (no cuentan en nada): para ver cuáles son y poder restaurarlas
  const anul = VJ.anuladas || [];
  const anuladasHtml = anul.length ? `<details class="pn"><summary class="pnh"><span>Notas anuladas (${anul.length})</span><span class="fl"></span></summary>
      ${subTxt('No cuentan en Fletes ni en el Diario. Con ✏ se pueden restaurar.')}
      <div class="tw"><table><thead><tr><th>Fecha</th><th>Folio</th><th>Chofer</th><th>Placa</th><th>Obra</th><th class="rt">m³</th><th></th></tr></thead><tbody>
      ${anul.map(v => `<tr><td>${v.fecha}</td><td>${esc(v.folio) || '—'}</td><td>${esc(v.chofer) || '—'}</td><td>${esc(v.placa)}</td><td>${esc(v.obra)}</td>
        <td class="rt">${f0(v.m3)}</td><td>${EditNota.boton(v.fila)}</td></tr>`).join('')}</tbody></table></div></details>` : '';
  if (!lista.length) {
    body.innerHTML = vistas + filtros + `<div class="pn"><div class="pnh">${titulo}</div><div class="empty">Ningún viaje con estos filtros
      <br><button class="ftb" onclick="quitarFiltrosVj()">Quitar filtros</button></div></div>` + anuladasHtml;
    return;
  }
  const tot = agruparVj(lista, () => 'x')[0];
  const sinRevisar = lista.filter(v => !v.revisado).length;
  const sinFisica = lista.filter(v => !v.entregado).length;
  const conAviso = lista.filter(v => v.avisos.length);
  const camiones = new Set(lista.map(v => v.placa)).size;
  const porDia = agruparVj(lista, v => v.fecha);
  const porCli = agruparVj(lista, v => claveVj(v.cliente) + '|' + claveVj(v.obra)).sort((a,b) => b.m3 - a.m3);
  const porCam = agruparVj(lista, v => v.placa).sort((a,b) => b.viajes - a.viajes);
  const conImp = hayPrecios;      // columnas de importe solo si se leyó el Sheets de precios
  const thImp = conImp ? '<th class="rt">Importe</th>' : '', tdImp = x => conImp ? `<td class="rt">${importeVj(x)}</td>` : '';
  const pie = n => `<td colspan="${n}"><b>Total</b></td><td class="rt"><b>${tot.viajes}</b></td><td class="rt"><b>${f0(tot.m3)}</b></td>${conImp ? `<td class="rt"><b>${importeVj(tot)}</b></td>` : ''}`;

  const tarjetas = `<div class="mg">
      <div class="mc m"><div class="ml">Viajes</div><div class="mv">${lista.length}</div><div class="ms">${titulo}</div></div>
      <div class="mc"><div class="ml">m³ acarreados</div><div class="mv">${f0(tot.m3)}</div><div class="ms">${porDia.length} día${porDia.length!==1?'s':''} con viajes</div></div>
      ${conImp ? `<div class="mc"><div class="ml">Importe</div><div class="mv">${tot.sinPrecio === tot.viajes ? '—' : $$(tot.importe)}</div>
        <div class="ms">${tot.sinPrecio ? `<span class="sinp">${tot.sinPrecio} viaje${tot.sinPrecio !== 1 ? 's' : ''} sin precio</span>` : 'Todos con precio'}</div></div>` : ''}
      <div class="mc"><div class="ml">Camiones</div><div class="mv">${camiones}</div><div class="ms">${porCli.length} obra${porCli.length!==1?'s':''}</div></div>
      <div class="mc ${conAviso.length || sinRevisar ? 'r' : 'g'}"><div class="ml">Por revisar</div><div class="mv">${conAviso.length}</div>
        <div class="ms">${sinRevisar} sin revisar · ${sinFisica} sin nota física</div></div>
    </div>`;

  const panelCli = `<div class="pn"><div class="pnh">Por cliente y obra</div>
      ${subTxt('Viajes y m³ de cada obra, con los materiales que se llevaron.')}
      ${tabla(`<th>A nombre de</th><th>Obra</th><th>Material</th><th class="rt">Viajes</th><th class="rt">m³</th>${thImp}`,
        porCli.map(x => `<tr><td>${esc(x.items[0].cliente) || '<span class="neg">Sin cliente</span>'}</td><td>${esc(x.items[0].obra) || '—'}</td>
          <td style="color:var(--muted)">${esc(materialesVj(x.items))}</td><td class="rt">${x.viajes}</td><td class="rt amb">${f0(x.m3)}</td>${tdImp(x)}</tr>`).join(''),
        pie(3))}
    </div>`;

  // ── Vista Viajes: lo que hay que atender (notas con aviso) y la lista ──
  const vViajes = `
    ${conAviso.length ? `<div class="pn"><div class="pnh">Notas con aviso (${conAviso.length})</div>
      ${subTxt('Notas que hay que revisar: folio repetido, placa que no está en el catálogo, obra sin cliente o sin m³.')}
      ${tabla('<th>Fecha</th><th>Folio</th><th>Placa</th><th>Obra</th><th>Aviso</th><th></th>',
        conAviso.map(v => `<tr><td>${v.fecha}</td><td>${esc(v.folio) || '—'}</td><td>${esc(v.placa)}</td><td>${esc(v.obra)}</td>
          <td class="neg">${v.avisos.join(' · ')}</td><td>${EditNota.boton(v.fila)}</td></tr>`).join(''))}</div>` : ''}
    <div class="pn"><div class="pnh">Viajes <span style="color:var(--muted);font-weight:400">· última nota registrada ${VJ.ultima || '—'}</span></div>
      ${subTxt('Todas las notas del periodo, una por renglón (en rojo las que tienen aviso).')}
      ${tabla(`<th class="rt">#</th><th>Día</th><th>Fecha</th><th>Folio</th><th>Material</th><th>Obra</th><th>Placas</th><th class="rt">M3</th>${conImp ? '<th class="rt">$/m³</th><th class="rt">Importe</th>' : ''}<th>A nombre de</th><th>Chofer</th><th>Revisión</th><th>Foto</th><th></th>`,
        lista.map((v, i) => `<tr${v.avisos.length ? ' style="background:rgba(239,68,68,.08)"' : ''}>
          <td class="rt" style="color:var(--muted)">${i+1}</td><td>${diaVj(v.fecha)}</td><td>${v.fecha}</td><td>${esc(v.folio) || '—'}</td>
          <td>${esc(v.material)}</td><td>${esc(v.obra)}</td><td>${esc(v.placa)}</td><td class="rt">${f0(v.m3)}</td>
          ${conImp ? (v.precio == null ? '<td class="rt sinp">—</td><td class="rt sinp">sin precio</td>' : `<td class="rt">${$$(v.precio)}</td><td class="rt">${$$(v.importe)}</td>`) : ''}
          <td>${esc(v.cliente) || '—'}</td><td>${esc(v.chofer) || '—'}</td>
          <td>${v.planta ? '<span class="tag tb" title="Capturado en Registro › Compras; se corrige ahí">A la planta</span>'
            : `<span class="tag ${v.revisado ? 'tb' : 'tm'}">${v.revisado ? 'Revisado' : 'Pendiente'}</span>${v.entregado ? '' : ' <span class="tag ta" title="La nota en papel no se ha entregado">Sin física</span>'}`}</td>
          <td>${/^https:\/\/drive\.google\.com\//.test(v.foto) ? `<a href="${esc(v.foto)}" target="_blank" rel="noopener">Ver</a>` : '—'}</td>
          <td>${EditNota.boton(v.fila)}</td></tr>`).join(''),
        `<td colspan="7"><b>Total</b></td><td class="rt"><b>${f0(tot.m3)}</b></td>${conImp ? `<td></td><td class="rt"><b>${importeVj(tot)}</b></td>` : ''}<td colspan="5"></td>`)}
      <div class="nota-pn">Con ✏ se corrige una nota ya registrada (folio, fecha, chofer, obra, material, m³, placa) o se anula si quedó repetida.
        Los viajes "A la planta" (arena y grava para la planta de asfalto) se capturan y se corrigen en Registro de planta › Compras.</div>
      ${VJ.errPlanta ? `<div class="banner-dr">No se pudieron leer los viajes a la planta: ${esc(VJ.errPlanta)}</div>` : ''}
    </div>
    ${anuladasHtml}`;

  // ── Vista Resúmenes: por día, por cliente y obra, por camión ──
  const vResumenes = `
    <div class="two">
      <div class="pn"><div class="pnh">Por día</div>
        ${subTxt('Viajes y m³ de cada día, con los clientes de ese día.')}
        ${tabla(`<th>Día</th><th>Fecha</th><th>Clientes</th><th class="rt">Viajes</th><th class="rt">m³</th>${thImp}`,
          porDia.map(x => `<tr><td>${diaVj(x.k)}</td><td>${x.k}</td><td style="color:var(--muted)">${esc([...new Set(x.items.map(v => v.cliente || '—'))].join(', '))}</td>
            <td class="rt">${x.viajes}</td><td class="rt amb">${f0(x.m3)}</td>${tdImp(x)}</tr>`).join(''),
          pie(3))}
      </div>
      ${panelCli}
    </div>
    <div class="pn"><div class="pnh">Por camión</div>
      ${subTxt('Viajes y m³ de cada camión, con quién lo manejó y qué días trabajó.')}
      ${tabla(`<th>Placa</th><th>Camión</th><th>Chofer</th><th>Días</th><th class="rt">Viajes</th><th class="rt">m³</th>${thImp}`,
        porCam.map(x => `<tr><td class="amb">${esc(x.k)}</td><td>${cat[x.k] ? esc(cat[x.k].descripcion) : '<span class="neg">No está en el catálogo</span>'}</td>
          <td>${esc([...new Set(x.items.map(v => v.chofer).filter(Boolean))].join(', ')) || '—'}</td>
          <td style="color:var(--muted)">${p.per === 'semana' ? [...new Set(x.items.map(v => diaVj(v.fecha).slice(0,3)))].join(' ') : new Set(x.items.map(v => v.fecha)).size + ' días'}</td>
          <td class="rt">${x.viajes}</td><td class="rt amb">${f0(x.m3)}</td>${tdImp(x)}</tr>`).join(''),
        pie(4))}
    </div>`;

  // ── Vista Acumulado: un renglón por semana, mes o día, como el RESUMEN de cada cliente ──
  const mats = agruparVj(lista, v => claveVj(v.material) || 'SIN MATERIAL').sort((a, b) => b.m3 - a.m3);
  const per = periodosVj(lista, AGR_VJ);
  const celdasMat = items => mats.map(m => { const s = items.filter(v => (claveVj(v.material) || 'SIN MATERIAL') === m.k).reduce((a, v) => a + v.m3, 0); return `<td class="rt">${s ? f0(s) : '—'}</td>`; }).join('');
  const vAcumulado = `
    <div class="pn"><div class="pnh"><span>Acumulado ${puestos.length ? '· ' + esc(filtrosTxtVj(todos)) : ''}</span>
        <span class="vista">${[['semana', 'Por semana'], ['mes', 'Por mes'], ['dia', 'Por día']].map(([a, t]) =>
          `<button class="ftb ${AGR_VJ === a ? 'active' : ''}" onclick="agruparPorVj('${a}')">${t}</button>`).join('')}</span></div>
      ${subTxt('Lo que se lleva acumulado: m³ de cada material y monto por semana (o mes, o día). Para un cliente desde que empezó la obra, escógelo en Filtros y en el periodo "Desde – hasta" pon la fecha de inicio.')}
      ${tabla(`<th class="rt">#</th><th>${AGR_VJ === 'mes' ? 'Mes' : AGR_VJ === 'dia' ? 'Día' : 'Semana'}</th><th class="rt">Viajes</th>
          ${mats.map(m => `<th class="rt">${esc(m.items[0].material || 'Sin material')} m³</th>`).join('')}<th class="rt">Total m³</th>${thImp}`,
        per.map((x, i) => `<tr><td class="rt" style="color:var(--muted)">${i + 1}</td><td>${esc(x.nombre)}</td><td class="rt">${x.viajes}</td>
          ${celdasMat(x.items)}<td class="rt amb">${f0(x.m3)}</td>${tdImp(x)}</tr>`).join(''),
        `<td colspan="2"><b>Total</b></td><td class="rt"><b>${tot.viajes}</b></td>${mats.map(m => `<td class="rt"><b>${f0(m.m3)}</b></td>`).join('')}
          <td class="rt"><b>${f0(tot.m3)}</b></td>${conImp ? `<td class="rt"><b>${importeVj(tot)}</b></td>` : ''}`)}
    </div>
    ${panelCli}`;

  const c = (v, html) => `<div class="vista-c" data-v="${v}" ${VISTA_VJ === v ? '' : 'hidden'}>${html}</div>`;
  body.innerHTML = vistas + filtros + avisoPrecios + tarjetas + c('viajes', vViajes) + c('resumenes', vResumenes) + c('acumulado', vAcumulado);
}

// Mismo formato que la hoja de FLETES DE LA SEMANA (con lo filtrado), más los totales y el acumulado
async function excelViajes(btn) {
  if (!VJ) return;
  const { todos, lista, hayPrecios } = datosViajes();
  if (!lista.length) return alert('No hay viajes con estos filtros');
  btn.disabled = true;
  try {
    if (!window.XLSX) await cargarScript(XLSX_URL);
    const nombre = `${ddmmyy(VJ.desde)}-${ddmmyy(VJ.hasta)}`, fil = filtrosTxtVj(todos);
    const imp = v => hayPrecios ? [v.precio ?? '', v.importe ?? ''] : [];
    const filas = lista.map((v, i) => [i+1, diaVj(v.fecha), celdaFecha(v.fecha), v.folio, v.material.toUpperCase(), v.obra.toUpperCase(),
      v.placa, v.m3, v.cliente.toUpperCase(), v.chofer.toUpperCase(), ...imp(v)]);
    const totM3 = lista.reduce((s,v) => s + v.m3, 0), totImp = lista.reduce((s, v) => s + (v.importe || 0), 0);
    const hoja = XLSX.utils.aoa_to_sheet([['', 'FLETES ' + tituloVj({ per:elVj('vj-per').value, desde:VJ.desde, hasta:VJ.hasta }).toUpperCase()], fil ? ['', fil] : [],
      ['CONSECUTIVO','DIA','FECHA','FOLIO','MATERIAL','OBRA','PLACAS','M3','A NOMBRE DE','CHOFER', ...(hayPrecios ? ['PRECIO M3','IMPORTE'] : [])], ...filas,
      [], ['', '', '', '', '', '', 'TOTAL', totM3, '', '', ...(hayPrecios ? ['', totImp] : [])]]);
    hoja['!cols'] = [12,11,11,9,16,16,10,6,20,18,10,12].map(wch => ({ wch }));
    const im = x => hayPrecios ? [x.importe] : [];
    const tot = [['POR DÍA'], ['DIA','FECHA','VIAJES','M3', ...(hayPrecios ? ['IMPORTE'] : [])],
      ...agruparVj(lista, v => v.fecha).map(x => [diaVj(x.k), celdaFecha(x.k), x.viajes, x.m3, ...im(x)]), [],
      ['POR CLIENTE Y OBRA'], ['A NOMBRE DE','OBRA','MATERIAL','VIAJES','M3', ...(hayPrecios ? ['IMPORTE'] : [])],
      ...agruparVj(lista, v => claveVj(v.cliente) + '|' + claveVj(v.obra)).map(x => [x.items[0].cliente.toUpperCase(), x.items[0].obra.toUpperCase(), materialesVj(x.items), x.viajes, x.m3, ...im(x)]), [],
      ['POR CAMIÓN'], ['PLACA','CHOFER','VIAJES','M3', ...(hayPrecios ? ['IMPORTE'] : [])],
      ...agruparVj(lista, v => v.placa).map(x => [x.k, [...new Set(x.items.map(v => v.chofer).filter(Boolean))].join(', '), x.viajes, x.m3, ...im(x)])];
    const hoja2 = XLSX.utils.aoa_to_sheet(tot);
    hoja2['!cols'] = [22,16,30,8,8,12].map(wch => ({ wch }));
    // Acumulado como el RESUMEN de cada cliente: un renglón por semana (o mes / día, lo que esté escogido)
    const mats = agruparVj(lista, v => claveVj(v.material) || 'SIN MATERIAL').sort((a, b) => b.m3 - a.m3);
    const per = periodosVj(lista, AGR_VJ);
    const hoja3 = XLSX.utils.aoa_to_sheet([['ACUMULADO' + (fil ? ' · ' + fil.toUpperCase() : '')], [],
      ['N°', AGR_VJ === 'mes' ? 'MES' : AGR_VJ === 'dia' ? 'DÍA' : 'SEMANA', 'VIAJES', ...mats.map(m => (m.items[0].material || 'SIN MATERIAL').toUpperCase() + ' M3'), 'TOTAL M3', ...(hayPrecios ? ['MONTO'] : [])],
      ...per.map((x, i) => [i + 1, x.nombre.toUpperCase(), x.viajes, ...mats.map(m => x.items.filter(v => (claveVj(v.material) || 'SIN MATERIAL') === m.k).reduce((a, v) => a + v.m3, 0)), x.m3, ...im(x)]),
      ['', 'TOTAL', lista.length, ...mats.map(m => m.m3), totM3, ...(hayPrecios ? [totImp] : [])]]);
    hoja3['!cols'] = [5, 22, 8, ...mats.map(() => 14), 10, 14].map(wch => ({ wch }));
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, nombre);
    XLSX.utils.book_append_sheet(libro, hoja2, 'TOTALES');
    XLSX.utils.book_append_sheet(libro, hoja3, 'ACUMULADO');
    const cliTxt = FV.cliente ? ' ' + textoFiltroVj('cliente', todos) : '';
    XLSX.writeFile(libro, `FLETES ${nombre}${cliTxt}.xlsx`.replace(/[\\/:*?"<>|]/g, ''));
  } catch(e) { alert('No se pudo generar el Excel: ' + e.message); }
  finally { btn.disabled = false; }
}

function whatsViajes() {
  if (!VJ) return;
  const { todos, lista } = datosViajes();
  if (!lista.length) return alert('No hay viajes con estos filtros');
  const m3 = lista.reduce((s,v) => s + v.m3, 0), fil = filtrosTxtVj(todos);
  const avisos = lista.filter(v => v.avisos.length).length;
  const texto = [
    `*Fletes — ${tituloVj({ per:elVj('vj-per').value, desde:VJ.desde, hasta:VJ.hasta })}*${fil ? `\n${fil}` : ''}`,
    `Total: ${nViajes(lista.length)} · ${f0(m3)} m³`,
    '', '*Por día*',
    ...agruparVj(lista, v => v.fecha).map(x => `• ${diaVj(x.k).charAt(0) + diaVj(x.k).slice(1).toLowerCase()} ${+x.k.slice(8,10)}: ${nViajes(x.viajes)} · ${f0(x.m3)} m³`),
    '', '*Por cliente*',
    ...agruparVj(lista, v => claveVj(v.cliente) + '|' + claveVj(v.obra)).sort((a,b) => b.m3 - a.m3)
      .map(x => `• ${x.items[0].cliente || 'Sin cliente'} (${x.items[0].obra || 'sin obra'}): ${nViajes(x.viajes)} · ${f0(x.m3)} m³ — ${materialesVj(x.items)}`),
    ...(avisos ? ['', `⚠️ ${avisos} nota${avisos!==1?'s':''} con aviso por revisar`] : []),
  ].join('\n');
  window.open(`https://wa.me/${WA_NUM}?text=` + encodeURIComponent(texto), '_blank');
}

// ══════════════════════════════════════════
//  OBRAS Y PRECIOS (Fletes › Obras y precios; permiso obras)
//  Iniciar una obra (cliente, nombre, inicio y precio por m³ de cada material) y poner o cambiar precios
//  sin abrir los Sheets. Cambiar un precio no borra el anterior: el nuevo vale desde la fecha que se ponga.
// ══════════════════════════════════════════
let PUEDE_OBRAS = false, SINP_VJ = [];
const Obras = (() => {
  let D = null, ov = null, aviso = '';
  const fechaLarga = s => `${fechaCorta(s)} ${s.slice(0, 4)}`;
  // Precios que aplican a una obra: los suyos y los generales del cliente (obra vacía), por material y por fecha
  const preciosDe = (cliente, obra) => (D.precios || []).filter(p => claveVj(p.cliente) === claveVj(cliente) && (!p.obra || claveVj(p.obra) === claveVj(obra)));
  function porMaterial(lista) {
    const m = new Map();
    lista.forEach(p => { const k = claveVj(p.material); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
    return [...m.values()].map(ps => ps.sort((a, b) => (a.desde || '').localeCompare(b.desde || '') || (a.obra ? 1 : 0) - (b.obra ? 1 : 0)))
      .sort((a, b) => a[0].material.localeCompare(b[0].material, 'es'));
  }
  const obrasOrden = () => (D.obras || []).slice().sort((a, b) => a.cliente.localeCompare(b.cliente, 'es') || a.obra.localeCompare(b.obra, 'es'));
  const cuerpo = () => ov.querySelector('.ob-cuerpo');
  const pintar = html => { cuerpo().innerHTML = html; cuerpo().scrollTop = 0; ov.querySelector('.dlg-c').scrollTop = 0; };
  const listas = () => `<datalist id="ob-cli">${[...new Set((D.obras || []).map(o => o.cliente).filter(Boolean))].sort().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="ob-mat">${(D.materiales || []).map(m => `<option value="${esc(m)}">`).join('')}</datalist>`;

  // ── Lista: cada obra con sus precios ──
  function lista() {
    const obras = obrasOrden();
    const tarjeta = (o, i) => {
      const mats = porMaterial(preciosDe(o.cliente, o.obra));
      return `<div class="ob-o"><div class="ob-h"><span><b>${esc(o.obra)}</b> <small>· ${esc(o.cliente) || 'sin cliente'}${o.inicio ? ' · inició el ' + fechaLarga(o.inicio) : ''}</small></span>
          <button class="ftb" data-a="precio" data-i="${i}">Agregar precio</button></div>
        ${mats.length ? `<div class="tw"><table><thead><tr><th>Material</th><th>Precio por m³</th><th></th></tr></thead><tbody>
          ${mats.map(ps => `<tr><td>${esc(ps[0].material)}</td><td>${ps.map(p => `<div>${$$(p.precio)} <span style="color:var(--muted)">· ${p.desde ? 'desde el ' + fechaLarga(p.desde) : 'siempre'}${p.obra ? '' : ' · todas las obras del cliente'}</span></div>`).join('')}</td>
            <td class="rt"><button class="btn-ed" data-a="cambiar" data-i="${i}" data-m="${esc(ps[0].material)}" title="Cambiar el precio de ${esc(ps[0].material)}">Cambiar</button></td></tr>`).join('')}
          </tbody></table></div>` : '<div class="ob-vacio">Sin precios: sus viajes salen "sin precio" en Fletes.</div>'}</div>`;
    };
    pintar(`${aviso ? `<div class="ob-ok">${aviso}</div>` : ''}
      <div class="ed-info">Cada obra con su cliente y su precio por m³ de cada material. Cambiar un precio no borra el anterior: el nuevo cuenta desde la fecha que pongas.</div>
      <div style="margin-bottom:12px"><button class="ftb p" data-a="iniciar">Iniciar obra</button></div>
      ${obras.length ? obras.map(tarjeta).join('') : '<div class="ob-vacio">Todavía no hay obras.</div>'}
      <div class="dlg-b"><button class="ftb" data-a="cerrar">Cerrar</button></div>`);
    aviso = '';
  }

  // ── Iniciar obra ──
  const renglonPrecio = (m = '') => `<div class="ob-p"><input class="ci" data-p="material" list="ob-mat" placeholder="Material" maxlength="60" value="${esc(m)}">
    <input class="ci" data-p="precio" type="number" step="0.01" min="0" placeholder="$ por m³"></div>`;
  function iniciar(pre = {}) {
    pintar(`<div class="ed-info"><b>Iniciar obra</b><br>Con esto la obra sale en la lista al subir notas y sus viajes salen a nombre del cliente.
        Pon el precio por m³ de los materiales que ya sepas; los demás se pueden poner después.</div>
      <div class="ed-g">
        <label>Cliente<input class="ci" data-k="cliente" list="ob-cli" maxlength="60" value="${esc(pre.cliente || '')}" placeholder="Escoge o escribe"></label>
        <label>Fecha de inicio<input class="ci" data-k="inicio" type="date" value="${esc(pre.inicio || txtFecha(new Date()))}"></label>
        <label class="w2">Nombre de la obra<input class="ci" data-k="obra" maxlength="80" value="${esc(pre.obra || '')}" placeholder="Ej. Calle Francisco Villa - Tezoyuca"></label>
      </div>
      <div class="ed-info" style="margin-bottom:6px">Precio por m³</div>
      <div id="ob-precios">${(pre.materiales || ['', '', '']).map(m => renglonPrecio(m)).join('')}</div>
      <div style="margin:4px 0 16px"><button class="ftb" data-a="otro">+ Otro material</button></div>
      ${listas()}
      <div class="dlg-b"><button class="ftb" data-a="volver">Cancelar</button><button class="ftb p" data-a="guardarObra">Guardar obra</button></div>`);
    cuerpo().querySelector(`[data-k="${pre.cliente ? 'obra' : 'cliente'}"]`).focus();
  }
  async function guardarObra(btn) {
    const v = k => cuerpo().querySelector(`[data-k="${k}"]`).value.trim();
    const datos = { cliente:v('cliente'), obra:v('obra'), inicio:v('inicio'), precios:[] };
    if (!datos.cliente) return alert('Escribe el cliente.');
    if (!datos.obra) return alert('Escribe el nombre de la obra.');
    const ya = (D.obras || []).find(o => claveVj(o.obra) === claveVj(datos.obra));
    if (ya) return alert(`Ya existe la obra "${ya.obra}" (de ${ya.cliente || 'sin cliente'}). Usa otro nombre, por ejemplo con la calle o la colonia.`);
    for (const r of cuerpo().querySelectorAll('.ob-p')) {
      const m = r.querySelector('[data-p=material]').value.trim(), p = r.querySelector('[data-p=precio]').value.trim();
      if (!m && !p) continue;
      if (!m) return alert('Falta el material del precio $' + p + '.');
      if (!(Number(p) > 0)) return alert(`Escribe el precio por m³ de ${m}.`);
      if (datos.precios.some(x => claveVj(x.material) === claveVj(m))) return alert(`${m} está dos veces.`);
      datos.precios.push({ material:m, precio:Number(p) });
    }
    const txt = `Iniciar la obra "${datos.obra}" de ${datos.cliente}${datos.inicio ? ', desde el ' + fechaLarga(datos.inicio) : ''}.\n\n`
      + (datos.precios.length ? 'Precios por m³:\n' + datos.precios.map(p => `${p.material}: ${$$(p.precio)}`).join('\n') : 'Sin precios por ahora.') + '\n\n¿Guardar?';
    if (!(await preguntar(txt, 'Sí, guardar'))) return;
    await enviar(btn, { action:'obra_guardar', datos }, r => `Obra "${esc(datos.obra)}" iniciada.`
      + (r.materialesNuevos?.length ? ` Se agregó al catálogo de materiales: ${esc(r.materialesNuevos.join(', '))}.` : '')
      + ' En la lista de obras al subir notas sale en unos minutos.');
  }

  // ── Poner o cambiar un precio ──
  function precio(o, material = '', desde = '') {
    pintar(`<div class="ed-info"><b>Precio para ${esc(o.obra)}</b> · ${esc(o.cliente)}</div>
      <div class="ed-g">
        <label class="w2">Material<input class="ci" data-k="material" list="ob-mat" maxlength="60" value="${esc(material)}" placeholder="Escoge o escribe"></label>
        <label>Precio por m³ ($)<input class="ci" data-k="precio" type="number" step="0.01" min="0"></label>
        <label>Vale desde<input class="ci" data-k="desde" type="date"></label>
      </div>
      <div class="ed-info ob-hint"></div>
      ${listas()}
      <div class="dlg-b"><button class="ftb" data-a="volver">Cancelar</button><button class="ftb p" data-a="guardarPrecio">Guardar precio</button></div>`);
    cuerpo().dataset.obra = o.obra; cuerpo().dataset.cliente = o.cliente;
    // Si ya tiene precio, el nuevo lleva fecha (hoy, o la del primer viaje sin precio); si no, vale para todos
    cuerpo().querySelector('[data-k=desde]').value = existentes(o, material).length ? (desde || txtFecha(new Date())) : '';
    pista();
    cuerpo().querySelector(`[data-k="${material ? 'precio' : 'material'}"]`).focus();
  }
  const existentes = (o, material) => material ? preciosDe(o.cliente, o.obra).filter(p => claveVj(p.material) === claveVj(material)) : [];
  const actual = () => ({ obra:cuerpo().dataset.obra, cliente:cuerpo().dataset.cliente });
  function pista() {
    const el = cuerpo().querySelector('.ob-hint');
    if (!el) return;
    const v = k => cuerpo().querySelector(`[data-k="${k}"]`).value.trim();
    const o = actual(), m = v('material'), desde = v('desde'), ps = existentes(o, m);
    const igual = ps.find(p => claveVj(p.obra) === claveVj(o.obra) && (p.desde || '') === desde);
    el.innerHTML = !m ? 'Escoge el material.'
      : igual ? `Ya hay un precio de ${esc(m)} ${desde ? 'desde el ' + fechaLarga(desde) : 'para todos los viajes'} (${$$(igual.precio)}): se corrige ese.`
      : ps.length ? `Ahora: ${ps.map(p => `${$$(p.precio)} ${p.desde ? 'desde el ' + fechaLarga(p.desde) : 'siempre'}`).join(', ')}.
          ${desde ? `El nuevo cuenta para los viajes desde el ${fechaLarga(desde)}; los de antes siguen con su precio.` : '<span class="sinp">Sin fecha, el nuevo cuenta para todos los viajes de esta obra, también los de antes.</span>'}`
      : desde ? `Es el primer precio de ${esc(m)} en esta obra. Los viajes de antes del ${fechaLarga(desde)} se quedan sin precio.`
      : `Es el primer precio de ${esc(m)} en esta obra: cuenta para todos sus viajes, también los de antes. Si solo debe contar desde una fecha, ponla.`;
  }
  async function guardarPrecio(btn) {
    const v = k => cuerpo().querySelector(`[data-k="${k}"]`).value.trim();
    const o = actual(), datos = { cliente:o.cliente, obra:o.obra, material:v('material'), precio:Number(v('precio')), desde:v('desde') };
    if (!datos.material) return alert('Escoge o escribe el material.');
    if (!(datos.precio > 0)) return alert('Escribe el precio por m³.');
    if (!(await preguntar(`${datos.material} en ${o.obra}: ${$$(datos.precio)} por m³, ${datos.desde ? 'desde el ' + fechaLarga(datos.desde) : 'para todos sus viajes'}.\n\n¿Guardar?`, 'Sí, guardar'))) return;
    await enviar(btn, { action:'precio_guardar', datos }, r => `${r.como === 'corregido' ? 'Precio corregido' : 'Precio guardado'}: ${esc(datos.material)} en ${esc(o.obra)}, ${$$(datos.precio)} por m³.`
      + (r.materialesNuevos?.length ? ` Se agregó al catálogo de materiales: ${esc(r.materialesNuevos.join(', '))}.` : ''));
  }

  async function enviar(btn, body, okTxt) {
    ov.querySelectorAll('button').forEach(b => b.disabled = true);
    const t = btn.textContent; btn.textContent = 'Guardando…'; bar(true);
    try {
      const r = await api(body);
      D = r; aviso = okTxt(r);
      lista();
      // Fletes vuelve a leer: los precios llegan con los viajes
      Object.keys(VJ_CACHE).forEach(k => delete VJ_CACHE[k]);
      if (seccionVisible('fletes')) cargarViajes(true);
    } catch(e) {
      ov.querySelectorAll('button').forEach(b => b.disabled = false); btn.textContent = t;
      alert('No se guardó: ' + e.message);
    } finally { bar(false); }
  }

  function cerrar() { ov?.remove(); ov = null; removeEventListener('keydown', tecla, true); }
  function tecla(e) { if (e.key === 'Escape' && document.querySelectorAll('.dlg').length === 1) { e.preventDefault(); cerrar(); } }
  // abrir() = la lista; abrir({ cliente, obra, material, desde }) = directo a poner ese precio (desde Fletes, viajes sin precio)
  async function abrir(ir) {
    cerrar();
    ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c ed ob" role="dialog"><div class="dlg-t" style="margin-bottom:8px"><b>Obras y precios</b></div>
      <div class="ob-cuerpo"><div class="ob-vacio">Leyendo obras y precios…</div></div></div>`;
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
      const a = b.dataset.a, o = obrasOrden()[Number(b.dataset.i)];
      if (a === 'cerrar') cerrar();
      else if (a === 'volver') lista();
      else if (a === 'iniciar') iniciar();
      else if (a === 'otro') cuerpo().querySelector('#ob-precios').insertAdjacentHTML('beforeend', renglonPrecio());
      else if (a === 'precio') precio(o);
      else if (a === 'cambiar') precio(o, b.dataset.m);
      else if (a === 'guardarObra') guardarObra(b);
      else if (a === 'guardarPrecio') guardarPrecio(b);
    });
    ov.addEventListener('input', () => pista());
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    bar(true);
    try { D = await api({ action:'obras_lista' }); }
    catch(e) { if (ov) pintar(`<div class="ob-vacio">No se pudieron leer las obras: ${esc(e.message)}</div><div class="dlg-b"><button class="ftb" data-a="cerrar">Cerrar</button></div>`); return; }
    finally { bar(false); }
    if (!ov) return;
    if (!ir) return lista();
    const o = (D.obras || []).find(x => claveVj(x.obra) === claveVj(ir.obra));
    // Obra que no está en el catálogo (sus viajes salen sin cliente): se inicia con ese nombre
    if (!o || !ir.cliente) return iniciar({ obra:ir.obra, materiales:[ir.material || ''] });
    precio(o, ir.material || '', ir.desde);
  }
  // Botón "Poner precio" del aviso de viajes sin precio
  const ponerSinPrecio = i => { const x = SINP_VJ[i]; if (x) abrir({ cliente:x.items[0].cliente, obra:x.items[0].obra, material:x.items[0].material,
    desde:x.items.map(v => v.fecha).sort()[0] }); };
  return { abrir, ponerSinPrecio };
})();

// ══════════════════════════════════════════
//  CONCILIACIONES POR OBRA (Fletes › Conciliaciones; permiso obras)
//  Una conciliación = los viajes de una obra entre dos fechas con su precio por m³. Se registra (número que sigue,
//  viajes, m³ e importe) y se descarga en Excel con el formato de siempre: encabezado de la obra, la tabla, los
//  totales y las firmas. Si después cambia una nota o un precio de esas fechas, aquí se avisa que ya no cuadra.
// ══════════════════════════════════════════
const EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
const Conc = (() => {
  let D = null, V = null, ov = null, obraK = '', aviso = '', ultimo = null;
  const DIAS_ATRAS = 365;                 // se leen los viajes del último año
  const fechaLarga = s => `${fechaCorta(s)} ${s.slice(0, 4)}`;
  const masDias = (s, n) => { const d = fechaLocal(s); d.setDate(d.getDate() + n); return txtFecha(d); };
  const r2 = x => Math.round(x * 100) / 100;
  const obrasOrden = () => (D.obras || []).slice().sort((a, b) => a.obra.localeCompare(b.obra, 'es'));
  const obraSel = () => (D.obras || []).find(o => claveVj(o.obra) === obraK);
  const concDe = o => (D.conc || []).filter(c => claveVj(c.obra) === claveVj(o.obra)).sort((a, b) => a.n - b.n);
  // Viajes de la obra con su precio e importe, en el orden de la conciliación (fecha, folio)
  function viajesDe(o, desde = '', hasta = '9999') {
    return (V.viajes || []).filter(v => !v.planta && claveVj(v.obra) === claveVj(o.obra) && v.fecha >= desde && v.fecha <= hasta)
      .map(v => { const precio = precioVj(v, V.precios); return { ...v, precio, importe:precio == null ? null : precio * N(v.m3) }; })
      .sort((a, b) => a.fecha.localeCompare(b.fecha) || (Number(a.folio) || 0) - (Number(b.folio) || 0)
        || String(a.folio).localeCompare(String(b.folio)) || a.placa.localeCompare(b.placa));
  }
  const suma = vs => ({ viajes:vs.length, m3:vs.reduce((s, v) => s + N(v.m3), 0), importe:r2(vs.reduce((s, v) => s + (v.importe || 0), 0)),
                        sinPrecio:vs.filter(v => v.importe == null) });
  // Cómo suma ahora una conciliación ya registrada (null si es de antes de lo que se leyó)
  const ahora = (o, c) => c.desde < V.desde ? null : suma(viajesDe(o, c.desde, c.hasta));
  const cuadra = (c, a) => !a || (a.viajes === c.viajes && Math.abs(a.importe - c.importe) < 0.01 && Math.abs(a.m3 - c.m3) < 0.01);
  // Encabezado y firmas: lo guardado o, si falta, el nombre de la obra y del cliente
  const datos = o => ({ enc1:o.enc1 || '', enc2:o.enc2 || '', enc3:o.enc3 || o.obra.toUpperCase(), entrega:o.entrega || '', recibe:o.recibe || (o.cliente || '').toUpperCase() });
  const sinDatos = o => !o.enc1 && !o.enc2 && !o.enc3 && !o.entrega && !o.recibe;
  // DEL 09 AL 14 DE NOVIEMBRE · DEL 26 DE OCTUBRE AL 01 DE NOVIEMBRE
  function periodoTxt(a, b) {
    const mes = s => MESES[+s.slice(5, 7) - 1], otroAnio = a.slice(0, 4) !== b.slice(0, 4);
    if (a.slice(0, 7) === b.slice(0, 7)) return `DEL ${a.slice(8)} AL ${b.slice(8)} DE ${mes(b)}`;
    return `DEL ${a.slice(8)} DE ${mes(a)}${otroAnio ? ' ' + a.slice(0, 4) : ''} AL ${b.slice(8)} DE ${mes(b)}${otroAnio ? ' ' + b.slice(0, 4) : ''}`;
  }
  const periodoCorto = c => `${fechaCorta(c.desde)} – ${c.hasta.slice(0, 4) === txtFecha(new Date()).slice(0, 4) ? fechaCorta(c.hasta) : fechaLarga(c.hasta)}`;

  const cuerpo = () => ov.querySelector('.ob-cuerpo');
  const pintar = html => { cuerpo().innerHTML = html; };
  const valor = k => cuerpo().querySelector(`[data-k="${k}"]`)?.value.trim() || '';

  // ── La obra escogida: encabezado, sus conciliaciones y la nueva ──
  function principal() {
    const obras = obrasOrden(), o = obraSel();
    if (!o) return pintar(`<div class="ob-vacio">Todavía no hay obras.</div><div class="dlg-b"><button class="ftb" data-a="cerrar">Cerrar</button></div>`);
    const cs = concDe(o), dd = datos(o), todos = viajesDe(o);
    const ult = cs.length ? cs[cs.length - 1] : null, sigN = ult ? ult.n + 1 : 1;
    const enAlguna = v => cs.some(c => v.fecha >= c.desde && v.fecha <= c.hasta);
    const huecos = todos.filter(v => !enAlguna(v) && ult && v.fecha < ult.hasta);   // quedaron fuera, entre conciliaciones
    const pend = todos.filter(v => !ult || v.fecha > ult.hasta);
    const desde0 = ult ? masDias(ult.hasta, 1) : (pend[0]?.fecha || txtFecha(new Date()));
    let hasta0 = pend.length ? pend[pend.length - 1].fecha : txtFecha(new Date());
    if (hasta0 < desde0) hasta0 = desde0;
    const tot = cs.reduce((s, c) => ({ viajes:s.viajes + c.viajes, m3:s.m3 + c.m3, importe:s.importe + c.importe }), { viajes:0, m3:0, importe:0 });

    pintar(`${aviso ? `<div class="ob-ok">${aviso}</div>` : ''}
      <label class="cc-obra">Obra<select class="ci" data-k="obra">${obras.map(x => `<option value="${esc(claveVj(x.obra))}" ${claveVj(x.obra) === obraK ? 'selected' : ''}>${esc(x.obra)} · ${esc(x.cliente || 'sin cliente')}</option>`).join('')}</select></label>

      <div class="ob-o"><div class="ob-h"><span><b>Encabezado y firmas</b> <small>· así sale arriba y abajo de cada conciliación</small></span>
          <button class="ftb" data-a="datos">Cambiar</button></div>
        <div class="cc-pad">${[dd.enc1, dd.enc2, dd.enc3].filter(Boolean).map(esc).join('<br>')}
          <br><small>Entrega: ${esc(dd.entrega) || '—'} · Recibe: ${esc(dd.recibe) || '—'}</small>
          ${sinDatos(o) ? '<div class="sinp">Todavía no se ha puesto: revisa que esté bien antes de sacar la conciliación.</div>' : ''}</div></div>

      <div class="ob-o"><div class="ob-h"><b>Conciliaciones entregadas</b>
          ${cs.length ? '<button class="ftb" data-a="resumen">Descargar resumen</button>' : ''}</div>
        ${cs.length ? `<div class="tw"><table class="cc-t"><thead><tr><th>N°</th><th>Periodo</th><th class="rt">Viajes</th><th class="rt cc-m3">m³</th><th class="rt">Importe</th><th></th></tr></thead><tbody>
          ${cs.map(c => { const a = ahora(o, c); return `<tr><td>${c.n}</td><td>${periodoCorto(c)}</td><td class="rt">${c.viajes}</td><td class="rt cc-m3">${f0(c.m3)}</td><td class="rt">${$$(c.importe)}</td>
              <td class="rt"><button class="btn-ed" data-a="bajar" data-n="${c.n}" title="Descargar la conciliación ${c.n} en Excel">Excel</button></td></tr>
            ${cuadra(c, a) ? '' : `<tr class="cc-dif"><td></td><td colspan="5" class="sinp">Ahora suma ${nViajes(a.viajes)}, ${f0(a.m3)} m³, ${$$(a.importe)}: cambió una nota o un precio de esas fechas después de entregarla.</td></tr>`}`; }).join('')}
          <tr><td></td><td><b>Total</b></td><td class="rt"><b>${tot.viajes}</b></td><td class="rt cc-m3"><b>${f0(tot.m3)}</b></td><td class="rt"><b>${$$(tot.importe)}</b></td><td></td></tr>
          </tbody></table></div>
          <div class="cc-pad"><button class="btn-ed" data-a="quitar" data-n="${ult.n}">Quitar la conciliación ${ult.n}</button> <small>(solo la última, si se registró por error)</small></div>`
        : '<div class="ob-vacio">Todavía no hay conciliaciones de esta obra.</div>'}
        ${huecos.length ? `<div class="cc-pad sinp">${nViajes(huecos.length)} de esta obra no ${huecos.length === 1 ? 'está' : 'están'} en ninguna conciliación: ${[...new Set(huecos.map(v => fechaCorta(v.fecha)))].join(', ')}.</div>` : ''}
      </div>

      <div class="ob-o"><div class="ob-h"><b>Nueva: conciliación ${sigN}</b></div>
        <div class="cc-pad">
          <div class="ed-g"><label>Desde<input class="ci" type="date" data-k="desde" value="${desde0}"></label>
            <label>Hasta<input class="ci" type="date" data-k="hasta" value="${hasta0}"></label></div>
          <div class="cc-prev"></div>
          <button class="ftb p" data-a="guardar">Guardar y descargar</button>
        </div></div>
      <div class="dlg-b"><button class="ftb" data-a="cerrar">Cerrar</button></div>`);
    aviso = '';
    previa();
  }

  // Lo que llevaría la nueva, y si hay algo que impide sacarla
  function revisar() {
    const o = obraSel(), desde = valor('desde'), hasta = valor('hasta');
    if (!desde || !hasta) return { error:'Pon las dos fechas.' };
    if (desde > hasta) return { error:'La fecha "desde" va antes que "hasta".' };
    if (desde < V.desde) return { error:`Solo se pueden sacar conciliaciones desde el ${fechaLarga(V.desde)}.` };
    const choca = concDe(o).find(c => !(hasta < c.desde || desde > c.hasta));
    if (choca) return { error:`Esas fechas se cruzan con la conciliación ${choca.n} (${periodoCorto(choca)}).` };
    const vs = viajesDe(o, desde, hasta), s = suma(vs);
    if (!vs.length) return { error:'No hay viajes de esta obra en esas fechas.' };
    if (s.sinPrecio.length) return { error:`${nViajes(s.sinPrecio.length)} sin precio: ponles precio en Obras y precios antes de sacar la conciliación.`, sinPrecio:s.sinPrecio };
    return { o, desde, hasta, vs, s };
  }
  function previa() {
    const el = cuerpo().querySelector('.cc-prev'), btn = cuerpo().querySelector('[data-a=guardar]');
    if (!el) return;
    const r = revisar();
    btn.disabled = !!r.error;
    if (r.error) {
      const mats = r.sinPrecio ? [...new Map(r.sinPrecio.map(v => [claveVj(v.material), v])).values()] : [];
      el.innerHTML = `<div class="sinp">${esc(r.error)}</div>` + mats.map(v => `<div>${esc(v.material || '(sin material)')} <button class="btn-ed" data-a="precio" data-m="${esc(v.material)}" data-f="${v.fecha}">Poner precio</button></div>`).join('');
      return;
    }
    const porMat = agruparVj(r.vs, v => v.material || '(sin material)').sort((a, b) => b.importe - a.importe);
    el.innerHTML = `<div><b>${nViajes(r.s.viajes)} · ${f0(r.s.m3)} m³ · ${$$(r.s.importe)}</b></div>
      ${porMat.map(g => `<div style="color:var(--muted)">${esc(g.k)}: ${nViajes(g.viajes)}, ${f0(g.m3)} m³, ${$$(g.importe)}</div>`).join('')}`;
  }

  async function guardar(btn) {
    const r = revisar();
    if (r.error) return alert(r.error);
    const sigN = (concDe(r.o).slice(-1)[0]?.n || 0) + 1;
    if (!(await preguntar(`Conciliación ${sigN} de ${r.o.obra}\n${periodoTxt(r.desde, r.hasta).toLowerCase()}\n\n${nViajes(r.s.viajes)} · ${f0(r.s.m3)} m³ · ${$$(r.s.importe)}\n\nSe registra con ese número y se descarga el Excel. ¿Continuar?`, 'Sí, guardar y descargar'))) return;
    const res = await enviar(btn, { action:'conc_guardar', datos:{ obra:r.o.obra, desde:r.desde, hasta:r.hasta, viajes:r.s.viajes, m3:r.s.m3, importe:r.s.importe } });
    if (!res) return;
    const o = obraSel(), c = concDe(o).find(x => x.n === res.n);
    try { await bajar(await excelConc(o, c)); aviso = `Conciliación ${res.n} guardada y descargada.`; }
    catch(e) { aviso = `Conciliación ${res.n} guardada, pero no se pudo armar el Excel (${esc(e.message)}). Descárgala con su botón.`; }
    principal();
  }
  async function quitar(btn, n) {
    const o = obraSel(), c = concDe(o).find(x => x.n === n);
    if (!c || !(await preguntar(`Quitar la conciliación ${n} de ${o.obra} (${periodoCorto(c)}, ${$$(c.importe)}).\n\nSolo hazlo si se registró por error: la siguiente que saques llevará otra vez el número ${n}.`, 'Sí, quitarla'))) return;
    if (await enviar(btn, { action:'conc_quitar', datos:{ obra:o.obra, n } })) { aviso = `Se quitó la conciliación ${n}.`; principal(); }
  }

  // ── Encabezado y firmas de la obra ──
  function formDatos() {
    const o = obraSel(), dd = datos(o);
    const campo = (k, t, ph) => `<label class="w2">${t}<input class="ci" data-k="${k}" maxlength="100" value="${esc(dd[k])}" placeholder="${ph}"></label>`;
    pintar(`<div class="ed-info"><b>Encabezado y firmas de ${esc(o.obra)}</b><br>Los 3 renglones de arriba de cada conciliación y los nombres de quien entrega y quien recibe.</div>
      <div class="ed-g">${campo('enc1', 'Renglón 1 (el más grande)', 'Ej. nombre del proyecto')}${campo('enc2', 'Renglón 2', 'Ej. sección o tramo')}
        ${campo('enc3', 'Renglón 3', 'Ej. lugar y calle')}${campo('entrega', 'Entrega (firma)', 'Nombre de quien entrega')}${campo('recibe', 'Recibe (firma)', 'Nombre de quien recibe')}</div>
      <div class="dlg-b"><button class="ftb" data-a="volver">Cancelar</button><button class="ftb p" data-a="guardarDatos">Guardar</button></div>`);
    cuerpo().querySelector('[data-k=enc1]').focus();
  }
  async function guardarDatos(btn) {
    const datos = { obra:obraSel().obra };
    ['enc1', 'enc2', 'enc3', 'entrega', 'recibe'].forEach(k => datos[k] = valor(k));
    if (!datos.enc1 && !datos.enc2 && !datos.enc3) return alert('Escribe al menos un renglón del encabezado.');
    if (await enviar(btn, { action:'obra_datos', datos })) { aviso = 'Encabezado y firmas guardados.'; principal(); }
  }

  async function enviar(btn, body) {
    ov.querySelectorAll('button').forEach(b => b.disabled = true);
    const t = btn.textContent; btn.textContent = 'Guardando…'; bar(true);
    try { const r = await api(body); D = r; return r; }
    catch(e) {
      ov.querySelectorAll('button').forEach(b => b.disabled = false); btn.textContent = t;
      alert('No se guardó: ' + e.message);
      return null;
    } finally { bar(false); }
  }

  // ── Excel con el formato de siempre (ExcelJS: bordes, letras y formato de pesos) ──
  const MONEDA = '_-"$"* #,##0.00_-;\\-"$"* #,##0.00_-;_-"$"* "-"??_-;_-@_-';
  const BORDE = { top:{ style:'thin' }, left:{ style:'thin' }, bottom:{ style:'thin' }, right:{ style:'thin' } };
  const COLS = 'ABCDEFGH';
  const columnas = (a, b) => COLS.slice(COLS.indexOf(a), COLS.indexOf(b) + 1).split('');
  // Fecha como día de Excel (ExcelJS la pasa en UTC)
  const fechaXl = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  async function libro() { if (!window.ExcelJS) await cargarScript(EXCELJS_URL); return new ExcelJS.Workbook(); }
  const hoja = (wb, nombre, horizontal) => wb.addWorksheet(nombre, { views:[{ showGridLines:false }],
    pageSetup:{ orientation:horizontal ? 'landscape' : 'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true,
                margins:{ left:0.5, right:0.5, top:0.6, bottom:0.6, header:0.3, footer:0.3 } } });
  function celda(ws, ref, value, estilo = {}) {
    const c = ws.getCell(ref);
    c.value = value;
    if (estilo.font) c.font = estilo.font;
    c.alignment = estilo.alignment || { horizontal:'center', vertical:'middle' };
    if (estilo.border) c.border = estilo.border;
    if (estilo.fill) c.fill = estilo.fill;
    if (estilo.numFmt) c.numFmt = estilo.numFmt;
    return c;
  }
  function encabezado(ws, dd, linea4) {
    [[1, dd.enc1, 22, 27.75], [2, dd.enc2, 14, 18.75], [3, dd.enc3, 14, 18.75], [4, linea4, 12, 15.75]].forEach(([f, t, sz, alto]) => {
      ws.mergeCells(`A${f}:H${f}`);
      celda(ws, `A${f}`, t, { font:{ name:'Times New Roman', size:sz } });
      ws.getRow(f).height = alto;
    });
  }
  // ENTREGA / RECIBE, espacio para firmar, la línea y el nombre
  function firmas(ws, f, dd) {
    [['B', 'D', 'ENTREGA', dd.entrega], ['G', 'H', 'RECIBE', dd.recibe]].forEach(([a, b, t, nombre]) => {
      ws.mergeCells(`${a}${f}:${b}${f}`); celda(ws, `${a}${f}`, t);
      columnas(a, b).forEach(col => ws.getCell(`${col}${f + 3}`).border = { bottom:{ style:'thin' } });
      ws.mergeCells(`${a}${f + 4}:${b}${f + 4}`); celda(ws, `${a}${f + 4}`, nombre);
    });
  }
  const nombreArchivo = s => s.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.xlsx';

  async function excelConc(o, c) {
    const vs = viajesDe(o, c.desde, c.hasta), s = suma(vs), dd = datos(o), wb = await libro();
    const ws = hoja(wb, `CONC ${c.n}`);
    ws.columns = [7.71, 11, 12.5, 18, 11.5, 8, 13.14, 15.43].map(width => ({ width }));
    encabezado(ws, dd, 'CONCILIACIÓN ' + periodoTxt(c.desde, c.hasta));
    ws.mergeCells('G5:H5');
    celda(ws, 'G5', `CONCILIACIÓN ${c.n}`, { font:{ name:'Times New Roman', size:12, bold:true } });
    ['N°', 'FOLIO', 'FECHA', 'MATERIAL', 'PLACA', 'M3', 'COSTO', 'COSTO FINAL'].forEach((t, i) => celda(ws, COLS[i] + 6, t, { font:{ bold:true }, border:BORDE }));
    vs.forEach((v, i) => {
      const f = 7 + i;
      [i + 1, String(v.folio ?? ''), fechaXl(v.fecha), String(v.material || '').toUpperCase(), v.placa, N(v.m3), v.precio,
       { formula:`G${f}*F${f}`, result:v.importe }].forEach((x, j) =>
        celda(ws, COLS[j] + f, x, { border:BORDE, numFmt:j === 1 ? '@' : j === 2 ? 'dd/mm/yyyy' : j >= 6 ? MONEDA : undefined }));
    });
    const u = 6 + Math.max(vs.length, 1), t = u + 1, t2 = t + 2;
    celda(ws, 'E' + t, 'M3', { font:{ bold:true } });
    celda(ws, 'F' + t, { formula:`SUM(F7:F${u})`, result:s.m3 }, { font:{ bold:true } });
    celda(ws, 'G' + t, 'SUBTOTAL', { font:{ bold:true } });
    celda(ws, 'H' + t, { formula:`SUM(H7:H${u})`, result:s.importe }, { font:{ bold:true }, numFmt:MONEDA });
    celda(ws, 'B' + t2, 'TOTAL VIAJES', { font:{ bold:true } });
    celda(ws, 'C' + t2, { formula:`COUNT(A7:A${u})`, result:s.viajes }, { font:{ bold:true } });
    celda(ws, 'E' + t2, 'M3', { font:{ bold:true } });
    celda(ws, 'F' + t2, { formula:`F${t}`, result:s.m3 }, { font:{ bold:true } });
    celda(ws, 'G' + t2, 'TOTAL', { font:{ bold:true } });
    celda(ws, 'H' + t2, { formula:`H${t}`, result:s.importe }, { font:{ bold:true }, numFmt:MONEDA });
    firmas(ws, t2 + 3, dd);
    return { wb, nombre:nombreArchivo(`CONC ${c.n} ${o.obra}`) };
  }

  async function excelResumen(o) {
    const cs = concDe(o), dd = datos(o), wb = await libro();
    const ws = hoja(wb, 'RESUMEN', true);
    ws.columns = [8, 13, 13, 14.71, 19.43, 6, 13, 14].map(width => ({ width }));
    encabezado(ws, dd, 'RESUMEN DE CONCILIACIONES ' + periodoTxt(cs[0].desde, cs[cs.length - 1].hasta));
    ws.mergeCells('B6:D6');
    celda(ws, 'B6', (o.cliente || '').toUpperCase(), { font:{ bold:true, size:12 } });
    const azul = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF4472C4' } }, blanca = { bold:true, size:14, color:{ argb:'FFFFFFFF' } };
    ['A', 'B', 'C', 'D', 'E'].forEach(col => ws.getCell(col + 7).border = BORDE);
    ws.mergeCells('B7:D7');
    celda(ws, 'A7', 'CONC', { font:blanca, fill:azul, border:BORDE });
    celda(ws, 'B7', 'PERIODO', { font:blanca, fill:azul, border:BORDE });
    celda(ws, 'E7', 'MONTO', { font:blanca, fill:azul, border:BORDE });
    ws.getRow(7).height = 21;
    cs.forEach((c, i) => {
      const f = 8 + i;
      ['A', 'B', 'C', 'D', 'E'].forEach(col => ws.getCell(col + f).border = BORDE);
      celda(ws, 'A' + f, c.n, { border:BORDE });
      ws.mergeCells(`B${f}:D${f}`);
      celda(ws, 'B' + f, periodoTxt(c.desde, c.hasta), { border:BORDE });
      celda(ws, 'E' + f, c.importe, { border:BORDE, numFmt:MONEDA });
    });
    const u = 7 + cs.length, t = u + 1, amarillo = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFFF00' } };
    celda(ws, 'D' + t, 'TOTAL', { font:{ bold:true }, fill:amarillo, border:BORDE });
    celda(ws, 'E' + t, { formula:`SUM(E8:E${u})`, result:r2(cs.reduce((x, c) => x + c.importe, 0)) }, { font:{ bold:true }, fill:amarillo, border:BORDE, numFmt:MONEDA });
    firmas(ws, t + 4, dd);
    return { wb, nombre:nombreArchivo(`RESUMEN ${o.cliente || ''} ${o.obra}`) };
  }

  async function bajar({ wb, nombre }) {
    ultimo = { wb, nombre };
    if (window.SIN_DESCARGAR) return;           // las pruebas revisan el libro sin descargarlo
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  async function descargar(btn, hacer, aviso) {
    const t = btn.textContent; btn.disabled = true; btn.textContent = 'Armando…';
    try { await bajar(await hacer()); }
    catch(e) { alert('No se pudo armar el Excel: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = t; }
  }
  async function bajarConc(btn, n) {
    const o = obraSel(), c = concDe(o).find(x => x.n === n), a = ahora(o, c);
    if (!cuadra(c, a) && !(await preguntar(`La conciliación ${n} se entregó con ${nViajes(c.viajes)} y ${$$(c.importe)}; ahora suma ${nViajes(a.viajes)} y ${$$(a.importe)}.\n\nEl Excel sale con los viajes y precios de ahora. ¿Descargar así?`, 'Sí, descargar'))) return;
    descargar(btn, () => excelConc(o, c));
  }

  function cerrar() { ov?.remove(); ov = null; removeEventListener('keydown', tecla, true); }
  function tecla(e) { if (e.key === 'Escape' && document.querySelectorAll('.dlg').length === 1) { e.preventDefault(); cerrar(); } }
  async function abrir() {
    cerrar();
    ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c ed ob" role="dialog"><div class="dlg-t" style="margin-bottom:8px"><b>Conciliaciones</b></div>
      <div class="ob-cuerpo"><div class="ob-vacio">Leyendo obras y viajes del último año…</div></div></div>`;
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
      const a = b.dataset.a, n = Number(b.dataset.n);
      if (a === 'cerrar') cerrar();
      else if (a === 'volver') principal();
      else if (a === 'datos') formDatos();
      else if (a === 'guardarDatos') guardarDatos(b);
      else if (a === 'guardar') guardar(b);
      else if (a === 'quitar') quitar(b, n);
      else if (a === 'bajar') bajarConc(b, n);
      else if (a === 'resumen') descargar(b, () => excelResumen(obraSel()));
      else if (a === 'precio') { const o = obraSel(); cerrar(); Obras.abrir({ cliente:o.cliente, obra:o.obra, material:b.dataset.m, desde:b.dataset.f }); }
    });
    ov.addEventListener('change', e => {
      if (e.target.dataset.k !== 'obra') return;
      obraK = e.target.value; try { localStorage.setItem('cc-obra', obraK); } catch(x) {}
      principal();
    });
    ov.addEventListener('input', e => { if (e.target.dataset.k === 'desde' || e.target.dataset.k === 'hasta') previa(); });
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    const hoy = txtFecha(new Date());
    bar(true);
    try { [D, V] = await Promise.all([api({ action:'obras_lista' }), api({ action:'viajes_semana', desde:masDias(hoy, -DIAS_ATRAS), hasta:hoy })]); }
    catch(e) { if (ov) pintar(`<div class="ob-vacio">No se pudo leer: ${esc(e.message)}</div><div class="dlg-b"><button class="ftb" data-a="cerrar">Cerrar</button></div>`); return; }
    finally { bar(false); }
    if (!ov) return;
    // Obra: la del filtro de Fletes, la última que se usó, o la del viaje más reciente
    const hay = k => k && (D.obras || []).some(o => claveVj(o.obra) === k);
    let guardada = ''; try { guardada = localStorage.getItem('cc-obra') || ''; } catch(x) {}
    const reciente = (V.viajes || []).filter(v => !v.planta && hay(claveVj(v.obra))).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    obraK = [FV.obra, guardada, reciente && claveVj(reciente.obra), obrasOrden()[0] && claveVj(obrasOrden()[0].obra)].find(hay) || '';
    principal();
  }
  return { abrir, get ultimo() { return ultimo; } };
})();

// ══════════════════════════════════════════
//  EDITAR UN REGISTRO YA GUARDADO (botón ✏): notas de viaje y tickets de diésel
//  El servidor revisa que en esa fila siga el mismo registro y solo escribe lo que cambió.
//  Anular (solo notas) no borra: la nota deja de contar y se puede restaurar desde Fletes › Viajes.
// ══════════════════════════════════════════
const seccionVisible = s => document.getElementById('sec-' + s)?.classList.contains('on');

function EditorRegistro(cfg) {
  let cat = null;
  const NOMBRE = Object.fromEntries(cfg.campos.map(([k, t]) => [k, cfg.nombres?.[k] || t]));
  // Opciones de un desplegable; si lo que tiene el registro no está en el catálogo, se agrega para no perderlo
  function opciones(lista, actual) {
    const ops = lista.map(o => typeof o === 'object' ? o : { v:o, t:o });
    if (actual && !ops.some(o => claveVj(o.v) === claveVj(actual))) ops.unshift({ v:actual, t:actual + ' (no está en el catálogo)' });
    return `<option value="">—</option>` + ops.map(o => `<option value="${esc(o.v)}" ${actual && claveVj(o.v) === claveVj(actual) ? 'selected' : ''}>${esc(o.t)}</option>`).join('');
  }
  // Sin fila (p. ej. viajes a la planta, que se corrigen en Registro) no hay ✏
  const boton = fila => Number(fila) ? `<button class="btn-ed" onclick="${cfg.nombre}.abrir(${Number(fila)})" title="${cfg.ayuda}">✏</button>` : '';

  async function abrir(fila) {
    const v = cfg.buscar(fila);
    if (!v) return alert(`No encontré ${cfg.ese}. Toca Actualizar y vuelve a intentarlo.`);
    if (!cat) cat = cfg.catLocal() || null;
    if (!cat) {
      bar(true);
      try { cat = await api({ action:cfg.accionCat }); }
      catch(e) { return alert('No se pudieron cargar los catálogos: ' + e.message); }
      finally { bar(false); }
    }
    const campo = ([k, t, tipo, ancho, attr]) => {
      const x = cfg.valorDe(v, k);
      const ctl = tipo === 'sel' ? `<select class="ci" data-k="${k}">${opciones(cfg.lista(k, v, cat), x)}</select>`
        : `<input class="ci" data-k="${k}" type="${tipo}" value="${esc(x)}" ${attr || ''}>`;
      return `<label${ancho ? ' class="w2"' : ''}>${t}${ctl}</label>`;
    };
    const ov = document.createElement('div');
    ov.className = 'dlg';
    ov.innerHTML = `<div class="dlg-c ed" role="dialog">
      <div class="dlg-t" style="margin-bottom:8px"><b>${esc(cfg.titulo(v))}</b></div>
      <div class="ed-info">${cfg.info(v, cat)}<br>Cambia lo que haga falta y toca Guardar. Queda anotado quién lo cambió y qué.</div>
      <div class="ed-g">${cfg.campos.map(campo).join('')}</div>
      <div class="dlg-b">${cfg.anular ? `<button class="ftb ed-anular" data-a="anular">${v.anulada ? 'Restaurar nota' : 'Anular nota'}</button>` : ''}
        <button class="ftb" data-a="no">Cancelar</button><button class="ftb p" data-a="si">Guardar cambios</button></div></div>`;
    const cerrar = () => { ov.remove(); removeEventListener('keydown', tecla, true); };
    const tecla = e => { if (e.key === 'Escape' && document.querySelectorAll('.dlg').length === 1) { e.preventDefault(); cerrar(); } };
    const leer = () => {
      const cambios = {};
      ov.querySelectorAll('[data-k]').forEach(el => {
        const k = el.dataset.k, orig = cfg.valorDe(v, k);
        let x = el.value.trim();
        if (cfg.norm) x = cfg.norm(k, x);
        const igual = cfg.numeros.includes(k) ? Number(x || 0) === Number(orig || 0) : x === orig;
        el.classList.toggle('cambio', !igual);
        if (!igual) cambios[k] = x;
      });
      return cambios;
    };
    ov.addEventListener('input', e => { leer(); cfg.alCambiar?.(e.target.dataset.k, e.target.value, ov, cat); });
    ov.addEventListener('change', () => leer());
    ov.addEventListener('click', async e => {
      const a = e.target.dataset?.a;
      if (a === 'no') return cerrar();
      if (a === 'si') {
        const cambios = leer(), ks = Object.keys(cambios);
        if (!ks.length) return alert('No cambiaste nada.');
        const mal = cfg.validar(cambios);
        if (mal) return alert(mal);
        const txt = x => x === '' || x == null ? '(vacío)' : x;
        if (!(await preguntar(`${cfg.titulo(v)}:\n\n` + ks.map(k => `${NOMBRE[k]}: ${txt(cfg.valorDe(v, k))} → ${txt(cambios[k])}`).join('\n') + '\n\n¿Guardar?', 'Sí, guardar'))) return;
        return enviar(e.target, { cambios });
      }
      if (a === 'anular') {
        const msg = v.anulada ? `¿Restaurar la nota ${v.folio || 's/folio'} del ${v.fecha}? Vuelve a contar en Fletes y en el Diario.`
          : `¿Anular la nota ${v.folio || 's/folio'} del ${v.fecha}?\n\nDeja de contar en Fletes y en el Diario (por ejemplo si quedó repetida). No se borra: se puede restaurar desde Fletes › Viajes, en "Notas anuladas".`;
        if (!(await preguntar(msg, v.anulada ? 'Sí, restaurar' : 'Sí, anular'))) return;
        return enviar(e.target, { anular:!v.anulada });
      }
    });
    async function enviar(btn, extra) {
      ov.querySelectorAll('button').forEach(b => b.disabled = true);
      const txt = btn.textContent; btn.textContent = 'Guardando…'; bar(true);
      try {
        await Sesion.api(cfg.cuerpo(v, extra), 60000);
        cerrar();
        cfg.refrescar();
      } catch(e) {
        ov.querySelectorAll('button').forEach(b => b.disabled = false); btn.textContent = txt;
        alert('No se guardó: ' + e.message);
      } finally { bar(false); }
    }
    addEventListener('keydown', tecla, true);
    document.body.appendChild(ov);
    ov.querySelector(`[data-k="${cfg.foco}"]`)?.focus();
  }
  return { abrir, boton };
}

// ── Notas de viaje: Fletes › Viajes, Diario y Subir notas › Registradas por día ──
const EditNota = EditorRegistro({
  nombre:'EditNota', ayuda:'Editar o anular esta nota', ese:'esa nota', anular:true, accionCat:'notas_catalogos', foco:'m3',
  // [campo, texto, tipo, ocupa los dos lados, atributos]
  campos: [['folio', 'Folio', 'text'], ['fecha', 'Fecha de la nota', 'date'], ['chofer', 'Chofer', 'sel'], ['placa', 'Placa', 'sel'],
    ['obra', 'Obra', 'sel', true], ['material', 'Material', 'sel'], ['m3', 'm³', 'number', false, 'step="0.5" min="0"'],
    ['observaciones', 'Observaciones', 'text', true, 'maxlength="300"']],
  nombres: { fecha:'Fecha' }, numeros: ['m3'],
  valorDe: (v, k) => k === 'observaciones' ? String(v.obs ?? '') : k === 'm3' ? (v.m3 ? String(v.m3) : '') : String(v[k] ?? ''),
  norm: (k, x) => k === 'placa' ? placaK(x) : x,
  // De lo que está en pantalla, que es lo más reciente que se leyó
  buscar: fila => {
    if (seccionVisible('diario')) return Diario.notaFila(fila);
    if (seccionVisible('subir')) return RegNotas.notaFila(fila);
    const a = (VJ?.anuladas || []).find(v => v.fila === fila);
    return a ? { ...a, anulada:true } : (VJ?.viajes || []).find(v => v.fila === fila);
  },
  catLocal: () => SUB.nt?.catalogo?.(),
  lista: (k, v, cat) => {
    if (k === 'chofer') return cat.choferes || [];
    if (k === 'placa') return opsPlacas(cat);
    if (k === 'obra') return (cat.obras || []).map(o => o.obra);
    // Material: primero los que ya se han llevado a esa obra
    const us = usadosEnObra(v.obra, cat);
    return [...us, ...(cat.materiales || []).filter(m => !us.includes(m))];
  },
  titulo: v => `${v.anulada ? 'Nota anulada' : 'Nota'} ${v.folio || 's/folio'} del ${v.fecha || 'sin fecha'}`,
  info: v => `A nombre de: <b data-cli>${esc(v.cliente) || '—'}</b>${/^https:\/\/drive\.google\.com\//.test(v.foto) ? ` · <a href="${esc(v.foto)}" target="_blank" rel="noopener">Ver foto</a>` : ' · sin foto'}`,
  alCambiar: (k, x, ov, cat) => { if (k === 'obra') ov.querySelector('[data-cli]').textContent = clienteDeObra(x, cat) || '— (obra sin cliente)'; },
