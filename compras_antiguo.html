<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d97706">
<title>Captura de compras</title>
<style>
:root{--bg:#f3f3f0;--card:#fff;--bd:#d9d9d3;--text:#1a1a1a;--muted:#66665f;--amb:#d97706;--amb-bg:#fff6e5;
  --ok:#15803d;--ok-bg:#eaf8ef;--warn:#9a4a06;--warn-bg:#fff1dc;--err:#b91c1c;--err-bg:#fdeaea;--in:#fbfbf9}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#151515;--bd:#2c2c2c;--text:#e8e8e8;--muted:#8d8d86;--amb:#f59e0b;--amb-bg:#2a1f08;
  --ok:#4ade80;--ok-bg:#0f2417;--warn:#fbbf24;--warn-bg:#2a2108;--err:#f87171;--err-bg:#2a1010;--in:#0f0f0f}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;padding-bottom:110px}
header{background:var(--card);border-bottom:3px solid var(--amb);padding:12px 16px;position:sticky;top:0;z-index:10}
header .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px}
header small{display:block;color:var(--muted);font-size:12px}
main{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px}
.card h2 .u{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--text);min-width:0}
textarea{min-height:70px;resize:vertical;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amb);outline-offset:0;border-color:var(--amb)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{font:inherit;font-size:15px;font-weight:600;padding:12px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--text);cursor:pointer}
.op.on{border-color:var(--amb);background:var(--amb-bg);color:var(--amb);box-shadow:inset 0 0 0 1px var(--amb)}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.calc span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.calc .big{font-size:18px;font-weight:700;padding-top:6px;border-top:1px solid var(--bd);margin-top:4px}
.res{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:14px}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.err{background:var(--err-bg);color:var(--err)}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer}
.btn.p{background:var(--amb);border-color:var(--amb);color:#000;flex:1}
.btn.sm{font-size:14px;padding:8px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
details.card summary{font-size:15px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:'▾';color:var(--muted)}
details[open].card summary{margin-bottom:10px}
.hist{font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd)}
.hist div:first-child{border-top:none}
.hist b{color:var(--amb)}
.msg{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;padding:12px 14px;border-radius:10px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20;display:none}
.msg.on{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.err{background:var(--err-bg);color:var(--err)}
</style>
</head>
<body>

<header><div class="in">
  <div><h1>Captura de compras</h1><small id="h-op">—</small></div>
  <button class="btn sm" onclick="limpiar(true)">Nueva</button>
</div></header>

<main>
  <!-- CONFIGURACIÓN (se guarda en este equipo) -->
  <details class="card" id="cfg">
    <summary>Configuración</summary>
    <div class="g2">
      <div class="f"><label>Tu nombre</label><input id="capturo" autocomplete="name"></div>
      <div class="f"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    </div>
    <div class="hint" style="margin:-4px 0 10px">Se escriben una sola vez y se quedan guardados en este equipo. El nombre queda anotado en cada compra.</div>
    <button class="btn sm" onclick="guardarCfg()">Guardar y probar conexión</button>
    <div class="res" id="cfg-res"></div>
  </details>

  <!-- QUÉ SE COMPRÓ -->
  <div class="card">
    <h2>¿Qué se compró?</h2>
    <div class="ops" id="insumos"></div>
  </div>

  <!-- DATOS DE LA FACTURA -->
  <div class="card">
    <h2>Datos de la factura</h2>
    <div class="g2 f">
      <div><label>Fecha de la factura o entrega</label><input type="date" id="fecha"></div>
      <div><label>Litros</label><input id="cantidad" inputmode="decimal" placeholder="Ej. 31130"></div>
    </div>
    <div class="g2 f">
      <div><label>Proveedor</label><input id="proveedor" list="dl-prov" placeholder="Escribe o elige"></div>
      <div><label>Folio de factura</label><input id="factura" placeholder="opcional"></div>
    </div>
  </div>

  <!-- PRECIO -->
  <div class="card">
    <h2>Precio <span class="u">como viene en la factura</span></h2>
    <div class="g2 f">
      <div><label>Precio por litro ($)</label><input id="precio" inputmode="decimal" placeholder="Ej. 13.95"></div>
      <div><label>IVA</label>
        <select id="iva">
          <option value="sin">No lleva IVA</option>
          <option value="mas">Precio sin IVA (+16%)</option>
          <option value="incl">El precio ya incluye IVA</option>
        </select></div>
    </div>
    <div class="g2 f">
      <div><label>Flete total ($)</label><input id="flete" inputmode="decimal" placeholder="0 si no hubo"></div>
      <div><label>Total de la factura ($)</label><input id="total_fac" inputmode="decimal" placeholder="para comprobar"></div>
    </div>
    <div class="f"><label>Notas</label><textarea id="notas" placeholder="Ej. llegó en 2 pipas, faltó firma, etc."></textarea></div>
  </div>

  <!-- CÁLCULO -->
  <div class="card">
    <h2>Así se va a guardar</h2>
    <div class="calc" id="calc"></div>
    <div class="res" id="cmp"></div>
  </div>

  <!-- GUARDADAS -->
  <div class="card" id="hist-card" style="display:none">
    <h2>Guardadas en este equipo</h2>
    <div class="hist" id="hist"></div>
  </div>
</main>

<div class="msg" id="msg"></div>

<div class="bar"><div class="in">
  <button class="btn p" id="btn-send" onclick="enviar()">Guardar compra</button>
</div></div>

<datalist id="dl-prov">
  <option value="Ekbe">
</datalist>

<script>
// ══════════════════════════════════════════
//  CONFIGURACIÓN
// ══════════════════════════════════════════
// Solo agrega filas a Entradas_Material; esta página no puede leer nada del Sheets.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhfIDfclX_CXOMH_FBDZVaQKQ8Qe6oBWQKCvHoPIQgWsUcSBz7Q0BSmGba2LKBtSfq/exec';
const INSUMOS = [
  { v:'CEMENTO ASFALTICO',   n:'Asfalto' },
  { v:'COMBUSTIBLE ALTERNO', n:'Combustible alterno' },
  { v:'DIESEL',              n:'Diésel' },
  { v:'GASOLINA',            n:'Gasolina' },
];
const IVA = 0.16;

const LS = {
  get(k, d) { try { const v = localStorage.getItem('cmp_'+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('cmp_'+k, JSON.stringify(v)); } catch(e) {} },
};

let INSUMO = '';
let ID = null;          // id de este envío: si se reintenta, el servidor no lo duplica

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
const $ = s => document.querySelector(s);
// Acepta "31 130", "31,130", "$13.95", "13,95"
function num(s) {
  s = String(s ?? '').trim().replace(/[\s$]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
const money = (v, d=2) => v==null ? '—' : '$' + new Intl.NumberFormat('es-MX', { minimumFractionDigits:d, maximumFractionDigits:d }).format(v);
const fmt   = (v, d=2) => v==null ? '—' : new Intl.NumberFormat('es-MX', { maximumFractionDigits:d }).format(v);
const hoy   = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fLarga = f => f ? new Date(f+'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' }) : '';
const nuevoId = () => 'C-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
const nombreInsumo = v => INSUMOS.find(i => i.v === v)?.n || v;

// ══════════════════════════════════════════
//  FORMULARIO
// ══════════════════════════════════════════
function construir() {
  $('#insumos').innerHTML = INSUMOS.map(i => `<button type="button" class="op" data-v="${i.v}">${i.n}</button>`).join('');
  $('#insumos').addEventListener('click', e => {
    const b = e.target.closest('.op'); if (!b) return;
    INSUMO = b.dataset.v; pintarInsumo(); calcular();
  });
  document.querySelector('main').addEventListener('input', calcular);
  document.querySelector('main').addEventListener('change', calcular);
}
function pintarInsumo() {
  document.querySelectorAll('#insumos .op').forEach(b => b.classList.toggle('on', b.dataset.v === INSUMO));
}

// Lo que se manda al Sheets, en el formato de Entradas_Material
function recolectar() {
  const precio = num($('#precio').value), modo = $('#iva').value;
  return {
    id: ID,
    fecha: $('#fecha').value,
    insumo: INSUMO,
    cantidad: num($('#cantidad').value),
    proveedor: $('#proveedor').value.trim(),
    factura: $('#factura').value.trim(),
    precio_unit_base: precio == null ? null : modo === 'incl' ? precio / (1 + IVA) : precio,
    iva: modo === 'sin' ? 0 : IVA,
    flete: num($('#flete').value) || 0,
    notas: $('#notas').value.trim(),
    capturo: $('#capturo').value.trim(),
  };
}
function costos(c) {
  if (c.precio_unit_base == null || !c.cantidad) return null;
  const ivaL = c.precio_unit_base * c.iva, fleteL = c.flete / c.cantidad;
  const unit = c.precio_unit_base + ivaL + fleteL;
  return { ivaL, fleteL, unit, total: unit * c.cantidad };
}
function errores(c) {
  const e = [];
  if (!c.insumo) e.push('Elige qué se compró');
  if (!c.fecha) e.push('Falta la fecha');
  else if (c.fecha > hoy()) e.push('La fecha es de un día que todavía no pasa');
  if (!c.cantidad || c.cantidad <= 0) e.push('Faltan los litros');
  if (c.precio_unit_base == null) e.push('Falta el precio por litro');
  if (!c.proveedor) e.push('Falta el proveedor');
  return e;
}

function calcular() {
  const c = recolectar(), k = costos(c);
  $('#calc').innerHTML = `
    <span>Precio por litro sin IVA</span><span>${money(c.precio_unit_base, 4)}</span>
    <span>IVA por litro</span><span>${k ? money(k.ivaL, 4) : '—'}</span>
    <span>Flete por litro</span><span>${k ? money(k.fleteL, 4) : '—'}</span>
    <span class="big">Costo real por litro</span><span class="big">${k ? money(k.unit, 4) : '—'}</span>
    <span class="big">Total</span><span class="big">${k ? money(k.total) : '—'}</span>`;

  // Comparación con el total que viene en la factura
  const fac = num($('#total_fac').value), el = $('#cmp');
  if (k && fac != null) {
    const d = k.total - fac;
    el.className = 'res ' + (Math.abs(d) <= 1 ? 'ok' : 'warn');
    el.innerHTML = Math.abs(d) <= 1 ? '✓ Coincide con el total de la factura'
      : `No coincide con la factura: hay ${money(Math.abs(d))} de ${d > 0 ? 'más' : 'menos'}. Revisa el precio, el IVA o el flete.`;
  } else { el.className = 'res'; el.innerHTML = ''; }
}

function limpiar(preguntar) {
  if (preguntar && !confirm('¿Borrar lo capturado y empezar una compra nueva?')) return;
  ID = nuevoId(); INSUMO = ''; pintarInsumo();
  ['cantidad','proveedor','factura','precio','flete','total_fac','notas'].forEach(k => $('#'+k).value = '');
  $('#iva').value = 'sin';
  $('#fecha').value = hoy();
  calcular();
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════
//  ENVÍO
// ══════════════════════════════════════════
async function api(payload) {
  // Sin headers → text/plain: Apps Script lo acepta sin preflight CORS
  const resp = await fetch(SCRIPT_URL, { method:'POST', body:JSON.stringify(payload) });
  let j;
  try { j = await resp.json(); }
  catch(e) { throw new Error('El servidor no respondió como se esperaba (¿ya se publicó la nueva versión del Apps Script?)'); }
  if (j.status !== 'ok') throw new Error(j.message || 'Error del servidor');
  return j;
}
const pin = () => $('#pin').value.trim();

async function enviar() {
  const c = recolectar(), k = costos(c), e = errores(c);
  if (!pin()) { $('#cfg').open = true; $('#pin').focus(); return aviso('Primero escribe tu PIN en Configuración', 'err'); }
  if (e.length) return aviso('Falta completar:<br>• ' + e.join('<br>• '), 'err', 7000);
  if (!confirm(`¿Guardar esta compra?\n\n${nombreInsumo(c.insumo)} · ${fmt(c.cantidad)} L · ${c.proveedor}\n${fLarga(c.fecha)}\nCosto real: ${money(k.unit, 4)} por litro\nTotal: ${money(k.total)}`)) return;

  const btn = $('#btn-send');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const j = await api({ action:'compra', pin:pin(), compra:c });
    const hist = LS.get('hist', []);
    hist.unshift({ id:j.id_entrada, fecha:c.fecha, insumo:c.insumo, cantidad:c.cantidad, total:k.total, proveedor:c.proveedor });
    LS.set('hist', hist.slice(0, 15));
    pintarHist();
    aviso(`✓ Guardada como <b>${j.id_entrada}</b>`, 'ok', 5000);
    limpiar(false);
  } catch(err) {
    aviso('No se pudo guardar: ' + err.message + '<br>No se borró nada; vuelve a intentar.', 'err', 8000);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar compra';
  }
}

function pintarHist() {
  const h = LS.get('hist', []);
  $('#hist-card').style.display = h.length ? '' : 'none';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  $('#hist').innerHTML = h.map(x => `<div><span><b>${esc(x.id)}</b> · ${esc(nombreInsumo(x.insumo))} ${fmt(x.cantidad)} L<br>
    <span style="color:var(--muted)">${esc(x.proveedor)} · ${fLarga(x.fecha)}</span></span><span>${money(x.total)}</span></div>`).join('');
}

// ══════════════════════════════════════════
//  UI GENERAL
// ══════════════════════════════════════════
let msgTimer;
function aviso(html, tipo = 'ok', ms = 4000) {
  const el = $('#msg');
  el.className = `msg on ${tipo}`;
  el.innerHTML = html;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => el.className = 'msg', ms);
  el.onclick = () => el.className = 'msg';
}

async function guardarCfg() {
  LS.set('cfg', { capturo: $('#capturo').value.trim(), pin: pin() });
  $('#h-op').textContent = $('#capturo').value.trim() || 'Sin nombre';
  const res = $('#cfg-res');
  try {
    await api({ action:'cap_ping', pin:pin() });
    res.className = 'res ok'; res.textContent = '✓ Conectado. Ya puedes guardar compras.';
  } catch(e) { res.className = 'res err'; res.textContent = e.message; }
}

// ══════════════════════════════════════════
//  INICIO
// ══════════════════════════════════════════
construir();
const cfg = LS.get('cfg', {});
$('#capturo').value = cfg.capturo || '';
$('#pin').value = cfg.pin || '';
$('#h-op').textContent = cfg.capturo || 'Sin nombre';
if (!cfg.pin) $('#cfg').open = true;
limpiar(false);
pintarHist();
</script>
</body>
</html>
